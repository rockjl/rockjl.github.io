f consistent user interfaces. Here's how to build one that scales.\n\n## Why Design Systems Matter\n\nA well-crafted design system provides:\n\n- **Consistency** across all products\n- **Faster development** with reusable components\n- **Better collaboration** between designers and developers\n- **Reduced technical debt** over time\n\n## Core Principles\n\n### 1. Start with Tokens\n\nDesign tokens are the atomic values of your system:\n\n```typescript title=\"tokens.ts\"\nexport const tokens = {\n  colors: {\n    primary: {\n      50: '#eff6ff',\n      500: '#3b82f6',\n      900: '#1e3a8a',\n    },\n    neutral: {\n      0: '#ffffff',\n      100: '#f5f5f5',\n      900: '#171717',\n    },\n  },\n  spacing: {\n    xs: '0.25rem',\n    sm: '0.5rem',\n    md: '1rem',\n    lg: '1.5rem',\n    xl: '2rem',\n  },\n  radii: {\n    sm: '0.25rem',\n    md: '0.5rem',\n    lg: '1rem',\n    full: '9999px',\n  },\n} as const;\n```\n\n### 2. Build Primitive Components\n\nStart with the basics:\n\n```tsx title=\"Button.tsx\"\nimport { cva, type VariantProps } from \"class-variance-authority\";\n\nconst buttonVariants = cva(\n  \"inline-flex items-center justify-center rounded-md font-medium transition-colors\",\n  {\n    variants: {\n      variant: {\n        primary: \"bg-primary text-white hover:bg-primary/90\",\n        secondary: \"bg-secondary text-secondary-foreground hover:bg-secondary/80\",\n        ghost: \"hover:bg-accent hover:text-accent-foreground\",\n      },\n      size: {\n        sm: \"h-8 px-3 text-sm\",\n        md: \"h-10 px-4\",\n        lg: \"h-12 px-6 text-lg\",\n      },\n    },\n    defaultVariants: {\n      variant: \"primary\",\n      size: \"md\",\n    },\n  }\n);\n\ninterface ButtonProps\n  extends React.ButtonHTMLAttributes\u003cHTMLButtonElement\u003e,\n    VariantProps\u003ctypeof buttonVariants\u003e {}\n\nexport function Button({ variant, size, className, ...props }: ButtonProps) {\n  return (\n    \u003cbutton className={buttonVariants({ variant, size, className })} {...props} /\u003e\n  );\n}\n```\n\n## Component Composition\n\nBuild complex components from primitives:\n\n| Level | Examples | Purpose |\n|-------|----------|---------|\n| Tokens | Colors, spacing, typography | Foundation |\n| Primitives | Button, Input, Badge | Building blocks |\n| Patterns | Card, Modal, Dropdown | Common UI patterns |\n| Templates | PageHeader, Sidebar | Layout structures |\n\n## Documentation is Key\n\n\u003e \"A design system without documentation is just a component library.\"\n\nEvery component should include:\n\n1. **Usage examples** - Show common use cases\n2. **Props documentation** - Explain all options\n3. **Accessibility notes** - ARIA labels, keyboard nav\n4. **Do's and Don'ts** - Guide proper usage\n\n## Versioning Strategy\n\n```json title=\"package.json\"\n{\n  \"name\": \"@company/design-system\",\n  \"version\": \"2.1.0\",\n  \"peerDependencies\": {\n    \"react\": \"^18.0.0\",\n    \"tailwindcss\": \"^3.0.0\"\n  }\n}\n```\n\nUse semantic versioning:\n- **Major**: Breaking changes\n- **Minor**: New features (backward compatible)\n- **Patch**: Bug fixes\n\n## Conclusion\n\nBuilding a design system is an investment that pays dividends in:\n\n- Developer productivity\n- Design consistency\n- User experience\n- Team collaboration\n\nStart small, iterate often, and document everything."])</script><script>self.__next_f.push([1,"27:T1a9e,"])</script><script>self.__next_f.push([1,"var Component=(()=\u003e{var m=Object.create;var s=Object.defineProperty;var p=Object.getOwnPropertyDescriptor;var u=Object.getOwnPropertyNames;var g=Object.getPrototypeOf,y=Object.prototype.hasOwnProperty;var b=(t,n)=\u003e()=\u003e(n||t((n={exports:{}}).exports,n),n.exports),f=(t,n)=\u003e{for(var r in n)s(t,r,{get:n[r],enumerable:!0})},l=(t,n,r,o)=\u003e{if(n\u0026\u0026typeof n==\"object\"||typeof n==\"function\")for(let i of u(n))!y.call(t,i)\u0026\u0026i!==r\u0026\u0026s(t,i,{get:()=\u003en[i],enumerable:!(o=p(n,i))||o.enumerable});retu
