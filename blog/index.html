(通过mint account创建的账户)\n\n```bash\nspl-token account-info --address ${token account}\n```\n\n#### 查看代币供应量\n\n```bash\nspl-token supply ${mint account}\n```\n\n\n\n## 发布智能合约\n\n#### 发布\n\n```bash\nsolana program deploy xxx.so\n```\n\n#### 发布到指定网络\n\n```bash\nsolana program deploy xxx.so --url localhost\n```"])</script><script>self.__next_f.push([1,"21:T15c6,"])</script><script>self.__next_f.push([1,"var Component=(()=\u003e{var u=Object.create;var r=Object.defineProperty;var g=Object.getOwnPropertyDescriptor;var p=Object.getOwnPropertyNames;var m=Object.getPrototypeOf,b=Object.prototype.hasOwnProperty;var x=(a,n)=\u003e()=\u003e(n||a((n={exports:{}}).exports,n),n.exports),k=(a,n)=\u003e{for(var c in n)r(a,c,{get:n[c],enumerable:!0})},s=(a,n,c,o)=\u003e{if(n\u0026\u0026typeof n==\"object\"||typeof n==\"function\")for(let l of p(n))!b.call(a,l)\u0026\u0026l!==c\u0026\u0026r(a,l,{get:()=\u003en[l],enumerable:!(o=g(n,l))||o.enumerable});return a};var N=(a,n,c)=\u003e(c=a!=null?u(m(a)):{},s(n||!a||!a.__esModule?r(c,\"default\",{value:a,enumerable:!0}):c,a)),f=a=\u003es(r({},\"__esModule\",{value:!0}),a);var t=x((j,i)=\u003e{i.exports=_jsx_runtime});var $={};k($,{default:()=\u003ed});var e=N(t());function h(a){let n={code:\"code\",h2:\"h2\",h4:\"h4\",li:\"li\",p:\"p\",pre:\"pre\",ul:\"ul\",...a.components};return(0,e.jsxs)(e.Fragment,{children:[(0,e.jsx)(n.h2,{children:\"\\u7F51\\u7EDC\\u7BA1\\u7406\"}),`\n`,(0,e.jsx)(n.h4,{children:\"\\u5207\\u6362\\u7F51\\u7EDC\"}),`\n`,(0,e.jsx)(n.pre,{children:(0,e.jsx)(n.code,{className:\"language-bash\",children:`solana config set --url localhost\nsolana config set --url https://api.devnet.solana.com\nsolana config set --url https://api.testnet.solana.com\nsolana config set --url https://api.mainnet-beta.solana.com\n`})}),`\n`,(0,e.jsx)(n.h4,{children:\"\\u542F\\u52A8\\u672C\\u5730\\u6D4B\\u8BD5\\u8282\\u70B9\"}),`\n`,(0,e.jsx)(n.pre,{children:(0,e.jsx)(n.code,{className:\"language-bash\",children:`solana-test-validator --ledger ./tes ode,{className:\"language-math\",children:`IL=2*sqrt(r)/(1+r) - 1\n`})})]})}function l(n={}){let{wrapper:e}=n.components||{};return e?(0,r.jsx)(e,{...n,children:(0,r.jsx)(h,{...n})}):h(n)}return L(D);})();\n;return Component;"])</script><script>self.__next_f.push([1,"23:Tc160,"])</script><script>self.__next_f.push([1,"## Solana八大核心概念\n\n1. 历史证明---PoH\n   - 核心定位：加密时间基准，解决区块链节点时间同步瓶颈\n   - 地层逻辑：通过链式哈希生成不可篡改时间序列，为每笔交易分配为一可信时间戳，节点无需频繁通信即可独立验证交易顺序，是高频并发的基础\n\n2. 塔式拜占庭容错---TowerBFT\n   - 核心定位： 优化版共识协议，基于PoH实现高效共识。\n   \n   - 地层逻辑：复用PoH时间序列，记录节点投票历史，减少全量交易链验证需求，兼顾去中心化、安全性与共识效率，值乘网络稳定达成一致。\n   \n     TowerBFT投票机制的核心要点：\n   \n     - 验证者按**质押权重投票**，形成**投票塔结构**\n     - 投票塔中锁定期**指数级增长**(1, 2, 4, ..., 2^31)，32 次投票后达到**最大锁定期 (2^32)**\n     - **乐观确认**是**最终确认 32 次中的第 1 次投票**，两者是**包含关系**，非独立流程\n     - 最终确认意味着区块**不可逆**，攻击成本**极高**(需\u003e 1/3 质押权益共谋)\n   \n     Solana 的 400ms 固定槽位是其高性能共识系统的基石\n   \n     - **时间秩序**：为网络提供确定性的时间流，确保交易有序处理\n     - **去中心化**：通过领导者轮换 (每 400ms) 防止权力集中\n     - **快速确认**：400ms 出块时间 + 指数级投票锁定，实现 12.8 秒最终确认\n     - **高吞吐量**：每个槽位可处理数千交易，支撑 Solana 的高性能表现\n   \n3. Rotor--https://www.anza.xyz/alpenglow-1-1\n\n   - 核心定位：负责“数据传播优化”的核心组件，专注解决区块链网络中最关键的“如何高效传输区块数据”问题。替代原POH的时间戳调度逻辑。替代原Turbine的多层树状200+跳。\n   - 地层逻辑：\n     - **单跳中继架构**：采用 \"一跳分片传播\"，数据直接从源节点经专用中继发送到目标节点，跳过传统多跳 gossip，**减少 40% 带宽消耗，与90%+网络跳数**\n     - **分片-编码-重组**：将区块拆分为多个数据片段，每个片段使用纠删码(Erasure Coding)编码。即使部分节点离线或数据包丢失，只需要50%片段即可完成整重建原始区块。分片大小与数量动态调整，适配不同网络条件与区块大小。\n     - **质押权重导向**：中继节点选择和带宽分配基于验证者的质押权重。高质押验证者承担更多传播责任，获得更多带宽资源。确保“更大贡献者获得更大影响力”，与PoS共识经济模型一致。\n     - **时间戳优化**：内置轻量级时间同步机制，替代原 PoH 的递归哈希时间戳，降低计算开销，同时保持事件顺序验证能力\n     - **确定性传播**：每个区块传播路径在生成前已确定，形成固定的“传播树”。所有节点严格遵循预定义的传播顺序，确保全网状态一致。结合固定400ms槽位时间，实现时间与空间的精确同步。\n\n4. Votor--https://www.anza.xyz/alpenglow-1-1\n\n   - 核心定位：新一代高效拜占庭容错共识引擎，负责区块最终性确认和投票决策。采用20+20容错模型，将共识活动从链上移至链下。“投票与区块最终性”的核心组件，通过革命性的直接投票机制代替TowerBFT，实现亚秒级确认。\n\n   - 地层逻辑：\n\n      一、核心定义与结构\n\n     **Votor 的 \"20+20 容错模型\" 是 Alpenglow 共识协议的核心安全机制，它将网络故障分为两类并分别提供保障：**\n\n     - **拜占庭故障 ≤ 20%**: 当最多 20% 的质押权益被恶意验证者控制时，**安全性**(链的一致性) 仍然成立\n     - **非恶意现象 ≤ 20%**: 当最多 20% 的质押权益 (与恶意权益分开) 离线或无响应时，**活跃性**(链的持续运行) 仍然成立\n     \n     **关键特性**: 这两个 20% 是**独立计算**的，意味着网络总共可容忍**40% 的异常验证者**(20% 恶意 + 20% 离线)，仍能正常工作\n     \n      二、安全性保障机制 (拜占庭故障≤20%)\n     \n     **安全性**是指区块链不会产生错误状态 (如双花)，即使面对恶意攻击:\n     \n      1. 防御原理\n     \n     - **降低拜占庭容错阈值**: 从 Tower BFT 的 33% 降至 20%，使攻击成本更高\n     - **基于 \"5f+1\" 理论**: 源自分布式系统经典论文，确保在 f 个故障节点存在时仍能达成共识\n     - **投票权重保护**: 验证者投票权重与其质押权益成正比，恶意节点即使控制 20% 权益，也无法主导投票\n     \n      2. 具体防御措施\n     \n     - **双重验证**: 区块需获得 **≥80% 权益批准 **(单轮) 或 **≥60% 权益两轮批准 ** 才能最终确认，使恶意节点难以操纵结果\n     - **冲突检测**: 两个冲突区块无法同时获得最终确认，因为它们的权益投票会重叠，系统会识别并拒绝\n     - **BLS 聚合签名**: 将多个验证者签名聚合成单个证书，便于快速验证，同时增加恶意节点伪造难度\n     - **可证明作弊**: 恶意验证者若对冲突区块双重签名，其行为将被全网识别，可能导致质押被罚没\n     \n      三、活跃性保障机制 (非恶意现象≤20%)\n     \n     **活跃性**是指网络能持续生成和确认区块，即使部分节点离线或响应缓慢:\n     \n      1. 网络弹性设计\n     \n     - **分层投票策略**:\n       - 快速路径：首轮获 **≥80% 权益 ** 支持，**100ms 内**完成确认\n       - 慢速路径：首轮**60-80% 权益**支持，启动第二轮，两轮均达 **≥60%**，**150ms 内**完成确认\n       - 两种路径**并行执行**，先满足条件者生效\n     - **单跳传播**: Rotor 组件采用单层中继节点，将区块传播延迟控制在 **≤150ms**，减少离线节点影响\n     - **本地超时机制**: 每个验证者独立计时，无需依赖全局时钟 (替代原 POH)，提高抗干扰能力\n     \n      2. 离线处理机制\n     \n     - **SkipVote 机制**: 当 leader 未能及时生成区块或分片超时，验证者可发送 SkipVote，若 **≥60% 权益 ** 投 SkipVote，该 slot 将被正式跳过\n     - **窗口管理**: leader 负责 4 个连续 slot 窗口，若第一个 slot 失败，整个窗口将被标记为无效，避免长时间等待\n     - **投票激励**: SkipVote 与正常投票获得相同奖励权重，鼓励验证者在异常情况下仍积极参与\n     \n      四、20+20 模型工作流程详解\n     \n     **场景 1: 网络正常 (恶意 \u003c 20%，离线 \u003c 20%)**\n     \n     1. Leader 生成新区块并广播\n     2. 验证者通过 Rotor 快速接收 (≤150ms)\n     3. 首轮投票: **≥80% 权益**批准→**快速确认**(100ms)\n     4. 区块成为 \"root\"(根区块)，链继续扩展\n     \n     **场景 2: 部分节点离线 (离线≈20%)**\n     \n     1. 首轮投票：获**65% 权益**批准 (未达 80% 但≥60%)\n     2. 系统立即启动第二轮投票\n     3. 第二轮：再次获 **≥60% 权益 ** 批准→**最终确认**(150ms)\n     4. 即使部分节点离线，共识仍能达成\n     \n     **场景 3: 存在恶意节点 (恶意≈20%)**\n     \n     1. 恶意节点试图对冲突区块双重投票\n     2. 诚实节点检测到冲突签名，拒绝确认恶意区块\n     3. 恶意行为被记录，可能触发惩罚机制\n     4. 网络继续在诚实链上达成共识\n     \n      五、为什么选择 \"20+20\" 这个数字？\n     \n     - **安全性权衡**: 20% 是在安全性与性能间取得的平衡，比传统 BFT 的 33% 更严格，大幅提升攻击难度\n     - **数学证明**: 基于 Martin 和 Alvisi 的 \"5f+1\" 理论，在 f=20% 时，系统仍能保证:\n       - 安全性：恶意节点无法使诚实节点接受错误区块\n       - 活跃性：诚实节点最终能就某区块达成一致\n     - **性能考量**: 两个 20% 的设计使 Votor 能在**100-150ms**内完成确认 (相比 Tower BFT 的 12.8 秒)，同时保持高容错\n     \n      六、与 Tower BFT 容错模型对比\n     \n     | 特性             | Tower BFT   | Votor 20+20 模型          |\n     | ---------------- | ----------- | ------------------------- |\n     | **恶意节点容忍** | 33%         | **20%**(更严格)           |\n     | **离线节点容忍** | 无专门保障  | **20%**(独立保障)         |\n     | **确认时间**     | 约 12.8 秒  | **100-150ms**(提升 80 倍) |\n     | **投票轮数**     | 多轮        | 最多**两轮**(通常一轮)    |\n     | **通信模型**     | gossip 广播 | 直接点对点 + 单跳传播     |\n     \n      七、总结\n     \n     **Votor 的 20+20 容错模型是 Alpenglow 共识的核心创新，它通过精确区分并独立处理两类网络故障，在保持高安全性的同时实现了前所未有的性能提升:**\n     \n     - **安全性**: 最多容忍 20% 恶意验证者，确保区块链不产生错误状态\n     - **活跃性**: 最多容忍 20% 离线验证者，确保网络持续运行\n     - **性能**: 将确认时间从 12.8 秒**缩短至 100-150ms**，支持 Solana 处理更高吞吐量\n     \n     **核心优势**: 即使在 40% 验证者异常的极端情况下 (20% 恶意 + 20% 离线)，Solana 网络仍能保持安全、稳定运行，为大规模去中心化应用提供了坚实基础。\n\n5. 涡轮协议---Turbine\n   - 核心定位：区块传播优化协议，降低带宽消耗、加速数据同步。\n   - 地层逻辑：将区块数据分割为小块并行传输，验证节点按需接收并转发，大幅缩短区块在全网的传播时间，提升交易确认速度。\n\n6. 湾流协议---Gulf Stream\n   - 核心定位： 无内存池交易转发机制，减少交易处理延迟。\n   - 地层逻辑： 验证着提前预判并预处理待确认交易，交易提交后无需等待内存池排队，直接进入处理流程，缩短从提交到执行的耗时。\n\n7. 海平面引擎---Sealevel\n   - 核心定位： 并行智能合约执行引擎，突破串行执行的性能瓶颈。\n   - 地层逻辑：支持同一区块内数千个智能合约并行运行，充分利用多核硬件算力，同时适配GPU、SSD资源高效利用，直接提升网络交易吞吐量。\n\n8. 流水线技术---Pipelining\n   - 核心定位：硬件级交易验证优化，实现交易连续处理。\n   - 地层逻辑：将交易验证拆解为“接收-验证-执行-记账”多个阶段，不同硬件单元并行处理不同阶段任务，避免单阶段拥堵，提升整体处理效率。\n\n9. 云裂架构---Cloudbreak\n   - 核心定位：水平扩展账户数据库，值乘大规模并发读写。\n   - 地层逻辑：采用多线程并行读写设计(支持32线程)，将账户数据分布式存储于多个节点，实现性能随节点数量线型扩张，应对海量账户操作请求。\n\n10. 存档器---Archivers\n   - 核心定位：去中心化历史数据存储方案，降低主网性能损耗。\n   - 地层逻辑：独立节点集群存储区块链历史数据，主网节点无需承担全量存储压力，且普通笔记本即可作为存档节点，降低网络维护门槛，保障数据安全性与可追溯性。\n\n## Solana持久化\n\n### 全量数据持久化核心\n\nArchivers原生全量历史存储，分片+PoRep/PoSt证明\n\n### 外部协同扩容\n\nIPFS去中心话检索、Arweave永久冷数据存储，跨链验证\n\n1. IPFS 负责 “去中心化数据检索”，Solana 生态 dApp 将视频、前端代码等数据写入 IPFS，通过内容寻址（CID）快速定位数据，解决传统中心化存储的检索效率问题，常与 Filecoin 搭配使用。\n2. Arweae\n   - 搭建专属桥接协议**SOLARBridge**，Solana 验证节点完成交易验证后，可将数据同步至 Arweave 实现 “永久不可篡改存储”，提升历史数据安全性。\n   - 分工差异：Archivers 是 Solana 原生全量数据存储载体，Arweave 作为外部补充，侧重需长期留存的关键数据（如 NFT 元数据、链上合规记录），利用其 “一次付费永久存” 特性降低长期存储成本。\n\n### 存储效率优化\n\nReed-Solomon纠错码(分片冗余)、Cloudbreak(冷热分层)、Rent(无效数据清理)\n\n## Solana名词概念\n\n1. accounts\n\n   All data on the Solana blockchain is stored as an Account.The structure of the Solana blockchain resembles a key-value store, in which the key is the on-chain address and the value is an Account.\n\n   A record in the Solana ledger that either holds data or is an executable program.\n\n   Like an account at a traditional bank, a Solana account may hold funds called [lamports](https://solana.com/docs/references/terminology#lamport). Like a file in Linux, it is addressable by a key, often referred to as a [public key](https://solana.com/docs/references/terminology#public-key-pubkey) or pubkey.\n\n   The key may be one of:\n\n   - an ed25519 public key\n   - a program-derived account address (32byte value forced off the ed25519 curve)\n   - a hash of an ed25519 public key with a 32 character string\n\n2. smart contract、validator\n\n3. blockchain explorer\n\n4. address\n\n5. transfer\n\n6. dApp\n\n7. token\n\n   Tokens are digital assets that represent ownership over diverse categories of assets. Tokenization enables the digitalization of property rights—a fundamental component for managing fungible and non-fungible assets.\n\n   代币（Tokens）是代表各类资产所有权的数字资产。资产代币化（Tokenization）实现了产权的数字化，这是管理可替代资产（fungible assets）和非同质化资产（non-fungible assets）的核心组成部分。\n\n   - **Fungible Tokens**: Interchangeable and divisible assets of the same type and value (ex. USDC).\n   - **Non-fungible Tokens (NFT):** Ownership of indivisible assets (e.g. artwork).\n\n8. fee\n\n   There are three different types of fees that can be incurred when using the Solana blockchain:\n\n   - **Transaction Fees**: A fee to have validators process transactions \u0026 instructions\n   - **Prioritization Fees**: An optional fee to boost a transaction's processing order\n   - **Rent**: A withheld balance to keep data stored on-chain\n\n9. block\n\n   A contiguous set of [entries](https://solana.com/docs/references/terminology#entry) on the ledger covered by a [vote](https://solana.com/docs/references/terminology#ledger-vote). A [leader](https://solana.com/docs/references/terminology#leader) produces at most one block per [slot](https://solana.com/docs/references/terminology#slot).\n\n10. lease\n\n11. signature\n\n    A 64-byte ed25519 signature of R (32-bytes) and S (32-bytes). With the requirement that R is a packed Edwards point not of small order and S is a scalar in the range of `0 \u003c= S \u003c L`. This requirement ensures no signature malleability. Each transaction must have at least one signature for [fee account](https://solana.com/docs/references/terminology#fee-account). Thus, the first signature in transaction can be treated as [transaction id](https://solana.com/docs/references/terminology#transaction-id)\n\n12. wallet\n\n    A collection of [keypairs](https://solana.com/docs/references/terminology#keypair) that allows users to manage their funds.\n\n## votor多轮投票详解\n\nVotor的多轮投票机制详解\n\n1. 第一轮投票的核心功能\n\n第一轮投票是Votor共识的\"快速通道\"，主要功能包括：\n\n- 区块验证：验证者检查区块有效性（交易合法性、签名等）\n\n- 快速确认路径：如果第一轮投票获得≥80%的权益支持，区块立即获得\"Fast-Finalization Certificate\"并最终确认，无需第二轮\n\n- 双轨启动：即使未达到80%，只要获得≥60%支持，Votor会立即启动第二轮投票，形成\"双轨并行\"的高效决策机制\n\n2. 投票轮数控制：固定还是动态？\n\nVotor采用动态轮数控制，而非固定轮数，这是其高效性的关键：\n\n- 单轮快速路径（理想情况）：\n\n- 条件：第一轮投票达到≥80%权益支持\n\n- 结果：区块在100-150ms内完成最终确认，生成Fast-Finalization证书\n\n- 双轮安全路径（一般情况）：\n\n- 条件：第一轮60%-80%支持，未达快速确认门槛\n\n- 过程：立即启动第二轮投票，两轮投票共享相同的初始投票数据\n\n- 结果：第二轮达到≥60%支持即最终确认，总耗时仍控制在150-200ms内\n\n- 关键优化：两轮投票并行执行，而非顺序执行，哪个先达到阈值就采用哪个结果，确保在400ms时隙内完成决策\n\n3. 400ms时隙与投票的关系\n\n400ms是一个\"安全时间窗口\"，确保：\n\n- 领导者有足够时间生成区块并全网传播\n\n- 验证者有足够时间完成区块验证和两轮投票\n\n- 即使在网络延迟较高的情况下，共识流程仍能在一个时隙内完成\n\n## Solana区块大小\n\n一、核心概念：区块容量与计算单元(CU)\n\nSolana的区块\"大小\"主要以计算单元(Compute Units, CU)衡量，而非传统区块链的字节大小：\n\n当前主网限制：6000万CU/区块（2025年7月通过SIMD-0256提案从5000万CU提升） \n\n计算单元(CU)是什么？\n\n- 衡量区块内可执行计算工作量的单位\n- 代表\"一个区块最多能做多少事\"，而非数据存储量\n- 限制领导者能打包进区块的工作量，确保大多数验证者能跟上网络 \n\n实际应用：\n\n- 每个交易默认消耗约20万CU，复杂交易可达140万CU \n- 每个区块平均包含600-1400笔交易，取决于交易复杂度\n\n二、区块的实际字节大小\n\n虽然CU是主要限制，但Solana区块也有最大字节容量：\n\n- 理论最大：128MB（通过Turbine协议分片技术实现）\n- 实现方式：将区块分解为1280字节的数据包（称为\"分片shreds\"），由不同验证器并行验证\n\n区块结构：\n\n- 包含区块头（元数据、哈希值等）\n- 包含交易列表（每个交易最大1232字节） \n- 包含PoH哈希链（Alpenglow前）或逻辑时间戳（Alpenglow后）\n\n三、为什么不用传统字节大小限制？\n\nSolana的创新在于以计算工作量而非数据量定义区块\"大小\"：\n\n1. 计算密集型限制：更精准控制区块处理负载，防止资源耗尽攻击\n2. 动态资源分配：同样字节的交易，复杂计算消耗更多CU，简单交易消耗更少\n3. 水平扩展：验证者硬件性能提升时，可通过协议升级增加CU上限（如从5000万→6000万→计划1亿CU）\n\n四、最新发展：区块容量升级提案\n\n目前有两个重要提案正在讨论：\n\n1. SIMD-0286：将CU上限从6000万提升至1亿（增加66%），已提出但未实施\n2. SIMD-0370：更激进的方案，取消固定CU限制，改为基于验证器硬件性能的动态区块大小，小验证器可跳过超出其容量的区块验证\n\n总结\n\nSolana区块大小通过双重机制控制：\n\n- 计算单元(CU)限制（当前6000万）：控制区块内计算工作量\n- 字节大小限制（理论最大128MB）：通过分片技术支持大规模数据处理\n\n核心区别：与比特币（约1MB）、以太坊（约30MB）等传统区块链不同，Solana更关注计算资源消耗而非单纯的数据存储量，这是其实现高吞吐量（2000-3000TPS）的关键设计。\n\n注：数据截至2025年11月，实际值可能随协议升级变化。\n\n### 计算单元(CU)\n\n一、CU的本质：区块链的\"计算卡路里\"\n\n计算单元(Compute Units, CU)是Solana衡量交易执行所需计算资源的基本单位，类似于：\n\n- 汽车的\"油耗\"(每公里消耗多少升汽油)\n- 手机的\"电量\"(完成任务消耗多少毫安时)\n- 工厂的\"工时\"(完成订单需要多少人工小时)\n\n核心定义：1个CU ≈ 33纳秒(0.000000033秒)的计算时间。最小的区块链操作(如简单的算术运算)消耗1个CU，复杂操作消耗更多。\n\n二、为什么需要CU？三大关键作用\n\n1️⃣ 防止\"无限循环攻击\"\n\n- 每个交易默认限制20万CU，最多可请求140万CU \n- 当交易执行消耗的CU超过限制时，程序会立即终止并回滚所有状态变更\n- 这保护网络免受恶意合约通过无限循环耗尽所有节点计算资源的攻击\n\n2️⃣ 公平分配区块处理能力\n\n- 每个区块固定限制6000万CU(2025年7月从5000万CU提升) \n- 就像餐厅一次只能接待一定数量的顾客，CU限制确保：\n- 简单交易(约1000-2000 CU/笔)：一个区块可处理约6万笔\n- 复杂DeFi交易(约10万CU/笔)：一个区块仅能处理约600笔\n- 防止单个复杂交易独占整个区块资源，保证网络公平性\n\n3️⃣ 精确计量与定价\n\n- 交易费用 = CU价格 × 消耗的CU数量\n- 用户可通过设置更高的CU价格获得优先处理权，类似\"加急费\" \n- 验证者获得100%的优先费用，作为处理交易的\"算力报酬\" \n\n三、CU如何工作？一个直观比喻\n\n想象你在一个烹饪比赛中：\n\n- 厨房 = Solana区块链网络\n- 厨师 = 验证节点(负责处理交易)\n- 烹饪时间 = 计算资源(CU)\n- 菜谱 = 智能合约程序\n- 食材 = 交易数据\n\n规则：\n\n- 每位厨师一次只能烹饪一道菜(处理一个交易)\n- 比赛总时长固定为6000万秒(相当于区块CU上限)\n- 每道菜必须在20万秒内完成(交易CU上限)，复杂菜最多可申请140万秒\n- 超时的菜会被直接丢弃，食材退回但不退还比赛费用\n\n四、CU的具体数值：交易消耗实例\n\n交易类型 大致CU消耗 相当于 \n简单转账 1,000-2,000 CU 33-66微秒 \n智能合约调用(基础) 5,000-20,000 CU 0.16-0.66毫秒 \n复杂DeFi操作 50,000-140,000 CU 1.6-4.6毫秒 \n一次区块全部容量 6000万CU 约2秒(理论最大值) \n\n实际应用：Solana主网每个区块平均包含600-1400笔交易，平均CU利用率约85%，表明网络处于高效但不过载的状态。\n\n五、CU vs 传统区块链的\"字节大小\"\n\n特性 Solana (CU限制) 比特币/以太坊 (字节限制) \n衡量对象 计算工作量(执行时间) 数据存储量(字节数) \n控制目标 防止计算资源耗尽 防止存储爆炸 \n资源类型 CPU计算时间 磁盘空间 \n灵活性 高(复杂交易消耗更多CU) 低(同等字节消耗相同资源) \n扩容方式 调整CU上限(如6000万→1亿) 增加区块大小(如1MB→30MB) \n\n关键区别：CU不是限制区块能存储多少数据，而是限制区块能做多少计算。这使Solana能更精准地防止资源滥用，同时允许处理更大的数据集(通过分片技术支持最大128MB区块)。\n\n六、CU的未来：从固定限制到动态调整\n\n目前Solana社区正讨论两项重大变革：\n\n1. SIMD-0286：将CU上限从6000万提升至1亿(增加66%)，以应对日益增长的DeFi和NFT应用需求\n2. SIMD-0370：更激进的方案，取消固定CU限制，改为基于验证器硬件性能的动态分配，使网络处理能力随硬件进步自然扩展\n\n总结：CU的\"三个一\"记忆法\n\n一个核心公式：1 CU = 33纳秒计算时间\n\n一个形象比喻：CU是区块链世界的\"时间货币\"，你需要\"支付\"一定数量的CU来\"购买\"区块链为你执行计算的时间\n\n一个关键作用：CU是Solana实现高性能(2000-3000TPS)与安全性平衡的核心机制，确保网络既能快速处理大量交易，又不会被恶意代码攻击瘫痪\n\n一句话理解：CU就是告诉区块链\"这个交易我愿意花多少计算时间来处理\"，网络根据这个\"时间预算\"决定是否接受并优先处理你的交易。\n\n注：CU是Solana特有的概念，与其他区块链的Gas(以太坊)或VBC(波场)等资源计量机制有相似之处，但实现原理完全不同。\n\n### CU消耗\n\nhttps://solana.com/developers/guides/advanced/how-to-optimize-compute\n\n在 Solana 上开发时，务必关注程序的计算资源使用量。程序的计算资源消耗不仅会影响用户能获得的最大性能，还会增加包含优先费用（priority fees）的交易执行成本。\n\n优化计算单元（CU）使用量可带来以下好处：\n\n- 消耗 CU 更少的交易，被打包进区块的概率更高；\n- 低 CU 消耗的指令让你的程序更具可组合性（composable）；\n- 降低区块的整体 CU 占用率，使单个区块能容纳更多交易。\n\n本指南将介绍如何优化程序的计算资源使用，确保其达到最高运行效率。\n\n#### 当前的计算资源限制是什么？\n\nSolana 程序有以下几项需要注意的计算资源限制：\n\n- 每区块最大 CU：6000 万 CU；\n- 每区块内单个账户最大 CU：1200 万 CU；\n- 单交易最大 CU：140 万 CU。\n\n将程序的 CU 消耗控制在这些限制内，对于确保程序及时执行且成本合理至关重要。尤其当你的程序开始被大量用户使用时，必须尽可能高效地管理 CU 消耗，避免触及 “单账户每区块最大 CU” 上限。\n\n#### 如何测量 CU 消耗？\n\n在开发 Solana 程序时，你需要检查程序不同部分的 CU 消耗情况。可以使用`compute_fn`宏来测量不同代码片段的 CU 使用量。\n\n通过以下代码测量 CU 消耗：\n\n```rust\ncompute_fn!(\"自定义提示信息\" =\u003e {\n    // 待测量的代码\n});\n```\n\n该宏的输出会显示代码执行前后的 CU 消耗差值，帮助你定位程序中最耗 CU 的部分。你可以在`cu_optimizations`仓库中找到该宏的使用示例。\n\n#### 程序优化技巧\n\n##### 日志输出（Logging）\n\n虽然日志是理解程序内部运行状态的有效方式，但日志输出的 CU 消耗极高。应避免在程序中打印非必要信息，以降低 CU 占用。\n\n例如，base58 编码和字符串拼接都是高耗 CU 操作：\n\n```rust\n// 消耗11962 CU！！\n// base58编码和字符串拼接均为高耗CU操作\ncompute_fn! { \"打印账户公钥（低效方式）\" =\u003e\n    msg!(\"A string {0}\", ctx.accounts.counter.to_account_info().key());\n}\n\n// 消耗357 CU——仅字符串拼接就很耗CU\ncompute_fn! { \"简单拼接打印公钥\" =\u003e\n    msg!(\"A string {0}\", \"5w6z5PWvtkCd4PaAV7avxE6Fy5brhZsFdbRLMt8UefRQ\");\n}\n```\n\n如果确实需要打印公钥，可使用`.key()` + `.log()`方法高效打印，降低 CU 消耗：\n\n```rust\n// 仅消耗262 CU\ncompute_fn! { \"高效打印公钥\" =\u003e\n    ctx.accounts.counter.to_account_info().key().log();\n}\n```\n\n##### 数据类型（Data Types）\n\n更大的数据类型整体会消耗更多 CU。使用`u64`等大尺寸数据类型前，务必确认是否真的需要 —— 相比`u8`等小数据类型，大尺寸类型的 CU 消耗会显著更高。\n\n```rust\n// 消耗357 CU\ncompute_fn! { \"向量中存储u64类型\" =\u003e\n    let mut a: Vec\u003cu64\u003e = Vec::new();\n    a.push(1);\n    a.push(1);\n    a.push(1);\n    a.push(1);\n    a.push(1);\n    a.push(1);\n}\n\n// 仅消耗211 CU\ncompute_fn! { \"向量中存储u8类型\" =\u003e\n    let mut a: Vec\u003cu8\u003e = Vec::new();\n    a.push(1);\n    a.push(1);\n    a.push(1);\n    a.push(1);\n    a.push(1);\n    a.push(1);\n}\n```\n\n整体来看，数据类型的差异会在整个程序中累积，导致 CU 消耗大幅增加。\n\n##### 序列化（Serialization）\n\n根据账户结构体的复杂度，序列化和反序列化操作的 CU 消耗会很高。如果可能，应使用 “零拷贝（zero copy）” 技术，直接操作账户数据，避免这些高耗 CU 操作。\n\n```rust\n// 消耗6302 CU（含序列化开销）\npub fn initialize(_ctx: Context\u003cInitializeCounter\u003e) -\u003e Result\u003c()\u003e {\n    Ok(())\n}\n\n// 消耗5020 CU（零拷贝，无序列化开销）\npub fn initialize_zero_copy(_ctx: Context\u003cInitializeCounterZeroCopy\u003e) -\u003e Result\u003c()\u003e {\n    Ok(())\n}\n\n// 消耗108 CU——含序列化总CU为2600\nlet counter = \u0026mut ctx.accounts.counter;\ncompute_fn! { \"Borsh序列化\" =\u003e\n    counter.count = counter.count.checked_add(1).unwrap();\n}\n\n// 消耗151 CU——含序列化总CU为1254（节省约50%）\nlet counter = \u0026mut ctx.accounts.counter_zero_copy.load_mut()?;\ncompute_fn! { \"零拷贝序列化\" =\u003e\n    counter.count = counter.count.checked_add(1).unwrap();\n}\n```\n\n通过上述示例可见，在程序中使用零拷贝技术，有望节省高达 50% 以上的总 CU 消耗。\n\n##### 程序派生地址（Program Derived Addresses, PDAs）\n\n使用程序派生地址（PDAs）是 Solana 程序中的常见做法，但需注意`find_program_address`的 CU 消耗，并掌握优化方法。\n\n如果`find_program_address`需要多次尝试才能找到有效地址（即 bump 值较小），整体 CU 消耗会很高。优化方案：初始化后将 bump 值存储到账户中，后续直接复用该 bump 值。\n\n```rust\npub fn pdas(ctx: Context\u003cPdaAccounts\u003e) -\u003e Result\u003c()\u003e {\n    let program_id = Pubkey::from_str(\"5w6z5PWvtkCd4PaAV7avxE6Fy5brhZsFdbRLMt8UefRQ\").unwrap();\n\n    // 消耗12,136 CU（未复用bump，需多次尝试）\n    compute_fn! { \"查找PDA（低效）\" =\u003e\n        Pubkey::find_program_address(\u0026[b\"counter\"], ctx.program_id);\n    }\n\n    // 仅消耗1,651 CU（直接使用已知bump，无需尝试）\n    compute_fn! { \"查找PDA（高效）\" =\u003e\n        Pubkey::create_program_address(\u0026[b\"counter\", \u0026[248_u8]], \u0026program_id).unwrap();\n    }\n\n    Ok(())\n}\n\n#[derive(Accounts)]\npub struct PdaAccounts\u003c'info\u003e {\n    #[account(mut)]\n    pub counter: Account\u003c'info, CounterData\u003e,\n    // 未指定bump：消耗12,136 CU\n    #[account(\n        seeds = [b\"counter\"],\n        bump\n    )]\n    pub counter_checked: Account\u003c'info, CounterData\u003e,\n}\n\n#[derive(Accounts)]\npub struct PdaAccounts\u003c'info\u003e {\n    #[account(mut)]\n    pub counter: Account\u003c'info, CounterData\u003e,\n    // 复用账户中存储的bump：仅消耗1600 CU\n    #[account(\n        seeds = [b\"counter\"],\n        bump = counter_checked.bump\n    )]\n    pub counter_checked: Account\u003c'info, CounterData\u003e,\n}\n```\n\n#### 更多 CU 优化方向\n\n还有许多其他优化程序 CU 消耗的方法，例如使用原生代码（native）而非 Anchor 框架开发 —— 但这些方法都需要权衡开发效率。如果追求程序极致的 CU 性能，建议评估并测试不同方案，找到最适合自身业务场景的优化方式。\n\n#### 文档核心内容详细讲解（技术原理 + 实操价值）\n\n结合你之前关注的 “CU 本质（SVM 字节码计量）”，本次文档的核心是 “如何通过代码优化减少 SVM 指令执行次数，从而降低 CU 消耗”，以下分模块拆解：\n\n##### 1. 先明确 3 个关键前提（文档核心限制）\n\n- **每区块 6000 万 CU**：是当前 Agave 版本的硬限制（比旧版提升 20%），意味着单个区块内所有交易的 CU 总和不能超 6000 万 —— 你的程序 CU 消耗越低，越容易在网络拥堵时被打包；\n- **单账户每区块 1200 万 CU**：是 “账户级限流”，避免热门账户（如热门 NFT 合约）占用过多区块资源，导致其他用户交易失败；\n- **单交易 140 万 CU**：是 “交易级上限”，默认 20 万 CU，可通过`ComputeBudgetInstruction::set_compute_unit_limit`手动提升到 140 万，但越高的 CU 意味着越高的交易费。\n\n##### 2. 五大优化技巧：原理 + 实操（结合 SVM 指令逻辑）\n\n##### （1）日志输出优化：最容易踩的 “CU 陷阱”\n\n- **原理**：`msg!`宏的 CU 消耗高，核心是两个 SVM 指令开销：\n  1. 字符串拼接 / 格式化：需要执行`CONCAT`（拼接）、`FORMAT`（格式化）等指令，每个指令消耗 10-100 CU；\n  2. base58 编码：打印公钥时，默认会将`Pubkey`类型转成 base58 字符串，需执行`BASE58_ENCODE`指令（消耗 1000+ CU）。\n- **实操建议**：\n  - 非调试场景禁用所有冗余日志；\n  - 必须打印公钥时，用`.key().log()`替代`msg!`—— 直接调用 SVM 的`LOG_PUBKEY`指令（仅 262 CU），跳过编码和拼接步骤。\n\n##### （2）数据类型优化：小类型 = 少指令 = 低 CU\n\n- **原理**：SVM 处理大尺寸数据类型时，需要更多指令：\n  - `u8`（1 字节）：读取 / 写入仅需 1 条`LOAD`/`STORE`指令（10/100 CU）；\n  - `u64`（8 字节）：读取 / 写入需要分多次指令（或更复杂的内存操作），CU 消耗几乎是`u8`的 2 倍。\n- **实操建议**：\n  - 能用`u8`绝不选`u64`（比如计数器、状态标记等）；\n  - 复杂结构体中，将小字段聚合存储，减少内存访问次数。\n\n##### （3）序列化优化：零拷贝 = 跳过 “编码 / 解码” 指令\n\n- **原理**：\n  - 普通序列化（如 Borsh）：需要执行`SERIALIZE`/`DESERIALIZE`指令，将 Rust 结构体转成字节流（消耗 1000+ CU）；\n  - 零拷贝（zero copy）：直接映射账户内存到程序地址空间，无需编码 / 解码，仅需`LOAD`/`STORE`指令（10-100 CU）。\n- **实操建议**：\n  - 使用 Anchor 的`#[account(zero_copy)]`宏标记账户结构体；\n  - 注意：零拷贝要求账户数据对齐（如`#[repr(C)]`），且不能直接使用复杂嵌套类型（如`Vec`），需手动管理内存。\n\n##### （4）PDAs 优化：复用 bump = 减少 “尝试性指令”\n\n- **原理**：\n  - `find_program_address`：为了找到有效 PDA，会从 bump=255 开始反向尝试，直到找到不落在 Ed25519 曲线上的地址 —— 每次尝试都要执行`ECP_SECP256K1_VERIFY`（椭圆曲线验证）指令（1000+ CU / 次），bump 越小，尝试次数越多，CU 消耗越高；\n  - `create_program_address`：直接使用已知的 bump 值，仅需 1 次验证指令（1651 CU），无需反复尝试。\n- **实操建议**：\n  - 初始化 PDA 时，将找到的 bump 值存储到账户中（如`counter_checked.bump`）；\n  - 后续使用 PDA 时，直接从账户中读取 bump，调用`create_program_address`。\n\n##### （5）进阶优化：原生开发 vs Anchor\n\n- **原理**：Anchor 框架为了简化开发，封装了很多通用逻辑（如序列化、账户验证），但这些封装会引入额外的 SVM 指令（CU 消耗）；\n- **实操建议**：\n  - 高频调用的核心程序（如 DEX 核心合约）：用原生 Rust 开发，手动控制每一条 SVM 指令，极致优化 CU；\n  - 普通应用程序：优先用 Anchor（开发效率高），仅对核心路径（如交易执行、状态更新）做零拷贝、日志优化等关键优化。\n\n##### 3. 测量 CU 消耗的核心工具：`compute_fn`宏\n\n- **原理**：该宏会在代码执行前后，调用 SVM 的`GET_COMPUTE_UNIT_CONSUMED`指令，获取当前 CU 消耗值，两者差值就是目标代码的 CU 消耗；\n- **实操步骤**：\n  1. 安装依赖：`cargo add solana-compute-meter`；\n  2. 在代码中插入`compute_fn!`宏，包裹待测量的代码片段；\n  3. 运行测试：`cargo test-sbf`，查看输出中的 CU 消耗数值；\n  4. 定位高耗 CU 代码，针对性优化。\n\n##### 4. 优化效果量化（文档示例对比）\n\n| 优化场景                    | 优化前 CU 消耗 | 优化后 CU 消耗 | 节省比例 |\n| --------------------------- | -------------- | -------------- | -------- |\n| 打印公钥（`msg!`→`.log()`） | 11962 CU       | 262 CU         | 97.8%    |\n| 向量存储（`u64`→`u8`）      | 357 CU         | 211 CU         | 41%      |\n| 账户初始化（普通→零拷贝）   | 6302 CU        | 5020 CU        | 20.3%    |\n| PDA 查找（`find`→`create`） | 12136 CU       | 1651 CU        | 86.4%    |\n\n#### 总结：CU 优化的核心逻辑\n\n所有优化技巧的本质都是 “**减少 SVM 指令执行次数**”—— 因为 CU 是按 SVM 字节码指令计量的，每少执行一条高耗 CU 指令，总消耗就会降低。\n\n核心优化思路：\n\n1. 避免冗余操作（如冗余日志、重复序列化）；\n2. 用高效指令替代低效指令（如`LOG_PUBKEY`替代`BASE58_ENCODE + CONCAT`）；\n3. 复用计算结果（如存储 PDA 的 bump 值，避免重复尝试）；\n4. 小数据类型 + 零拷贝，减少内存操作指令。\n\n这些优化不仅能降低交易费，还能让你的程序在 Solana 高吞吐量网络中更稳定（避免因 CU 超限被拒绝打包），尤其适合面向北美远程工作场景中的高并发应用开发需求。\n\n## SPL\n\nSPL 是 Solana 区块链的代币标准，你可以把它理解为一套官方制定的“代币游戏规则”。它规定了代币如何创建、转账和管理，确保了所有基于 Solana 的代币都能被钱包、交易所和各种应用（DApp）无缝识别和处理-2。\n\n下面这个表格能帮你快速抓住 SPL 代币的几个核心概念：\n\n| 核心概念                     | 简单来说                 | 关键信息                                                     |\n| ---------------------------- | ------------------------ | ------------------------------------------------------------ |\n| **代币程序 (Token Program)** | 代币的“总管家”或“规则书” | 一个所有 SPL 代币都共享的、官方的链上程序[-9](https://learnblockchain.cn/index.php/article/21361)，地址是 `TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA` |\n| **铸币账户 (Mint Account)**  | 代币的“身份证”和“信息卡” | 存储代币的**全局信息**，如总供应量、小数位数。**它的地址就是代币的地址** |\n| **代币账户 (Token Account)** | 你的“个人代币钱包”       | 存储某个**用户**持有的特定代币的**数量**[-6](https://learnblockchain.cn/index.php/article/13056)。一个用户可以拥有多个同种代币的账户。 |\n| **关联代币账户 (ATA)**       | 你的“专属个人钱包”       | 一个通过用户地址和代币 Mint 地址**确定性推导出的代币账户**[-9](https://learnblockchain.cn/index.php/article/21361)，**每个用户对每种代币只有一个 ATA**，是接收代币最常用的地址[-9](https://learnblockchain.cn/index.php/article/21361)。 |\n\n### Solana Token standard\n\n| 标准名称 (SPL)              | 等效以太坊标准     | 核心用途                                                     | 备注                                                         |\n| :-------------------------- | :----------------- | :----------------------------------------------------------- | :----------------------------------------------------------- |\n| **SPL Token**               | ERC-20             | **同质化代币**。如：USDC, USDT, SOL 的 Wrapped 版本。        | 最基础、最核心的代币标准。您提到的 **ATA** 就是基于此标准的一个**账户生成规范**，用于为每个用户安全地生成一个唯一的接收地址。 |\n| **SPL Token-2022**          | ERC-20 升级版      | **功能增强的同质化代币**。在 SPL Token 基础上增加了原生功能，如：转账手续费、保密转账、不可转让代币等。 | 是 SPL Token 的升级版，旨在不破坏兼容性的情况下引入新功能。  |\n| **Metaplex NFT**            | ERC-721 / ERC-1155 | **非同质化代币 (NFT)** 和 **半同质化代币 (SFT)**。           | 虽然技术上基于 SPL Token，但 **Metaplex** 协议为 NFT 定义了**元数据（如图片、属性）、创建、销售等一整套规则**，是 Solana 上事实上的 NFT 标准。 |\n| **Programmable NFT (pNFT)** | 无直接等效         | **可编程 NFT**。为 NFT 添加了复杂的规则，如：强制执行版税、限制转移等。 | 在 Metaplex NFT 基础上的重大升级，解决了版税难执行等问题。   |\n\n1.  **SPL Token 是基石**：所有代币，无论是同质化的 USDC 还是非同质化的 NFT，其底层账户模型都遵循 `spl-token` 程序规则。这确保了钱包和浏览器能统一识别。\n\n2.  **ATA 是什么？**：它**不是一个独立的代币标准**，而是 SPL Token 标准下的一个**最佳实践**。它的全称是“关联代币账户”，其核心价值是：\n    *   **确定性**：通过你的钱包地址和代币地址，就能算出一个唯一的接收地址。\n    *   **防丢失**：避免了用户为同一种代币创建多个账户，导致不知道哪个里有币。\n    *   **方便**：成为 DApp 和钱包默认的找零和接收地址。\n\n    | 特性         | 关联代币账户 (ATA)                                     | 非关联代币账户                                               |\n    | :----------- | :----------------------------------------------------- | :----------------------------------------------------------- |\n    | **地址生成** | **确定性 PDA**，由 `(owner, token_program, mint)` 推导 | **随机密钥对**，公钥作为地址                                 |\n    | **私钥**     | 无（是PDA，由程序控制）                                | 有（是密钥对，需要安全存储）                                 |\n    | **创建方式** | 通过**关联代币程序** `create_associated_token_account` | 通过**系统程序** `create_account` + **代币程序** `initialize_account` |\n    | **查找**     | 知道 `owner` 和 `mint` 即可算出                        | 需要记录或扫描链上数据                                       |\n    | **使用场景** | **标准做法**，用于接收代币、空投                       | **特殊场景**，如需要为同一个代币创建多个账户（做税务隔离）、或某些需要自定义所有权的复杂程序逻辑 |\n    \n3.  **为什么是 Metaplex？**： Solana 基金会定义了基础的 SPL Token 标准（相当于规定了“纸”怎么做），而 **Metaplex** 这个社区项目定义了 NFT 的具体格式（相当于规定了“钞票”的图案、防伪等）。所以，在 Solana 上聊 NFT，几乎就等于在聊 Metaplex 标准。\n\n4.  **Token-2022 是未来**：它就像一个有各种插座的升级电源，想要加什么功能（如转账扣费）就直接插上，而无需再单独造一个新的电源。这是 Solana 代币为了适应更复杂金融场景的进化。\n\n如果有人问“Solana 的 SPL 代币标准有哪些”，最直接的回答是：\n\n*   **FT**：看 **SPL Token** 和它的升级版 **SPL Token-2022**。\n*   **NFT**：看 **Metaplex NFT** 和 **Programmable NFT (pNFT)**。\n*   **ATA**：是上述所有标准在**使用过程中**，为了管理代币账户而衍生出的一个**关键地址生成方案**。\n\n## 命令行获取SPL代币账户地址\n\n#### 1. 获取关联代币账户（ATA）地址\n\n```bash\n# 计算特定用户对特定代币的ATA地址\nspl-token address --owner \u003c用户钱包地址\u003e --token \u003c代币Mint地址\u003e\n\n# 示例\nspl-token address --owner 7x1K... --token EPjFW...USDC\n# 输出: 6X4F... (用户的USDC ATA地址)\n```\n\n#### 2. 列出用户的所有代币账户\n\n```bash\n# 列出用户持有的所有代币账户（包括ATA和非ATA）\nspl-token accounts --owner \u003c用户钱包地址\u003e\n\n# 输出示例：\n# Account                                      Token Mint                           Balance\n# 6X4F...                                      EPjFW...USDC                         100.00\n# 8Y2H...                                     Mango...MNGO                          50.00\n```\n\n#### 3. 查看特定代币账户详情\n\n```bash\n# 查看代币账户的详细信息\nspl-token account \u003c代币账户地址\u003e\n\n# 输出包含：\n# - Address: 账户地址\n# - Mint: 对应的代币Mint\n# - Owner: 账户所有者\n# - Amount: 余额\n# - Delegation: 委托信息\n```\n\n#### 4. 查找代币的所有持有者\n\n```bash\n# 查找特定代币的所有持有者账户\nspl-token accounts --token \u003c代币Mint地址\u003e --output json\n\n# 这会列出所有持有该代币的账户地址和余额\n```\n\n\n\n### 基础空间计算\n\n| 标准/协议                             | 核心账户   | 基础空间 (字节)          | 关键组成与说明                                               |\n| :------------------------------------ | :--------- | :----------------------- | :----------------------------------------------------------- |\n| **SPL Token** (原始标准)              | Mint 账户  | **82**                   | 包含铸币权限、供应量、小数位数等核心数据。                   |\n|                                       | Token 账户 | **165**                  | 包含代币余额、所有者、委托信息等。                           |\n| **Token-2022** (扩展标准)             | Mint 账户  | **82 + (TLV 扩展空间)**  | **基础部分** (82字节) 与 SPL Token 完全相同。**扩展部分** 取决于启用的具体功能，需要额外计算。 |\n|                                       | Token 账户 | **165 + (TLV 扩展空间)** | **基础部分** (165字节) 与 SPL Token 完全相同。**扩展部分** 同样取决于启用的功能。 |\n| **Metaplex NFT** (基于原始 SPL Token) | Mint 账户  | **82**                   | 技术上基于原始的SPL Token程序，因此其Mint账户空间与SPL Token一致。 |\n|                                       | Token 账户 | **165**                  | 同样基于原始的SPL Token程序，其Token账户基础空间与SPL Token一致。 |\n\n### SPL各种代币的详细规则列表\n\n以下是四个核心标准及其最关键的技术规则，以表格形式呈现，满足你对精确规则的需求。\n\n| 标准                                       | 程序ID (Program ID)                                          | 核心账户数据结构                                             | 必须/关键指令 (Instruction)                                  | 权限模型 (Authority)                                         |\n| :----------------------------------------- | :----------------------------------------------------------- | :----------------------------------------------------------- | :----------------------------------------------------------- | :----------------------------------------------------------- |\n| **SPL Token** (同质化代币)                 | `TokenkegQfeZ...VQ5DA`                                       | **Mint**: 含 `supply`, `decimals`, `mint_authority`, `freeze_authority` \u003cbr /\u003e **Account**: 含 `mint`, `owner`, `amount`, `delegate` | `InitializeMint`, `InitializeAccount`, `MintTo`, `Transfer`, `Approve`, `Revoke` | **双权限模型**：\u003cbr /\u003e1. `mint_authority`: 可增发代币\u003cbr /\u003e2. `freeze_authority`: 可冻结账户 |\n| **Token-2022** (扩展代币)                  | `TokenzQd...y5TUQ`                                           | 基础部分同SPL Token，**额外扩展数据**通过TLV结构存储在账户末尾。 | 包含SPL Token所有指令，**新增**：`InitializeMint2`, `TransferCheckedEx`, `InitializeInterestBearingConfig` 等。 | **扩展权限**：在基础权限上，通过扩展支持如**永久委托者（Permanent Delegate）**，可无条件没收代币。 |\n| **Metaplex NFT** (基于SPL Token)           | **Metadata**: `metaqbxx...qW8ZPM` \u003cbr /\u003e **代币核心**仍使用上面SPL Token程序ID | **Metadata Account**: 含 `name`, `symbol`, `uri`, `seller_fee_basis_points` (版税), `creators` 等。 | `CreateMetadataAccounts`, `UpdateMetadataAccounts`, `SignMetadata` | **创作者/更新者权限**：\u003cbr /\u003e1. 一个 `update_authority` 可更新元数据。\u003cbr /\u003e2. 多个 `creators` 可分享版税。 |\n| **Programmable NFT (pNFT)** (基于Metaplex) | **授权规则**：`auth9Sig...j2RPC` \u003cbr /\u003e **核心**仍使用上面Metadata和Token程序ID | **TokenRecord Account** (新增): 含 `state` (Locked/Unlocked), `delegate`, `delegate_role` 等，存储资产状态。 | `Delegate`, `Lock`, `Unlock`, `Transfer`, `Burn` 等，所有操作需**经过授权规则检查**。 | **复杂角色权限**：\u003cbr /\u003e`metadata_delegate` 可细分为：\u003cbr /\u003e`LockedTransfer`, `Utility`, `Staking` 等角色，各司其职。 |\n\n**规则核心提炼：**\n1.  **SPL Token**：定义了代币的**原子操作**（创建、转账、授权）和**基础双权限**。\n2.  **Token-2022**：在原子操作上增加了**功能模块**（如利息、转账费、元数据指针），并引入了更强的**控制权限**（永久委托）。\n3.  **Metaplex NFT**：在SPL Token基础上增加了**描述层（元数据）** 和**收益分配规则（版税、创作者列表）**。\n4.  **Programmable NFT (pNFT)**：在NFT上增加了**状态机（锁定/解锁）** 和**基于角色的委托系统**，使NFT具有可编程行为。\n\n\n\n### 行业标准下，是如何区分智能合约的\n\n```mermaid\nflowchart TD\n    subgraph A [项目启动阶段]\n        direction LR\n        P[项目方]\n        TS[代币销售合约]\n        U[用户]\n        \n        P -- 部署 --\u003e TS\n        U -- 支付SOL --\u003e TS\n        TS -- 分发代币 --\u003e U\n        TS -- 募集SOL --\u003e P\n    end\n\n    subgraph B [市场流通阶段]\n        D[DEX/AMM交易合约\u003cbr /\u003e（如 Raydium, Orca）]\n        LP[流动性提供者]\n        T[交易用户]\n        \n        LP -- 注入SOL+代币 --\u003e D\n        D -- 发放LP代币 --\u003e LP\n        T -- 支付SOL --\u003e D\n        D -- 给予代币 --\u003e T\n        T -- 支付代币 --\u003e D\n        D -- 给予SOL --\u003e T\n    end\n\n    A --\u003e B\n```\n\n## 代币销售智能合约\n\n1. anchor框架： https://github.com/rockjl/token-sale-contract\n2. 无anchor框架： .5rem',\n    xl: '2rem',\n  },\n  radii: {\n    sm: '0.25rem',\n    md: '0.5rem',\n    lg: '1rem',\n    full: '9999px',\n  },\n} as const;\n```\n\n### 2. Build Primitive Components\n\nStart with the basics:\n\n```tsx title=\"Button.tsx\"\nimport { cva, type VariantProps } from \"class-variance-authority\";\n\nconst buttonVariants = cva(\n  \"inline-flex items-center justify-center rounded-md font-medium transition-colors\",\n  {\n    variants: {\n      variant: {\n        primary: \"bg-primary text-white hover:bg-primary/90\",\n        secondary: \"bg-secondary text-secondary-foreground hover:bg-secondary/80\",\n        ghost: \"hover:bg-accent hover:text-accent-foreground\",\n      },\n      size: {\n        sm: \"h-8 px-3 text-sm\",\n        md: \"h-10 px-4\",\n        lg: \"h-12 px-6 text-lg\",\n      },\n    },\n    defaultVariants: {\n      variant: \"primary\",\n      size: \"md\",\n    },\n  }\n);\n\ninterface ButtonProps\n  extends React.ButtonHTMLAttributes\u003cHTMLButtonElement\u003e,\n    VariantProps\u003ctypeof buttonVariants\u003e {}\n\nexport function Button({ variant, size, className, ...props }: ButtonProps) {\n  return (\n    \u003cbutton className={buttonVariants({ variant, size, className })} {...props} /\u003e\n  );\n}\n```\n\n## Component Composition\n\nBuild complex components from primitives:\n\n| Level | Examples | Purpose |\n|-------|----------|---------|\n| Tokens | Colors, spacing, typography | Foundation |\n| Primitives | Button, Input, Badge | Building blocks |\n| Patterns | Card, Modal, Dropdown | Common UI patterns |\n| Templates | PageHeader, Sidebar | Layout structures |\n\n## Documentation is Key\n\n\u003e \"A design system without documentation is just a component library.\"\n\nEvery component should include:\n\n1. **Usage examples** - Show common use cases\n2. **Props documentation** - Explain all options\n3. **Accessibility notes** - ARIA labels, keyboard nav\n4. **Do's and Don'ts** - Guide proper usage\n\n## Versioning Strateg STR: \u0026[u8] = b\"hello world\";\nasync fn index(_in: http::Request\u003chyper::body::Incoming\u003e) -\u003e Result\u003cResponse\u003chttp_body_util::Full\u003cBytes\u003e\u003e, hyper::Error\u003e {\n    Ok(Response::new(http_body_util::Full::new(Bytes::from(INDEXSTR))))\n}\nfn main() {\n    let mut rt = tokio::runtime::Builder::new_multi_thread()\n        .enable_all()\n        .build()\n        .unwrap();\n    rt.block_on(async {\n        let addr: std::net::SocketAddr = ([0, 0, 0, 0], 8080).into();\n        let listener = tokio::net::TcpListener::bind(addr).await.unwrap();\n        loop {\n            let (stream, _) = listener.accept().await.unwrap();\n            let io = hyper_util::rt::TokioIo::new(stream);\n\n            tokio::task::spawn(async move {\n                if let Err(err) = hyper::server::conn::http1::Builder::new()\n                    .serve_connection(io, hyper::service::service_fn(index)).await\n                {\n                    println!(\"Error serving connection: {:?}\", err);\n                }\n            });\n        }\n    }); \n}\n```\n\n### 测试流程\n\n1.  gateway服务器以轮训的方式，轮训到这10台服务器。\n2. 测试服务器使用ab命令：```ab -n xxx -c xxx http://172.17.10.102:8080/```用作测试命令。\n3. 为了保证测试的准确性，每条测试数据分三次执行，然后选取中间的数据(注意这里不是平均数据)。\n4. 为了保证测试的准确性，每条ab测试命令的执行间隔至少1分钟。\n5. nginx开启cpu绑定，且其他配置使用最简单的配置。\n6. rwp也开启cpu绑定，且其他配置使用最简单的配置。(rwp使用tokio作为核心异步框架，tokio分为核心线程和阻塞线程。核心线程就是操作系统线程，线程数量默认为cpu核心数。rwp的cpu绑定，绑定的就是tokio的核心线程与cpu的执行关系。)\n7. 优先使用ab命令服务器直接链接单台web服务器做单台性能测试。\n8. 最终在开始整体的系统测试。\n\n### nginx配置\n\n```\nuser www-data;\nworker_processes 16;\nworker_cpu_affinity 0000000000000001 0000000000000010 0000000000000100 0000000000001000 0000000000010000 0000000000100000 0000000001000000 0000000010000000 0000000100000000 0000001000000000 0000010000000000 0000100000000000 0001000000000000 0010000000000000 0100000000000000 1000000000000000;\npid /run/nginx.pid;\ninclude /etc/nginx/modules-enabled/*.conf;\nevents {\n\tworker_connections 102400;\n}\nhttp {\n\tsendfile  TokenStream {\n    let st = syn::parse_macro_input!(input as syn::Item);\n\n    match do_expand(\u0026st) {\n        Ok(token_stream) =\u003e token_stream.into(),\n        Err(e) =\u003e e.to_compile_error().into(),\n    }\n}\n\nfn do_expand(st: \u0026syn::Item) -\u003e syn::Result\u003cproc_macro2::TokenStream\u003e {\n    let ret = match st {\n        syn::Item::Enum(enum_node) =\u003e { Ok(proc_macro2::TokenStream::new())},\n        _ =\u003e syn::Result::Err(syn::Error::new(proc_macro2::Span::call_site(), \"expected enum or match expression\"))\n    }?;\n\n    Ok(ret)\n}\n```\n# 第三关：03-out-of-order\n这一关是错误顺序排序的一个检查。要求错误输出指定错误内容。\n```rust\nuse proc_macro::TokenStream;\nuse proc_macro2;\nuse quote::ToTokens;\nuse syn;\n\n#[proc_macro_attribute]\npub fn sorted(args: TokenStream, input: TokenStream) -\u003e TokenStream {\n    let st = syn::parse_macro_input!(input as syn::Item);\n\n    match do_expand(\u0026st) {\n        Ok(token_stream) =\u003e token_stream.into(),\n        Err(e) =\u003e e.to_compile_error().into(),\n    }\n}\n\nfn do_expand(st: \u0026syn::Item) -\u003e syn::Result\u003cproc_macro2::TokenStream\u003e {\n    let ret = match st {\n        syn::Item::Enum(enum_node) =\u003e { check_enum_order(enum_node)},\n        _ =\u003e syn::Result::Err(syn::Error::new(proc_macro2::Span::call_site(), \"expected enum or match expression\"))\n    }?;\n\n    Ok(ret)\n}\n\nfn check_enum_order(st: \u0026syn::ItemEnum) -\u003e syn::Result\u003cproc_macro2::TokenStream\u003e {\n    let origin_names:Vec\u003c_\u003e = st.variants.iter().map(|item| {\n        (item.ident.to_string(), item)\n    }).collect();\n\n    let mut sorted_origin_names = origin_names.clone();\n    sorted_origin_names.sort_by(|a, b| {\n        a.0.cmp(\u0026b.0)\n    });\n\n    for (a,b) in origin_names.iter().zip(sorted_origin_names.iter()) {\n        if a.0 != b.0 {\n            return syn::Result::Err(syn::Error::new(b.1.ident.span(), format!(\"{} should sort before {}\", b.0, a.0)))\n        }\n    }\n\n    return syn::Result::Ok(st.to_token_stream());\n}\n```\n# 第四关：04-variants-with-data\n这一关麻烦的一点就是，不但要求保证输出指定的错误输出，还不能因为错误导致整个枚举类型被删除。\n```rust\nuse proc_macro::TokenStream;\nuse proc_macro2;\nuse quote::ToTokens;\nuse syn;\n\n#[proc_macro_attribute]\npub fn sorted(args: TokenStream, input: TokenStream) -\u003e TokenStream {\n    let st = syn::parse_macro_input!(input as syn::Item);\n\n    match do_expand(\u0026st) {\n        Ok(token_stream) =\u003e token_stream.into(),\n        Err(e) =\u003e {\n            let mut t = e.to_compile_error();\n            t.extend(st.to_token_stream());//普通的错误输出是不会包含任何的token的。会导我们的属性式过程宏展开的时候，删除我们的枚举体。需要把我们的枚举体加入到错误输出中。\n            t.into()\n        }\n    }\n}\n\nfn do_expand(st: \u0026syn::Item) -\u003e syn::Result\u003cproc_macro2::TokenStream\u003e {\n    let ret = match st {\n        syn::Item::Enum(enum_node) =\u003e { check_enum_order(enum_node)},\n        _ =\u003e syn::Result::Err(syn::Error::new(proc_macro2::Span::call_site(), \"expected enum or match expression\"))\n    }?;\n\n    Ok(ret)\n}\n\nfn check_enum_order(st: \u0026syn::ItemEnum) -\u003e syn::Result\u003cproc_macro2::TokenStream\u003e {\n    let origin_names:Vec\u003c_\u003e = st.variants.iter().map(|item| {\n        (item.ident.to_string(), item)\n    }).collect();\n\n    let mut sorted_origin_names = origin_names.clone();\n    sorted_origin_names.sort_by(|a, b| {\n        a.0.cmp(\u0026b.0)\n    });\n\n    for (a,b) in origin_names.iter().zip(sorted_origin_names.iter()) {\n        if a.0 != b.0 {\n            return syn::Result::Err(syn::Error::new(b.1.ident.span(), format!(\"{} should sort before {}\", b.0, a.0)))\n        }\n    }\n\n    return syn::Result::Ok(st.to_token_stream());\n}\n```\n# 第五关：05-match-expr\n这关要求实现两个过程宏。并且删除check属性式过程宏内部的sorted属性标签。并给予正确的预期提示。\n```rust\nuse proc_macro::TokenStream;\nuse proc_macro2;\nuse quote::ToTokens;\nuse syn::{self, visit_mut::VisitMut};\n\n#[proc_macro_attribute]\npub fn sorted(args: TokenStream, input: TokenStream) -\u003e TokenStream {\n    let st = syn::parse_macro_input!(input as syn::Item);\n\n    match do_expand(\u0026st) {\n        Ok(token_stream) =\u003e token_stream.into(),\n        Err(e) =\u003e {\n            let mut t = e.to_compile_error();\n            t.extend(st.to_token_stream());//普通的错误输出是不会包含任何的token的。会导我们的属性式过程宏展开的时候，删除我们的枚举体。需要把我们的枚举体加入到错误输出中。\n            t.into()\n        }\n    }\n}\n\nfn do_expand(st: \u0026syn::Item) -\u003e syn::Result\u003cproc_macro2::TokenStream\u003e {\n    let ret = match st {\n        syn::Item::Enum(enum_node) =\u003e { check_enum_order(enum_node)},\n        _ =\u003e syn::Result::Err(syn::Error::new(proc_macro2::Span::call_site(), \"expected enum or match expression\"))\n    }?;\n\n    Ok(ret)\n}\n\nfn check_enum_order(st: \u0026syn::ItemEnum) -\u003e syn::Result\u003cproc_macro2::TokenStream\u003e {\n    let origin_names:Vec\u003c_\u003e = st.variants.iter().map(|item| {\n        (item.ident.to_string(), item)\n    }).collect();\n\n    let mut sorted_origin_names = origin_names.clone();\n    sorted_origin_names.sort_by(|a, b| {\n        a.0.cmp(\u0026b.0)\n    });\n\n    for (a,b) in origin_names.iter().zip(sorted_origin_names.iter()) {\n        if a.0 != b.0 {\n            return syn::Result::Err(syn::Error::new(b.1.ident.span(), format!(\"{} should sort before {}\", b.0, a.0)))\n        }\n    }\n\n    return syn::Result::Ok(st.to_token_stream());\n}\n\n\n// check属性式过程宏\n#[proc_macro_attribute]\npub fn check(_args: TokenStream, input: TokenStream) -\u003e TokenStream {\n    let mut st = syn::parse_macro_input!(input as syn::ItemFn);\n\n    match do_match_expand(\u0026mut st) {\n        Ok(token_stream) =\u003e token_stream.into(),\n        Err(e) =\u003e {\n            let mut t = e.to_compile_error();\n            t.extend(st.to_token_stream());\n            t.into()\n        }\n    }\n}\n\nfn do_match_expand(st: \u0026mut syn::ItemFn) -\u003e syn::Result\u003cproc_macro2::TokenStream\u003e {\n    let mut vi TokenStream {\n    let st = syn::parse_macro_input!(input as syn::DeriveInput);\n    match do_expand(\u0026st) {\n        Ok(token_stream) =\u003e token_stream.into(),\n        Err(e) =\u003e e.to_compile_error().into(),\n    }\n}\n\nfn do_expand(st: \u0026syn::DeriveInput) -\u003e syn::Result\u003cproc_macro2::TokenStream\u003e {\n    let ret = proc_macro2::TokenStream::new();\n\n    return Ok(ret);\n}\n\n```\n# 第二关：02-impl-debug.rs\n这一关主要要求实现类似Debug一样过程宏的，可以打印结构体的一个过程宏的功能。其原理就是为结构体实现一个实现std::fmt::Debug的行为，剩下的就是字符串拼接的事情了。\n```rust\nuse proc_macro::TokenStream;\nuse syn::{self, spanned::Spanned};\nuse quote::{ToTokens, quote};\n\n#[proc_macro_derive(CustomDebug)]\npub fn derive(input: TokenStream) -\u003e TokenStream {\n    let st = syn::parse_macro_input!(input as syn::DeriveInput);\n    match do_expand(\u0026st) {\n        Ok(token_stream) =\u003e token_stream.into(),\n        Err(e) =\u003e e.to_compile_error().into(),\n    }\n}\n\ntype StructFields = syn::punctuated::Punctuated\u003csyn::Field, syn::Token!(,)\u003e;\nfn get_fields_from_derive_input(d: \u0026syn::DeriveInput) -\u003e syn::Result\u003c\u0026StructFields\u003e {\n    if let syn::Data::Struct(syn::DataStruct {\n        fields: syn::Fields::Named(syn::FieldsNamed{\n            ref named,\n            ..\n        }),\n        ..\n    }) = d.data {\n        return Ok(named);\n    }\n    return Err(syn::Error::new_spanned(d, \"Must define on a Struct, not Enum\".to_string()));\n}\n\nfn do_expand(st: \u0026syn::DeriveInput) -\u003e syn::Result\u003cproc_macro2::TokenStream\u003e {\n    let fields = get_fields_from_derive_input(st)?;\n    let struct_name_ident = \u0026st.ident;\n    let struct_name_literal = struct_name_ident.to_string();\n\n    let mut fields_stream = proc_macro2::TokenStream::new();\n\n    for field in fields.iter() {\n        let field_name_ident = field.ident.as_ref().unwrap();\n        let field_name_literal = field_name_ident.to_string();\n        fields_stream.extend(quote::quote!( //拼接所有成员变量\n            .field(#field_name_literal, \u0026self.#field_name_ident)\n        ));\n    }\n\n    let ret = quote::quote!(\n        impl std::fmt::Debug for #struct_name_ident {\n            fn fmt(\u0026self, fmt: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n                fmt.debug_struct(#struct_name_literal)\n                   #fields_stream\n                   .finish() // We're good to go!\n            }\n        }\n    );\n\n    return Ok(ret);\n}\n```\n# 第三关：03-custom-format.rs\n增加了过程宏中派生宏里边惰性属性的功能。为特定字段增加打印限制。第三关实际上是利用format_args!这个宏解决了特定格式的格式化打印功能。\n```rust\nuse proc_macro::TokenStream;\nuse syn::{self, spanned::Spanned};\nuse quote::{ToTokens, quote};\n\n#[proc_macro_derive(CustomDebug, attributes(debug))]\npub fn derive(input: TokenStream) -\u003e TokenStream {\n    let st = syn::parse_macro_input!(input as syn::DeriveInput);\n    match do_expand(\u0026st) {\n        Ok(token_stream) =\u003e token_stream.into(),\n        Err(e) =\u003e e.to_compile_error().into(),\n    }\n}\n\ntype StructFields = syn::punctuated::Punctuated\u003csyn::Field, syn::Token!(,)\u003e;\nfn get_fields_from_derive_input(d: \u0026syn::DeriveInput) -\u003e syn::Result\u003c\u0026StructFields\u003e {\n    if let syn::Data::Struct(syn::DataStruct {\n        fields: syn::Fields::Named(syn::FieldsNamed{\n            ref named,\n            ..\n        }),\n        ..\n    }) = d.data {\n        return Ok(named);\n    }\n    return Err(syn::Error::new_spanned(d, \"Must define on a Struct, not Enum\".to_string()));\n}\n\nfn get_custom_format_of_field(field: \u0026syn::Field) -\u003e syn::Result\u003cOption\u003cString\u003e\u003e {\n    for attr in \u0026field.attrs {\n        if let Ok(syn::Meta::NameValue(syn::MetaNameValue {\n            ref path,\n            ref lit,\n            ..\n        })) = attr.parse_meta() {\n            if path.is_ident(\"debug\") {\n                if let syn::Lit::Str(ref ident_str) = lit {\n                    return Ok(Some(\n                        ident_str.value()\n                    ));\n                }\n            }\n        }\n    }\n    Ok(None)\n}\n\nfn do_expand(st: \u0026syn::DeriveInput) -\u003e syn::Result\u003cproc_macro2::TokenStream\u003e {\n    let fields = get_fields_from_derive_input(st)?;\n    let struct_name_ident = \u0026st.ident;\n    let struct_name_literal = struct_name_ident.to_string();\n\n    let mut fields_stream = proc_macro2::TokenStream::new();\n\n    for field in fields.iter() {\n        let field_name_ident = field.ident.as_ref().unwrap();\n        let field_name_literal = field_name_ident.to_string();\n        let mut format_str = \"{:?}\".to_string();\n        if let Some(format) = get_custom_format_of_field(field)? {\n            format_str = format;\n        }\n        \n        fields_stream.extend(quote::quote!( //拼接所有成员变量\n            .field(#field_name_literal, \u0026format_args!(#format_str, \u0026self.#field_name_ident))\n        ));\n        \n    }\n\n    let ret = quote::quote!(\n        impl std::fmt::Debug for #struct_name_ident {\n            fn fmt(\u0026self, fmt: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n                fmt.debug_struct(#struct_name_literal)\n                   #fields_stream\n                   .finish() // We're good to go!\n            }\n        }\n    );\n\n    return Ok(ret);\n}\n\n```\n# 第四关：04-type-parameter.rs\n考的是结构体中包含泛型参数的时候，在impl中如何处理。\n这里主要的问题是结构体增加了泛型参数，导致我们生成的impl没有增加泛型参数而报错，无法通过测试。这块可以通过split_for_impl这个函数来获得我们想要的信息。[https://docs.rs/syn/1.0/syn/struct.Generics.html#method.split_for_impl](https://docs.rs/syn/1.0/syn/struct.Generics.html#method.split_for_impl)\n```rust\nuse proc_macro::TokenStream;\nuse syn::{self, spanned::Spanned, parse_quote};\nuse quote::{ToTokens, quote};\n\n#[proc_macro_derive(CustomDebug, attributes(debug))]\npub fn derive(input: TokenStream) -\u003e TokenStream {\n    let st = syn::parse_macro_input!(input as syn::DeriveInput);\n    match do_expand(\u0026st) {\n        Ok(token_stream) =\u003e token_stream.into(),\n        Err(e) =\u003e e.to_compile_error().into(),\n    }\n}\n\ntype StructFields = syn::punctuated::Punctuated\u003csyn::Field, syn::Token!(,)\u003e;\nfn get_fields_from_derive_input(d: \u0026syn::DeriveInput) -\u003e syn::Result\u003c\u0026StructFields\u003e {\n    if let syn::Data::Struct(syn::DataStruct {\n        fields: syn::Fields::Named(syn::FieldsNamed{\n            ref named,\n            ..\n        }),\n        ..\n    }) = d.data {\n        return Ok(named);\n    }\n    return Err(syn::Error::new_spanned(d, \"Must define on a Struct, not Enum\".to_string()));\n}\n\nfn get_custom_format_of_field(field: \u0026syn::Field) -\u003e syn::Result\u003cOption\u003cString\u003e\u003e {\n    for attr in \u0026field.attrs {\n        if let Ok(syn::Meta::NameValue(syn::MetaNameValue {\n            ref path,\n            ref lit,\n            ..\n        })) = attr.parse_meta() {\n            if path.is_ident(\"debug\") {\n                if let syn::Lit::Str(ref ident_str) = lit {\n                    return Ok(Some(\n                        ident_str.value()\n                    ));\n                }\n            }\n        }\n    }\n    Ok(None)\n}\n\nfn generate_debug_fields(fields: \u0026syn::punctuated::Punctuated\u003csyn::Field, syn::Token!(,)\u003e) -\u003e syn::Result\u003cproc_macro2::TokenStream\u003e {\n    let mut ret = proc_macro2::TokenStream::new();\n    for field in fields.iter() {\n        let field_name_ident = field.ident.as_ref().unwrap();\n        let field_name_literal = field_name_ident.to_string();\n        let mut format_str = \"{:?}\".to_string();\n        if let Some(format) = get_custom_format_of_field(field)? {\n            format_str = format;\n        }\n        \n        ret.extend(quote::quote!( //拼接所有成员变量\n            .field(#field_name_literal, \u0026format_args!(#format_str, \u0026self.#field_name_ident))\n        ));\n    }\n    Ok(ret)\n}\n\nfn do_expand(st: \u0026syn::DeriveInput) -\u003e syn::Result\u003cproc_macro2::TokenStream\u003e {\n    let fields = get_fields_from_derive_input(st)?;\n    let struct_name_ident = \u0026st.ident;\n    let struct_name_literal = struct_name_ident.to_string();\n\n    let fields_stream = generate_debug_fields(fields)?;\n\n    let mut generics_param_to_modify = st.generics.clone();\n    for mut g in generics_param_to_modify.params.iter_mut() {\n        if let syn::GenericParam::Type(t) = g {\n            t.bounds.push(parse_quote!(std::fmt::Debug));//把Debug的这个tait增加到原有的语法树节点上\n        }\n    }\n\n    // 通过split_for_impl()函数把房型抽取出来形成三个impl的片段\n    let (impl_generics, type_generics, where_clause) = generics_param_to_modify.split_for_impl();\n\n\n    let ret = quote::quote!(\n        impl #impl_generics std::fmt::Debug for #struct_name_ident #type_generics #where_clause{\n            fn fmt(\u0026self, fmt: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n                fmt.debug_struct(#struct_name_literal)\n                   #fields_stream\n                   .finish() // We're good to go!\n            }\n        }\n    );\n\n    return Ok(ret);\n}\n\n```\n# 第五关：05-phantom-data.rs\n本小关卡，考的是结构体内部包含的结构体，已经实现了Debug后，如何处理这种问题。\n```rust\nuse proc_macro::TokenStream;\nuse syn::{self, spanned::Spanned, parse_quote};\nuse quote::{ToTokens, quote};\n\n#[proc_macro_derive(CustomDebug, attributes(debug))]\npub fn derive(input: TokenStream) -\u003e TokenStream {\n    let st = syn::parse_macro_input!(input as syn::DeriveInput);\n    match do_expand(\u0026st) {\n        Ok(token_stream) =\u003e token_stream.into(),\n        Err(e) =\u003e e.to_compile_error().into(),\n    }\n}\n\ntype StructFields = syn::punctuated::Punctuated\u003csyn::Field, syn::Token!(,)\u003e;\nfn get_fields_from_derive_input(d: \u0026syn::DeriveInput) -\u003e syn::Result\u003c\u0026StructFields\u003e {\n    if let syn::Data::Struct(syn::DataStruct {\n        fields: syn::Fields::Named(syn::FieldsNamed{\n            ref named,\n            ..\n        }),\n        ..\n    }) = d.data {\n        return Ok(named);\n    }\n    return Err(syn::Error::new_spanned(d, \"Must define on a Struct, not Enum\".to_string()));\n}\n\nfn get_custom_format_of_field(field: \u0026syn::Field) -\u003e syn::Result\u003cOption\u003cString\u003e\u003e {\n    for attr in \u0026field.attrs {\n        if let Ok(syn::Meta::NameValue(syn::MetaNameValue {\n            ref path,\n            ref lit,\n            ..\n        })) = attr.parse_meta() {\n            if path.is_ident(\"debug\") {\n                if let syn::Lit::Str(ref ident_str) = lit {\n                    return Ok(Some(\n                        ident_str.value()\n                    ));\n                }\n            }\n        }\n    }\n    Ok(None)\n}\n\nfn generate_debug_fields(fields: \u0026syn::punctuated::Punctuated\u003csyn::Field, syn::Token!(,)\u003e) -\u003e syn::Result\u003cproc_macro2::TokenStream\u003e {\n    let mut ret = proc_macro2::TokenStream::new();\n    for field in fields.iter() {\n        let field_name_ident = field.ident.as_ref().unwrap();\n        let field_name_literal = field_name_ident.to_string();\n        let mut format_str = \"{:?}\".to_string();\n        if let Some(format) = get_custom_format_of_field(field)? {\n            format_str = format;\n        }\n        \n        ret.extend(quote::quote!( //拼接所有成员变量\n            .field(#field_name_literal, \u0026format_args!(#format_str, \u0026self.#field_name_ident))\n        ));\n    }\n    Ok(ret)\n}\n\nfn get_member_generic_type_name(field: \u0026syn::Field, member_name: \u0026str) -\u003e syn::Result\u003cOption\u003cString\u003e\u003e {\n    if let syn::Type::Path(syn::TypePath{\n        path: syn::Path{\n            ref segments,\n            ..\n        },\n        ..\n    }) = field.ty {\n        if let Some(syn::PathSegment{\n            ref ident,\n            ref arguments\n        }) = segments.last() {\n            if   None\n}\n\nfn do_expand(st: \u0026syn::DeriveInput) -\u003e syn::Result\u003cproc_macro2::TokenStream\u003e {\n    let fields = get_fields_from_derive_input(st)?;\n    let struct_name_ident = \u0026st.ident;\n    let struct_name_literal = struct_name_ident.to_string();\n    let fields_stream = generate_debug_fields(fields)?;\n    let mut generics_param_to_modify = st.generics.clone();//\\u83B7\\u5F97DeriveInput\\u4E2D\\u7684\\u6CDB\\u578B\\u53C2\\u6570\\u7ED3\\u6784\\u4F53\n\n    if let Some(hatch) = get_struct_escape_hatch(st) {\n        generics_param_to_modify.make_where_clause();\n        generics_param_to_modify\n                    .where_clause\n                    .as_mut()\n                    .unwrap()\n                    .predicates\n                    .push(syn::parse_str(hatch.as_str()).unwrap());\n    } else {\n        let mut field_type_names = Vec::new();\n        let mut type_param_names = Vec::new();\n        for field in fields {\n            if let Some(s) = get_field_type_name(field)? {\n                field_type_names.push(s);\n            }\n            if let Some(s) = get_member_generic_type_name(field, \"PhantomData\")? {\n                type_param_names.push(s);\n            }\n        }\n\n        let associated_types_map = get_generic_associated_types(st);\n        for mut g in generics_param_to_modify.params.iter_mut() {\n            if let syn::GenericParam::Type(t) = g {\n                let type_param_name = t.ident.to_string();\n                if type_param_names.contains(\u0026type_param_name) \u0026\u0026 !field_type_names.contains(\u0026type_param_name) {\n                    continue;\n                }\n                if associated_types_map.contains_key(\u0026type_param_name) \u0026\u0026 !field_type_names.contains(\u0026type_param_name) {\n                    continue;\n                }\n                t.bounds.push(parse_quote!(std::fmt::Debug));//\\u589E\\u52A0trait\\u9650\\u5B9A\\uFF1B(\\u628ADebug\\u7684\\u8FD9\\u4E2Atait\\u589E\\u52A0\\u5230\\u539F\\u6709\\u7684\\u8BED\\u6CD5\\u6811\\u8282\\u70B9\\u4E0A)\n            }\n        }\n\n        generics_param_to_modify.make_where_clause();\n        for (str, associated_types) in associated_types_map {\n            eprintln!(\"\u003e\u003e\u003eassociated_types:{}\", str);\n            for associated_type in associated_types {\n                generics_param_to_modify.where_clause.as_mut().unwrap()\n                    .predicates.push(parse_quote!(#associated_type:std::fmt::Debug));\n            }\n        }\n    }\n\n    \n\n    // \\u901A\\u8FC7split_for_impl()\\u51FD\\u6570\\u628A\\u623F\\u578B\\u62BD\\u53D6\\u51FA\\u6765\\u5F62\\u6210\\u4E09\\u4E2Aimpl\\u7684\\u7247\\u6BB5\n    let (impl_generics, type_generics, where_clause) = generics_param_to_modify.split_for_impl();\n\n\n    let ret = quote::quote!(\n        impl #impl_generics std::fmt::Debug for #struct_name_ident #type_generics #where_clause{\n            fn fmt(\u0026self, fmt: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n                fmt.debug_struct(#struct_name_literal)\n                   #fields_stream\n                   .finish() // We're good to go!\n            }\n        }\n    );\n\n    return Ok(ret);\n}\n\n`})})]})}function l(t={}){let{wrapper:e}=t.components||{};return e?(0,n.jsx)(e,{...t,children:(0,n.jsx)(o,{...t})}):o(t)}return k(T);})();\n;return Component;"])</script><script>self.__next_f.push([1,"39:T4f7d,"])</script><script>self.__next_f.push([1,"| 名字 | 版本号       |\n| ---- | ------------ |\n| rust | 1.69.0       |\n| OS   | ubuntu 22.04 |\n\n本题目不是proc-macro-workshop提供的builder/9道题中的其中任何一道题。本题是我在网上搜索派生宏的时候，无意中查询到的，没有看到派生宏代码，就粘贴下来当作是一道题，自己实现了。\n题目代码是：\n```rust\nuse derive_builder::BeanCheck;\nuse regex::{Regex, Captures};\n\n#[derive(BeanCheck)]\nstruct UserDO {\n    #[Min(30)]\n    pub min_age: u32,\n    #[Max(20)]\n    #[Range(1, 100)]\n    pub age: u16,\n    #[Length(1, 13)]\n    pub username: String,\n    #[Pattern(r\"^\\d{1,5}$\")]\n    pub password: String,\n    #[Email]\n    pub email: String,\n    pub mobile: String,\n}\n\nfn main() {\n    let u = UserDO {\n        min_age: 325,\n        age: 20,\n        username: \"gorey\".to_string(),\n        password: \"12345\".to_string(),\n        email: \"aa@qq.com\".to_string(),\n        mobile: \"13812341234\".to_string()\n    };\n\n    match u.validate() {\n        Ok(_) =\u003e { println!(\"check pass \"); },\n        Err(e) =\u003e { println!(\"{}\", e); },\n    }\n}\n```\n这道题实际上就是为了一个struct结构体成员变量格式自动生成一个校验函数。通过惰性属性，分别为每一个成员变量生成对应不同的校验过程罢了。\n直接上代码：\nlib.rs\n```rust\nuse proc_macro::TokenStream;\nuse syn::{self, spanned::Spanned};\nuse quote::{self, ToTokens};\nuse regex::{Regex, Captures};\n\ntype StructField = syn::punctuated::Punctuated\u003csyn::Field, syn::Token![,]\u003e;\nfn get_fields_from_derive_input(st: \u0026syn::DeriveInput) -\u003e syn::Result\u003c\u0026StructField\u003e { //通过DeriveInput类型获得结构体内部的成员变量列表\n    //这里使用了三种不同的实现方式\n    if let syn::Data::Struct(syn::DataStruct{\n        fields:syn::Fields::Named(syn::FieldsNamed{\n            ref named, ..\n        }), ..\n    }) = st.data {\n        return Ok(named)\n    }\n    //.........................................................\n    // match st.data {\n    //     syn::Data::Struct(syn::DataStruct{\n    //         fields:syn::Fields::Named(syn::FieldsNamed{\n    //             ref named, \n    //             ref brace_token\n    //         }), ..\n    //     }) =\u003e {\n    //         return Ok(named);\n    //     },\n    //     _ =\u003e {},\n    // }\n    //.........................................................\n    // match \u0026st.data {\n    //     syn::Data::Struct(ds) =\u003e {\n    //         match \u0026ds.fields {\n    //             syn::Fields::Named(fieldName) =\u003e {\n    //                 return Ok(\u0026fieldName.named);\n    //             },\n    //             _ =\u003e {}\n    //         }\n    //     },\n    //     _ =\u003e {},\n    // }\n    Err(syn::Error::new_spanned(st, \"Must Define On Struct, Not On Enum\".to_string()))\n}\nfn check_and_take_user_specified_from_ident(field: \u0026syn::Field, attr_str: \u0026str) -\u003e syn::Result\u003cOption\u003csyn::Ident\u003e\u003e {\n    for attr in \u0026field.attrs {\n        if let Ok(syn::Meta::List(syn::MetaList {\n            ref path,\n            ref nested,\n            ..\n        })) = attr.parse_meta() {\n            if let Some(p) = path.segments.first() {\n                if p.ident == attr_str {\n                    match attr_str {\n                        \"Min\" =\u003e {\n                            if let Some(syn::NestedMeta::Lit(syn::Lit::Int(\n                                syn::LitInt{..}\n                            ))) = nested.first() {\n                                return Ok(Some(syn::Ident::new(\n                                    p.ident.to_string().as_str(),\n                                    attr.span(),\n                                )));\n                            } else {\n                                if let Some(syn::NestedMeta::Lit(ref o)) = nested.first() {\n                                    return Err(syn::Error::new_spanned( \n                                        o,                             //第一个参数，决定了报错的范围，‘^'符号指向的范围\n                                        r#\"Min Error\"#                   //第二个参数，决定了报错的错误信息内容\n                                    ));\n                                }\n                            }\n                        },\n                        \"Max\" =\u003e {\n                            if let Some(syn::NestedMeta::Lit(syn::Lit::Int(\n                                syn::LitInt{..}\n                            ))) = nested.first() {\n                                return Ok(Some(syn::Ident::new(\n                                    p.ident.to_string().as_str(),\n                                    attr.span(),\n                                )));\n                            } else {\n                                if let Some(syn::NestedMeta::Lit(ref o)) = nested.first() {\n                                    return Err(syn::Error::new_spanned( \n                                        o,                             //第一个参数，决定了报错的范围，‘^'符号指向的范围\n                                        r#\"Max Error\"#                   //第二个参数，决定了报错的错误信息内容\n                                    ));\n                                }\n                            }\n                        },\n                        \"Range\" =\u003e {\n                            let mut b = false;\n                            if let Some(syn::NestedMeta::Lit(syn::Lit::Int(\n                                syn::LitInt{..}\n                            ))) = nested.first() {\n                                b = true;\n                            } else {\n                                b = false;\n                            }\n                            if let Some(syn::NestedMeta::Lit(syn::Lit::Int(\n                                syn::LitInt{..}\n                            ))) = nested.last() {\n                                b = true;\n                            } else {\n                                b = false;\n                            }\n                            if b \u0026\u0026 nested.len() == 2{\n                                return Ok(Some(syn::Ident::new(\n                                    p.ident.to_string().as_str(),\n                                    attr.span(),\n                                )));\n                            } else {\n                                if let Some(syn::NestedMeta::Lit(ref o)) = nested.first() {\n                                    return Err(syn::Error::new_spanned( \n                                        o,                             //第一个参数，决定了报错的范围，‘^'符号指向的范围\n                                        r#\"Range Error\"#                   //第二个参数，决定了报错的错误信息内容\n                                    ));\n                                }\n                            }\n                        },\n                        \"Length\" =\u003e {\n                            let mut b = false;\n                            if let Some(syn::NestedMeta::Lit(syn::Lit::Int(\n                                syn::LitInt{..}\n                            ))) = nested.first() {\n                                b = true;\n                            } else {\n                                b = false;\n                            }\n                            if let Some(syn::NestedMeta::Lit(syn::Lit::Int(\n                                syn::LitInt{..}\n                            ))) = nested.last() {\n                                b = true;\n                            } else {\n                                b = false;\n                            }\n                            if b \u0026\u0026 nested.len() == 2 {\n                                return Ok(Some(syn::Ident::new(\n                                    p.ident.to_string().as_str(),\n                                    attr.span(),\n                                )));\n                            } else {\n                                if let Some(syn::NestedMeta::Lit(ref o)) = nested.first() {\n                                    return Err(syn::Error::new_spanned( \n                                        o,                             //第一个参数，决定了报错的范围，‘^'符号指向的范围\n                                        r#\"Length Error\"#                   //第二个参数，决定了报错的错误信息内容\n                                    ));\n                                }\n                            }\n                        },\n                        \"Pattern\" =\u003e {\n                            if let Some(syn::NestedMeta::Lit(syn::Lit::Str(\n                                syn::LitStr{..}\n                            ))) = nested.first() {\n                                return Ok(Some(syn::Ident::new(\n                                    p.ident.to_string().as_str(),\n                                    attr.span(),\n                                )));\n                            } else {\n                                if let Some(syn::NestedMeta::Lit(ref o)) = nested.first() {\n                                    return Err(syn::Error::new_spanned( \n                                        o,                             //第一个参数，决定了报错的范围，‘^'符号指向的范围\n                                        r#\"Pattern Error\"#                   //第二个参数，决定了报错的错误信息内容\n                                    ));\n                                }\n                            }\n                        },\n                        \u0026_ =\u003e {},\n                    }\n                    //eprintln!(\"{} {:#?} {:#?}\", attr_str, p.ident, nested.first());\n                }\n            } else {\n                if let Ok(syn::Meta::List(ref o)) = attr.parse_meta() {\n                    return Err(syn::Error::new_spanned( \n                        o,                             //第一个参数，决定了报错的范围，‘^'符号指向的范围\n                        r#\"xxxxxxxxxxxxxxxxxx\"#                   //第二个参数，决定了报错的错误信息内容\n                    ));\n                }\n                if let Ok(syn::Meta::Path(ref o)) = attr.parse_meta() {\n                    return Err(syn::Error::new_spanned( \n                        o,                             //第一个参数，决定了报错的范围，‘^'符号指向的范围\n                        r#\"xxxxxxxxxxxxxxxxxx\"#                   //第二个参数，决定了报错的错误信息内容\n                    ));\n                }\n            }\n        }\n        if let Ok(syn::Meta::Path(syn::Path {\n            ref segments,\n            ref leading_colon,\n        })) = attr.parse_meta() {\n            if segments.first().unwrap().ident == attr_str { //匹配Email\n                // eprintln!(\"\u003epath\u003e{:#?}\", segments);\n                return Ok(Some(syn::Ident::new(\n                    segments.first().unwrap().ident.to_string().as_str(),\n                    attr.span(),\n                )));\n            }\n            // else {\n            //     return Err(syn::Error::new_spanned( \n            //         attr,                             //第一个参数，决定了报错的范围，‘^'符号指向的范围\n            //         r#\"unkown Error\"#                   //第二个参数，决定了报错的错误信息内容\n            //     ));\n            // }\n        }\n    }\n    return Ok(None);\n}\n\nfn check_filter_fields\u003c'a\u003e(fields: \u0026'a syn::punctuated::Punctuated\u003csyn::Field, syn::Token![,]\u003e, attr_str: \u0026str) -\u003e syn::Result\u003cVec\u003c\u0026'a syn::Field\u003e\u003e {\n    let ret = fields.iter().filter(|item|{\n        check_and_take_user_specified_from_ident(item, attr_str).unwrap().is_some()\n    }).collect();\n    Ok(ret)\n}\n\nfn get_attribute_string(field: \u0026syn::Field, attr_str: \u0026str) -\u003e Option\u003csyn::LitStr\u003e {\n    for attr in \u0026field.attrs {\n        if let Ok(syn::Meta::List(syn::MetaList {\n            ref path,\n            ref nested,\n            ..\n        })) = attr.parse_meta() {\n            if let Some(p) = path.segments.first() {\n                if p.ident == attr_str {\n                    if let Some(syn::NestedMeta::Lit(syn::Lit::Str(\n                        litStr\n                    ))) = nested.first() {\n                        /*\n                        此处：\n                            1. 无法创建新的LitStr对象，因为正则表达式前边的r字符无法被正确的转换\n                            2. 无法返回引用，因为生命周期属于函数体\n                            所以只能克隆一个对象然后返回\n                        */\n                        return Some(litStr.clone());\n                    }\n                }\n            }\n        }\n    }\n    None\n}\n\nfn get_attribute_int(field: \u0026syn::Field, attr_str: \u0026str) -\u003e Option\u003csyn::LitInt\u003e {\n    for attr in \u0026field.attrs {\n        if let Ok(syn::Meta::List(syn::MetaList {\n            ref path,\n            ref nested,\n            ..\n )下载这个工程。\n![请添加图片描述](../images/31432a0e2e48dbc010a82efaf964e0c6.png)\n这里面的目录bitfield,builder,debug,seq,sorted。就是这个工程的五个题目了。\n我们先进入到第一题的builder目录看一下。\n![请添加图片描述](../images/5b7abe7e928a13a018e9da1129915b85.png)\n大家可以看到这个工程的目录结构了。当然了原题目只有9个。我自己加了一个，还在网上找了一个，并且全都实现了，这个话题我们后边说，我们这里只介绍这个项目如何运行，如何测试。\n\n- 每一个题目的目录中都需要在当前题目目录/src/lib.rs这个文件中加入自己的答案。\n- 在tests目录中都有一个progress.rs文件，打开里边注释的对应题目的行就可以进行测试了。\n![请添加图片描述](../images/20bc80bb6ff640d68ed3b8273222b01e.png)\n# 如何运行这个progress.rs测试呢？\n第一：在题目目录的Cargo.toml加入依赖，一开始上来，每一个题目目录中的Cargo.toml中的依赖都是空的，都需要我们自己加入。\n第二：在命令方进入工程目录，然后进入题目目录。然后在这个目录直接执行cargo test命令，就可以运行这个progress.rs文件进行标准测试了。\n```rust\nrust_workspace/rockjl_proc-macro-workshop/builder$ \nrust_workspace/rockjl_proc-macro-workshop/builder$ cargo test\n```\n\u003cfont color=\"red\"\u003e我们直接写的过程宏，只要能通过测试就算是过关了\u003c/font\u003e\n# 如何调试自己的过程宏？\n第一：过程宏属于编译期运行的。所以debug肯定不好使。所以第一种调试方式就是命令方大法。但是不可是使用标准输出，会被拦截。必须使用错误输出eprintln!这个宏，才可以。使用这个宏，加入到lib.rs文件中，打印自己开发的过程宏代码中，就可以进行测试了。\n\n第二：把题目粘贴到最外层的main.rs中，然后在vscode中使用F5，运行一下整个工程。如果没有任何报错，就证明当前过程宏编译没有错误。\n\n第三：安装nightly，可以看到过程宏展开以后的代码。这样的话，我们可以进行精准调试。\n首先显示第二种把题目粘贴到main.rs。然后安装nightly(这个可以自行百度)版本。最后进入工程主目录，执行cargo expand命令，就可以查看展开以后的代码了。\n\n```rust\nrust_workspace/rockjl_proc-macro-workshop$ \nrust_workspace/rockjl_proc-macro-workshop$ cargo expand\n```\n![请添加图片描述](../images/474aa7b3090450026b7379a99b463658.png)\n最后这些展开的代码同样可以粘贴到main.rs中，查看代码的正确性。"])</script><script>self.__next_f.push([1,"3e:T1e59,"])</script><script>self.__next_f.push([1,"var Component=(()=\u003e{var p=Object.create;var o=Object.defineProperty;var g=Object.getOwnPropertyDescriptor;var m=Object.getOwnPropertyNames;var u=Object.getPrototypeOf,b=Object.prototype.hasOwnProperty;var k=(e,r)=\u003e()=\u003e(r||e((r={exports:{}}).exports,r),r.exports),_=(e,r)=\u003e{for(var c in r)o(e,c,{get:r[c],enumerable:!0})},a=(e,r,c,l)=\u003e{if(r\u0026\u0026typeof r==\"object\"||typeof r==\"function\")for(let t of m(r))!b.call(e,t)\u0026\u0026t!==c\u0026\u0026o(e,t,{get:()=\u003er[t],  {\n    println!(\"abc\");\n}\n```\n这个呃呃呃时候不但要设置Cargo.toml中的features还要设置编译前的环境变量。否则指定函数将无法被找到。"])</script><script>self.__next_f.push([1,"40:T1a2a,"])</script><script>self.__next_f.push([1,"var Component=(()=\u003e{var o=Object.create;var a=Object.defineProperty;var b=Object.getOwnPropertyDescriptor;var u=Object.getOwnPropertyNames;var p=Object.getPrototypeOf,f=Object.prototype.hasOwnProperty;var m=(c,n)=\u003e()=\u003e(n||c((n={exports:{}}).exports,n),n.exports),_=(c,n)=\u003e{for(var r in n)a(c,r,{get:n[r],enumerable:!0})},t=(c,n,r,i)=\u003e{if(n\u0026\u0026typeof n==\"object\"||typeof n==\"function\")for(let l of u(n))!f.call(c,l)\u0026\u0026l!==r\u0026\u0026a(c,l,{get:()=\u003en[l],enumerable:!(i=b(n,l))||i.enumerable});return c};var x=(c,n,r)=\u003e(r=c!=null?o(p(c)):{},t(n||!c||!c.__esModule?a(r,\"default\",{value:c,enumerable:!0}):r,c)),j=c=\u003et(a({},\"__esModule\",{value:!0}),c);var h=m((C,d)=\u003e{d.exports=_jsx_runtime});var N={};_(N,{default:()=\u003eg});var e=x(h());function s(c){let n={code:\"code\",h2:\"h2\",h3:\"h3\",h4:\"h4\",img:\"img\",li:\"li\",ol:\"ol\",p:\"p\",pre:\"pre\",...c.components};return(0,e.jsxs)(e.Fragment,{children:[(0,e.jsx)(n.p,{children:\"\\u524D\\u63D0\\u662F\\u4E00\\u4E2Acrate\\u5BFC\\u5165\\u53E6\\u4E00\\u4E2Acrate\\u3002\"}),`\n`,(0,e.jsx)(n.h2,{children:\"\\u5148\\u770B\\u7ED3\\u6784\"}),`\n`,(0,e.jsxs)(n.p,{children:[`test_lib\\u76EE\\u5F55\\u7ED3\\u6784\n`,(0,e.jsx)(n.img,{src:\"../images/ed07084d65be3a396b8180b3d18ed6ac.png\",alt:\"\\u5728\\u8FD9\\u91CC\\u63D2\\u5165\\u56FE\\u7247\\u63CF\\u8FF0\"}),`\n\\u8FD9\\u4E0E\\u53E6\\u4E00\\u4E2Acrate\\u5904\\u4E8E\\u540C\\u4E00\\u4E2A\\u76EE\\u5F55\\uFF0C\\u6240\\u4EE5\\u53E6\\u4E00crate\\u5012\\u5165\\u7684\\u65F6\\u5019\\u5728Cargo.toml\\u4E2D\\u4F7F\\u7528\\u5982\\u4E0B\\u8BED\\u53E5\\u3002`]}),`\n`,(0,e.jsx)(n.pre,{children:(0,e.jsx)(n.code,{className:\"language-bash\",children:`test_lib = { path = \"../test_lib\" }\n`})}),`\n`,(0,e.jsx)(n.p,{children:\"\\u5148\\u5728test_lib         | windows 10 专业版 20H2                      |\n| mac下rustc --version | rustc 1.74.0-nightly (58eefc33a 2023-08-24) |\n\n## 查看当前系统支持的交叉编译指定系统版本列表\n```bash\nrustup target list\n```\n如果已经安装这里会显示（installed）。\n![在这里插入图片描述](../images/edd669766a79c99a0f4b833cfd0923b9.png)\n## 安装target与对应的链接器\nlinux通常就是musl和gnu。我用的测试系统是ubuntu，所以是gnu。\n### musl\n```bash\nrustup target add x86_64-unknown-linux-musl\n```\n```bash\nbrew install filosottile/musl-cross/musl-cross\n```\n### gnu\n```bash\nrustup target add x86_64-unknown-linux-gnu\n```\n```bash\nbrew install SergioBenitez/osxct/x86_64-unknown-linux-gnu\n```\n### windows\n```bash\nrustup target add x86_64-pc-windows-gnu\n```\n```bash\nbrew install mingw-w64\n```\n## 配置工程\n如下配置添加到Cargo.toml\n```xml\n[target.x86_64-unknown-linux-musl] # 也支持[build]节点 设置target=...\nlinker = \"x86_64-linux-musl-gcc\"\n[target.x86_64-unknown-linux-gnu]\nlinker = \"x86_64-unknown-linux-gnu-gcc\"\n[target.x86_64-pc-windows-gnu]\nlinker = \"x86_64-w64-mingw32-gcc\"\n```\n\n## MAC下编译\n### ubuntu\n```bash\ncargo build --release --target=x86_64-unknown-linux-gnu\n//如果这条命令编译出问题，可以尝试下面的命令\ncargo zigbuild --release --target=x86_64-unknown-linux-gnu\n```\n### windows\n```bash\ncargo build --release --target=x86_64-pc-windows-gnu`\n```\n## 问题补充\n### 如果碰到openssl问题\n那一定是openssl与rust的编译环境没有配置好。\n使用如下语句配置编译环境，即可通过。\n```bash\nOPENSSL_LIB_DIR=/usr/lib OPENSSL_INCLUDE_DIR=/usr/include/openssl PKG_CONFIG_PATH=/usr/lib/pkgconfig CARGO_TARGET_DIR=\"./target\" cargo build --release --target x86_64-pc-windows-gnu\n```\n### 实在不行可以尝试一下zigbuild\n\u003cfont color=\"red\"\u003e如果在传输**可执行文件**到目标机器执行的时候，出现问题。可以尝试更换传输方式。打比方之前使用的ftp，现在你可以先压缩文件然后再尝试传输文件。\u003c/font\u003e"])</script><script>self.__next_f.push([1,"42:T16fe,"])</script><script>self.__next_f.push([1,"var Component=(()=\u003e{var g=Object.create;var d=Object.defineProperty;var o=Object.getOwnPropertyDescriptor;var m=Object.getOwnPropertyNames;var p=Object.getPrototypeOf,x=Object.prototype.hasOwnProperty;var b=(r,n)=\u0
