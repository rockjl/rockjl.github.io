``rust\nfn mem_alloc() {\n    let first_node = Rc::new(RefCell::new(Node::new(0)));\n    let mut cur_node = first_node.clone();\n    for idx in 1..819200 {\n        let next_node = Rc::new(RefCell::new(Node::new(idx)));\n        cur_node.borrow_mut().next = Some(next_node.clone());\n        cur_node = next_node;\n    }\n    // cur_node.borrow_mut().next = Some(first_node.clone());\n    std::mem::ManuallyDrop::new(first_node);\n    // std::mem::forget(cur_node);\n}\n```\n这里提前说一嘴：被如下包裹的数据都会被内存管理器遗忘。都有可能造成内存泄露。我这里说的是有可能，这个问题我们后面说。\n1. std::mem::forget()\n2. Box::leak()\n3. Box::into_raw()\n# 内存分配\n当然这里也不用多说，rust的内存分配大家都知道分为堆和栈两种。\n- 堆\n堆空间的内存分配需要使用智能指针的配合。像是Vec和String都是存储在堆中。\n- 栈\n对于栈的分配我们需要来讲一讲。栈空间是有限的，为什么说有限，是因为栈空间是在当前线程的执行堆栈中分配内存，受限于当前线程的堆栈大小。(\u003cfont color=\"red\"\u003e线程的默认堆栈大小可以直接修改操作系统的参数，如果是我们自己启动的线程可以在线程启动之前来修改\u003c/font\u003e)。\n包括数组的初始化，我们可以发现rust对于数组的初始化，如果想在栈空间初始化过大的数组是一件很累的事情。如果手动在栈空间写出来了一个超大的数组，并且大小超过了当前线程执行的堆栈大小，进程在执行到需要在线程堆栈非配大量内存的函数的时候，在这个函数的位置会报错(\u003cfont color=\"red\"\u003e注意：这里不是panic。是报错：EXC_BAD_ACCESS(code=2, address=0x7ff7bf700600。我的是mac，其他的操作系统错误也只是大同小异罢了。下面代码如果在某些人电脑上面没有出现错误，可以复制大量的new_obj代码行。一定会出现的。)\u003c/font\u003e)。\n```rust\n#[derive(Debug)]\nstruct Obj {\n    name: String,\n    index: u32,\n    option: [u32; 81920],\n}\nimpl Drop for Obj {\n    fn drop(\u0026mut self) {\n        println!(\"drop:{:?}\", self.index);\n    }\n}\nfn new_obj(name: String, index: u32, option: [u32; 81920]) -\u003e Obj {\n    Obj { name, index, option }\n}\nfn mem_alloc() {\n    let arr = [\n        new_obj(\"rockjiang\".to_string(), 22, [1101; 81920]),\n        new_obj(\"rockjiang\".to_string(), 22, [1101; 81920]),\n        new_obj(\"rockjiang\".to_string(), 22, [1101; 81920]),\n        new_obj(\"rockjiang\".to_string(), 22, [1101; 81920]),\n        new_obj(\"rockjiang\".to_string(), 22, [1101; 81920]),\n        new_obj(\"rockjiang\".to_string(), 22, [1101; 81920]),\n        new_obj(\"rockjiang\".to_string(), 22, [1101; 81920]),\n        new_obj(\"rockjiang\".to_string(), 22, [1101; 81920]),\n        new_obj(\"rockjiang\".to_string(), 22, [1101; 81920]),\n        new_obj(\"rockjiang\".to_string(), 22, [1101; 81920]),\n        new_obj(\"rockjiang\".to_string(), 22, [1101; 81920]),\n        new_obj(\"rockjiang\".to_string(), 22, [1101; 81920]),\n        new_obj(\"rockjiang\".to_string(), 22, [1101; 81920]),\n        new_obj(\"rockjiang\".to_string(), 22, [1101; 81920]),\n        new_obj(\"rockjiang\".to_string(), 22, [1101; 81920]),\n        new_obj(\"rockjiang\".to_string(), 22, [1101; 81920]),\n        new_obj(\"rockjiang\".to_string(), 22, [1101; 81920]),\n        new_obj(\"rockjiang\".to_string(), 22, [1101; 81920]),\n        new_obj(\"rockjiang\".to_string(), 22, [1101; 81920]),\n        new_obj(\"rockjiang\".to_string(), 22, [1101; 81920]),\n    ];\n}\n```\n# 内存回收\n对于内存的回收有两个维度需要讲。一个是堆，一个是栈。\n我们带着问题来深入的探讨一下rust的内存回收。\n1. drop函数何时执行？\n2. 堆栈的数据何时回收内存？\n\n先看一段完整的代码。然后我们再来一点一点的修改。\n```rust\n#[derive(Debug)]\nstruct Obj {\n    name: String,\n    index: u32,\n    option: [u32; 81920],\n}\nimpl Drop for Obj {\n    fn drop(\u0026mut self) {\n        println!(\"drop.Obj:{:?}\", self.index);\n    }\n}\nfn new_obj(name: String, index: u32, option: [u32; 81920]) -\u003e Obj {\n    Obj { name, index, option }\n}\nfn mem_alloc() {\n    println!(\"mem_alloc start\");\n    let obj = new_obj(\"rockjiang\".to_string(), 11, [1101; 81920]);\n    //let obj = Box::new(new_obj(\"rockjiang\".to_string(), 11, [1101; 81920]));\n    {\n        let obj = new_obj(\"rockjiang\".to_string(), 22, [1101; 81920]);\n        //let obj = Box::new(new_obj(\"rockjiang\".to_string(), 22, [1101; 81920]));\n    }\n    println!(\"mem_alloc stop\");\n}\nfn test_mem_recycling() {\n    println!(\"test_mem_recycling function start\");\n    sleep(1000 * 10);\n    println!(\"start add mem\");\n    mem_alloc();\n    println!(\"outside stack_alloc\");\n    sleep(1000 * 10);\n    println!(\"test_mem_recycling function stop\");\n}\n```\n我相信上面的代码不管在堆还是在栈，控制台的输出都是如下这个样子的。但是我们的内存真的被回收了吗？内存又何时被回收？我们带着这些问题来详细的探讨一下。\n```bash\ntest_mem_recycling function start\nstart add mem\nmem_alloc start\ndrop.Obj:22\nmem_alloc stop\ndrop.Obj:11\noutside stack_alloc\ntest_mem_recycling function stop\n```\n我们下面分为两个维度来深入的探讨。\n## 堆\n我们修改mem_alloc函数\n```rust\nfn mem_alloc() {\n    println!(\"mem_alloc start\");\n    let mut v = Vec::new();\n    for idx in 0..8192 {\n        v.push(new_obj(\"rockjiang\".to_string(), idx, [1101; 81920]));\n    }\n    println!(\"mem_alloc stop\");\n}\n```\n可以在控制台配合系统监视器的情况下，看到程序在进入mem_alloc函数和推出mem_alloc函数的时候内存的突增和消失。这证明了堆内存实在函数的退出的时候释放的。\n我们再来改一下：\n```rust\nprintln!(\"mem_alloc start\");\n    {\n        let mut v = Vec::new();\n        for idx in 0..8192 {\n            v.push(new_obj(\"rockjiang\".to_string(), idx, [1101; 81920]));\n        }\n    }\n    println!(\"outside code block\");\n    sleep(1000 * 10);\n    println!(\"mem_alloc stop\");\n```\n这次我们可以清晰的看到在控制台输出outside code block的时候，系统监视器中进程的内存被大量回收了。被来占用单位上GB的内存瞬间跌落在了几个MB级别。那么也就是说在堆空间代码块的结束也可以让内存回收，并且drop函数的执行。\n那么我们继续修改代码。\n```rust\nprintln!(\"mem_alloc start\");\n    let mut v = Vec::new();\n    for idx in 0..8192 {\n        v.push(new_obj(\"rockjiang\".to_string(), idx, [1101; 81920]));\n    }\n    std::mem::forget(v);\n    println!(\"mem_alloc stop\");\n}\n```\n这次不管如何我们看到了内存泄露。我们第一个内存泄露也分析了这种情况。内存在堆的时候并且被std::mem::ManuallyDrop包裹的时候，会造成内存泄露。\n## 栈\n对于栈空间的测试修改的比较大，我重新粘贴代码。由于需要更大的栈空间来做测试，所以我们新建了一个更大堆栈空间的线程来执行指定的代码。来详细的跟踪一下代码的执行情况与内存的回收情况。\n```rust\nfn mem_alloc() {\n    println!(\"mem_alloc start\");\n    let arr = [\n        new_obj(\"rockjiang\".to_string(), 22, [1101; 81920]),\n        new_obj(\"rockjiang\".to_string(), 22, [1101; 81920]),\n        new_obj(\"rockjiang\".to_string(), 22, [1101; 81920]),\n        //...此处省略很多行。请复制N行出来。堆栈不够大的自行调整。\n    ];\n    std::mem::ManuallyDrop::new(arr);//这里即便把数据使用ManuallyDrop包裹，仅仅会造成逻辑回收的内存泄露，但是不会阻挡当线程销毁时候的物理回收的执行。最终结果并不会造成真实的内存泄露。\n    sleep(1000 * 10);\n    println!(\"mem_alloc stop\");\n}\nfn test_mem_recycling() {\n    println!(\"test_mem_recycling function start\");\n    sleep(1000 * 10);\n    println!(\"start add mem\");\n    \n    mem_alloc();\n    \n    \n    println!(\"outside stack_alloc\");\n    sleep(1000 * 20);\n    println!(\"test_mem_recycling function stop\");\n}\nfn sleep(t: u64) {\n    std::thread::sleep(std::time::Duration::from_millis(t));\n}\nfn new_thread() {\n    let jh = std::thread::Builder::new().stack_size(8192000000).spawn(|| {\n        test_mem_recycling();\n    }).unwrap();\n    \n    jh.join().unwrap();\n}\n```\n从上面代码的执行，可以看出。栈空间的申请，是在对应函数执行的时候就会申请了。但是内存的回收确是在执行函数对应的线程销毁的时候。\n我们继续修改上面的代码：只修改两个函数。\n\n```rust\nfn mem_alloc(ptr: \u0026mut Option\u003c*const Obj\u003e) {\n    println!(\"mem_alloc start\");\n    let obj = new_obj(\"rockjiang\".to_string(), 22, [1101; 81920]);\n    *ptr = Some(\u0026obj as *const Obj);\n    sleep(1000 * 10);\n    println!(\"mem_alloc stop\");\n}\nfn test_mem_recycling() {\n    println!(\"test_mem_recycling function start\");\n    sleep(1000 * 10);\n    println!(\"start add mem\");\n\n    let mut ptr = None;\n    \n    mem_alloc(\u0026mut ptr);\n    \n    unsafe {\n        if let Some(p) = ptr {\n            println!(\"ptr={:?}\", *p);\n        } else {\n            println!(\"None\");\n        }\n    }\n    \n    println!(\"outside stack_alloc\");\n    sleep(1000 * 20);\n    println!(\"test_mem_recycling function stop\");\n}\n```\n再来看控制台输出。可以看出，虽然栈空间的内存是在调用函数的时候分配，在线程结束的时候才会被回收。但是在函数结束的时候就会被……我们这里造两个词汇(逻辑回收/物理回收)。\n```bash\ntest_mem_recycling function start\nstart add mem\nmem_alloc start\nmem_alloc stop\ndrop.Obj:22\nptr=Obj { name: \"\\0\\0\\0\\0\\0\\0\\0\\0\\0\", index: 22, option: [1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, 1101, ......\noutside stack_alloc\n```\n## 总结\n1. 栈内存的分配是在函数调用的时候，函数那需要多大的栈空间那么就需要申请多大的内存空间。注意这里是函数调用的时候，而不是代码块调用的时候。\n2. 栈内存的回收是在堆栈所在线程销毁的时候。不管在控制台查看还是在系统监视器中查看，都是这个结果。\n3. 堆内存的分配是在代码调用的时候，准确的说是哪里调用了代码哪里就分配了内存。\n4. 堆内存的释放是在数据所有者所在作用于结束的时候即刻回收内存。\n5. 如果使用了std::mem::ManuallyDrop。栈内存还是在线程销毁的时候回收内存。堆空间内存则会造成泄露。\n6. \u003cfont color=\"red\"\u003e注意：数据不管是在堆还是在栈，被回收的内存都有可能处于无法访问的状态。有些同学尝试使用unsafe访问被回收的内存地址，如果数据在栈，并且当前线程还未销毁的情况下，还不会有问题。但是如果数据在堆，就很有可能会报错。造成程序的终止\u003c/font\u003e"])</script><script>self.__next_f.push([1,"44:T5a2d,"])</script><script>self.__next_f.push([1,"var Component=(()=\u003e{var _=Object.create;var l=Object.defineProperty;var p=Object.getOwnPropertyDescriptor;var u=Object.getOwnPropertyNames;var g=Object.getPrototypeOf,h=Object.prototype.hasOwnProperty;var j=(t,n)=\u003e()=\u003e(n||t((n={exports:{}}).exports,n),n.exports),f=(t,n)=\u003e{for(var o in n)l(t,o,{get:n[o],enumerable:!0})},c=(t,n,o,i)=\u003e{if(n\u0026\u0026typeof n==\"object\"||typeof n==\"function\")for(let r of u(n))!h.call(t,r)\u0026\u0026r!==o\u0026\u0026l(t,r,{get:()=\u003en[r],enumerable:!(i=p(n,r))||i.enumerable});return t};var b=(t,n,o)=\u003e(o=t!=null?_(g(t)):{},c(n||!t||!t.__esModule?l(o,\"default\",{value:t,enumerable:!0}):o,t)),w=t=\u003ec(l({},\"__esModule\",{value:!0}),t);var a=j((N,d)=\u003e{d.exports=_jsx_runtime});var x={};f(x,{default:()=\u003em});var e=b(a());function s(t){let n={code:\"code\",h1:\"h1\",h2:\"h2\",li:\"li\",ol:\"ol\",p:\"p\",pre:\"pre\",ul:\"ul\",...t.components};return(0,e.jsxs)(e.Fragment,{children:[(0,e.jsx)(n.h1,{children:\"\\u5185\\u5B58\\u6CC4\\u9732\"}),`\n`,(0,e.jsx)(n.p,{children:\"\\u9996\\u5148\\u6211\\u4EEC\\u5148\\u6765\\u8BB2\\u5185\\u5B58\\u6CC4\\u9732\\uFF0Crust\\u4E2D\\u6709\\u4E24\\u79CD\\u65B9\\u5F0F\\u53EF\\u4EE5\\u9020\\u6210\\u5185\\u5B58\\u6CC4\\u9732\\u3002\"}),`\n`,(0,e.jsxs)(n.ul,{children:[`\n`,(0,e.jsx)(n.li,{children:`\\u5FAA\\u73AF\\u5F n```bash\nsr : SelfRef { value: \"111111\", ptr: 0x7ff7bfefe2b0 } value: \"111111\" ptr: \"111111\" ptr_address: 0x7ff7bfefe2b0\nsr2: SelfRef { value: \"222222\", ptr: 0x7ff7bfefe2d0 } value: \"222222\" ptr: \"222222\" ptr_address: 0x7ff7bfefe2d0\nafter swap\nsr : SelfRef { value: \"222222\", ptr: 0x7ff7bfefe2d0 } value: \"222222\" ptr: \"111111\" ptr_address: 0x7ff7bfefe2d0\nsr2: SelfRef { value: \"111111\", ptr: 0x7ff7bfefe2b0 } value: \"111111\" ptr: \"222222\" ptr_address: 0x7ff7bfefe2b0\n```\n当打印对象本身的时候，value与ptr两个变量的值的确得到了交换。没有任何问题。但是当我对ptr进行解引用的时候就出现了问题了，因为他还是指向了**内存中**旧的地址，而这个内存地址说的是前一个变量的内存地址。注意这里是**内存中**。ptr并不指向value。ptr与value都是变量，变量也是存储在内存中的，只是他们的内容存储的是指向其他内存地址的值，变量本身也有自己的内存地址。我来修改以下代码，让打印内容变得更清晰。\n```rust\n#[derive(Debug)]\nstruct SelfRef {\n    value: String,\n    ptr: *mut String,\n}\n\nimpl SelfRef {\n    fn new(txt: \u0026str) -\u003e Self {\n        SelfRef {\n            value: String::from(txt),\n            ptr: std::ptr::null_mut(),\n        }\n    }\n    fn init(\u0026mut self) {\n        let v_ref = \u0026self.value;\n        self.ptr = v_ref as *const String as *mut String;\n    }\n    fn value(\u0026self) -\u003e \u0026str {\n        \u0026self.value\n    }\n    fn value_address(\u0026self) -\u003e *mut String {\n        \u0026self.value as *const String as *mut String\n    }\n    fn value_address2(\u0026self) -\u003e *const u8 {\n        self.value.as_ptr()\n    }\n    fn ptr(\u0026self) -\u003e \u0026String {\n        unsafe { \u0026*self.ptr }\n    }\n    fn ptr_self_address(\u0026self) -\u003e \u0026*mut String {\n        \u0026self.ptr as \u0026*mut String\n    }\n    fn ptr_address(\u0026self) -\u003e *mut String {\n        self.ptr\n    }\n}\n\nfn test0() {\n    let a: i32 = 33;\n    println!(\"a_stack_address: {:p}\", \u0026a);\n    let a = Box::new(a);\n    println!(\"a_heap_address : {:p}\", a.as_ref());\n    let mut sr = SelfRef::new(\"111111\");\n    sr.init();\n    let mut sr2 = SelfRef::new(\"222222\");\n    sr2.init();\n    println!(\"sr : {:?} v: {:?} v: {:p} p: {:?} p_a: {:p} p_s_a: {:p} String_a: {:p}\", sr, sr.value(), sr.value_address(), sr.ptr(), sr.ptr_address(), sr.ptr_self_address(), sr.value_address2());\n    println!(\"sr2: {:?} v: {:?} v: {:p} p: {:?} p_a: {:p} p_s_a: {:p} String_a: {:p}\", sr2, sr2.value(), sr2.value_address(), sr2.ptr(), sr2.ptr_address(), sr2.ptr_self_address(), sr2.value_address2());\n    std::mem::swap(\u0026mut sr, \u0026mut sr2);\n    println!(\"after swap\");\n    println!(\"sr : {:?} v: {:?} v: {:p} p: {:?} p_a: {:p} p_s_a: {:p} String_a: {:p}\", sr, sr.value(), sr.value_address(), sr.ptr(), sr.ptr_address(), sr.ptr_self_address(), sr.value_address2());\n    println!(\"sr2: {:?} v: {:?} v: {:p} p: {:?} p_a: {:p} p_s_a: {:p} String_a: {:p}\", sr2, sr2.value(), sr2.value_address(), sr2.ptr(), sr2.ptr_address(), sr2.ptr_self_address(), sr2.value_address2());\n    \n}\n```\n然后输出变成了如下的内容：\n```bash\na_stack_address: 0x7ff7bfefdef4\na_heap_address : 0x1002040d0\nsr : SelfRef { value: \"111111\", ptr: 0x7ff7bfefdf90 } v: \"111111\" v: 0x7ff7bfefdf90 p: \"111111\" p_a: 0x7ff7bfefdf90 p_s_a: 0x7ff7bfefdfa8 String_a: 0x100204160\nsr2: SelfRef { value: \"222222\", ptr: 0x7ff7bfefdfb0 } v: \"222222\" v: 0x7ff7bfefdfb0 p: \"222222\" p_a: 0x7ff7bfefdfb0 p_s_a: 0x7ff7bfefdfc8 String_a: 0x100204170\nafter swap\nsr : SelfRef { value: \"222222\", ptr: 0x7ff7bfefdfb0 } v: \"222222\" v: 0x7ff7bfefdf90 p: \"111111\" p_a: 0x7ff7bfefdfb0 p_s_a: 0x7ff7bfefdfa8 String_a: 0x100204170\nsr2: SelfRef { value: \"111111\", ptr: 0x7ff7bfefdf90 } v: \"111111\" v: 0x7ff7bfefdfb0 p: \"222222\" p_a: 0x7ff7bfefdf90 p_s_a: 0x7ff7bfefdfc8 String_a: 0x100204160\n```\n由于打印的内容有点多，我用了简写。可以看到0x1开头的是heap的地址，0x7开头的是stack的地址。那么ptr指向的其实只是value在栈中的地址。而不是value的值在heap中String的地址。更可以看到其实变量本身的地址并没有改变，而改变的只是变量内存储的内容。\n现在我再还一张图，让这个结果显得更加的立体。\n先看交换之前的：\n![在这里插入图片描述](../images/93ad25c29b0be8d81ae0408465e34641.png)\n再来看交换之后的：\n![在这里插入图片描述](../images/f0acc9f7f224dc83c1f390ed849a742e.png)\n其实交换了半天，交换的只是变量内存储的内容。变量本身的内存地址没有任何改变，heap中的内存地址以及内存地址中的值也没有改变。"])</script><script>self.__next_f.push([1,"46:T2322,"])</script><script>self.__next_f.push([1,"var Component=(()=\u003e{var i=Object.create;var t=Object.defineProperty;var v=Object.getOwnPropertyDescriptor;var c=Object.getOwnPropertyNames;var g=Object.getPrototypeOf,m=Object.prototype.hasOwnProperty;var S=(n,e)=\u003e()=\u003e(e||n((e={exports:{}}).exports,e),e.exports),x=(n,e)=\u003e{for(var s in e)t(n,s,{get:e[s],enumerable:!0})},p=(n,e,s,a)=\u003e{if(e\u0026\u0026typeof e==\"object\"||typeof e==\"function\")for(let f of c(e))!m.call(n,f)\u0026\u0026f!==s\u0026\u0026t(n,f,{get:()=\u003ee[f],enumerable:!(a=v(e,f))||a.enumerable});return n};var b=(n,e,s)=\u003e(s=n!=null?i(g(n)):{},p(e||!n||!n.__esModule?t(s,\"default\",{value:n,enumerable:!0}):s,n)),o=n=\u003ep(t({},\"__esModule\",{value:!0}),n);var d=S((w,l)=\u003e{l.exports=_jsx_runtime});var h={};x(h,{default:()=\u003e_});var r=b(d());function u(n){let e={code:\"code\",h1:\"h1\",img:\"img\",p:\"p\",pre:\"pre\",strong:\"strong\",...n.components};return(0,r.jsxs)(r.Fragment,{children:[(0,r.jsx)(e.p,{children:\"\\u60F3\\u8981\\u7406\\u89E3pin\\u4E0Eunpin\\u4E3B\\u8981\\u8981\\u7406\\u89E3\\u6570\\u636E\\u518D\\u79FB\\u52A8\\u7684\\u65F6\\u5019\\u7684\\u4E0D\\u5B89\\u5168\\u3002\\u5C31\\u77E5\\u9053\\u4E86pin\\u7684\\u91CD\\u8981\\u6027\\u3002\"}),`\n`,(0,r.jsx)(e.h1,{children:\"\\u5148\\u770B\\u975E\\u5B89\\u5168\\u7684\\u6570\\u636E\\u79FB\\u52A8\"}),`\n`,(0,r.jsx)(e.pre,{children:(0,r.jsx)(e.code,{className:\"language-rust\",children:`#[derive(Debug)]\nstruct SelfRef {\n    value: String,\n    ptr: *mut String,\n}\n\nimpl SelfRef {\n    fn new(txt: \u0026str) -\u003e Self {\n        SelfRef {\n            value: String::from(txt),\n            ptr: std::ptr::null_mut(),\n        }\n    }\n    fn init(\u0026mut self) {\n        let v_ref = \u0026self.value;\n        self.ptr = v_ref as *const String as *mut String;\n    }\n    fn value(\u0026self) -\u003e \u0026str {\n 分析\n在这里，我们简单的一个任务使用一个闭包函数表示：\n```rust\n\tlet task = move || {\n        let a = 3;\n        let b = 2;\n        let c = 7;\n        for _ in 0..10 {\n            let r = a*b/c+a*b/c+a*b/c+a*b/c+a*b/c+a*b/c+a*b/c+a*b/c-a*b/c-a*b/c-a*b/c-a*b/c-a*b/c-a*b/c-a*b/c-a*b/c-a*b/c-a*b/c-a*b/c;\n        }\n    };\n```\n我们还需要在整个线程池的的执行过程中，注入一个测试对象当线程池执行完所有需要的任务的时候，需要一个打印性能测试的结果。\n这里我们使用一个struct:\n由于需要在线程内使用，所以FinishTest的部分变量使用了RefCell包裹，需要在县城内作变动。\n```rust\nstruct FinishTest {\n    count: RefCell\u003cu32\u003e,\n    max: u32,\n    start_time: RefCell\u003cSystemTime\u003e,\n}\nimpl FinishTest {\n    fn start(\u0026mut self) {\n        self.start_time = RefCell::new(SystemTime::now());\n    }\n    fn isFinish(\u0026self) -\u003e bool {\n        let l = *self.count.borrow_mut();\n        match l == self.max {\n            true =\u003e true,\n            false =\u003e false,\n        }\n    }\n    fn increase(\u0026self) {\n        *(self.count.borrow_mut()) += 1;\n        if self.isFinish() {\n            let elapsed = self.start_time.borrow_mut().elapsed().unwrap().as_millis();\n            println!(\"MPSC ThreadPool Finish cost time :{:?} ms\",elapsed);\n        }\n    }\n}\n```\n不同的实现方式mpsc是channel的方式由rust内部实现通道。所以线程池值需要包含一个sender就可以了。\n```rust\nstruct ThreadPool {\n    max_workers: i32,\n    workers: Vec\u003cWorker\u003e,\n    sender: mpsc::Sender\u003cMessage\u003e,\n}\n```\n但是Condvar的实现线程池的方式，我们需要一个队列来缓冲线程池，这里我们采用rust标准库中提供的VecDeque来实现一个任务队列的缓冲区。毕竟生产端的压力大于消费端的话，任务也需要由地方放。这个队列，我们采用从尾部插入，从头部弹出的方式使用。\n```rust\nstruct ThreadPool {\n    max_workers: i32,\n    workers: Vec\u003cWorker\u003e,\n    queue: Arc\u003c(Mutex\u003c(RefCell\u003cVecDeque\u003cMessage\u003e\u003e, FinishTest)\u003e, Condvar)\u003e,\n}\n```\n最后还需要对线程池实现一个Drop的trait。毕竟整个应用停止之前，我们需要保证线程池中每一个线程都安全的停止。这里我们需要发送一个停止的信号给每一个线程。\n这是mpsc的实现方式:\n```rust\nimpl Drop for ThreadPool {\n    fn drop(\u0026mut self) {\n        println!(\"drop----------------ThreadPool\");\n        for _ in 0..self.max_workers {\n            self.sender.send(Message::Over).unwrap();\n        }\n        for w in self.workers.iter_mut() {\n            if let Some(t) = w.t.take() {\n                t.join().unwrap();\n            }\n        }\n    }\n}\n```\n这是Condvar的方式来实现:\n因为Condvar的实现方案在给队列扔结束任务的时候，需要获得锁，然后扔任务，因为队列的对象，需要Mutex的保护才能保证原子操作。最后还需要注意的是：\u003cfont color=\"red\"\u003e这里必须手动解锁，否则线程阻塞在当前函数以后，当前线程永远无法释放锁，其他线程也就永远无法获得锁并继续执行\u003c/font\u003e\n```rust\nimpl Drop for ThreadPool {\n    fn drop(\u0026mut self) {\n        println!(\"drop----------------ThreadPool\");\n        let (lock, cond) = \u0026*self.queue;\n        let mutex_guard = lock.lock().unwrap();\n        let (queue, ft) = \u0026*mutex_guard;\n        \n        for _ in 0..self.max_workers {\n            queue.borrow_mut().push_back(Message::Over);\n            cond.notify_one();\n        }\n        drop(mutex_guard);\n        for w in self.workers.iter_mut() {\n            if let Some(t) = w.t.take() {\n                t.join().unwrap();\n            }\n        }\n    }\n}\n```\n## 测试数据\n我的CPU是i5-10210U。是4核8线程的。所以我们只测试四组数据，一个是4个线程，一个是8个线程，然后是16个线程，最后32个线程。同样的任务执行一百万次，次数不变。每一个测试数据都是执行三次取平均值。\n|         | 4      | 8      | 16     | 32     |\n| ------- | ------ | ------ | ------ | ------ |\n| mpsc    | 1201ms | 1243ms | 1255ms | 1238ms |\n| Condvar | 2607ms | 3665ms | 5122ms | 5336ms |\n\n## 性能与底层原理分析\n由于我的机器是ubuntu22.04。所以我就分析当前机器的底层源码了。\n下面要讲锁的底层原理了。由于我使用的是linux系统，所有有必要先讲一个futex。\nfutex 全称 fast user-space locking ，快速用户空间互斥锁。作为linux内核中一种基本的同步原语，它提供了非常快速的无竞争锁获取和释放，用于构建复杂的同步结构：互斥锁、条件变量、信号量等。由于 futex 的一些机制和使用过于复杂，glibc 没有为 futex 提供包装器，需要通过syscall使用这个锁。\n\n### mpsc交互方式底层执行过程分析\n#### 加锁\n首先系统调用最多的是Mutex的lock。我们来详细的看一下lock函数。也就是加锁流程。\n1. std::sync::Mutex下包裹的是一个sys::Mutex。在这个sys::Mutex内部由一个当前锁的状态futex，\n\t- 0代表未上锁\n\t- 1代表锁住了，当前锁上没有其他线程的等待\n\t- 2代表锁住了，当前锁上由其他线程的等待\n2. 那么在调用lock函数的时候，首先会通过cas的方式(对不起cas这个词又是从java底层带过来的)，也就是说它会通过原子的方式给变一个变量的值，这个值就是刚才所说的sys::Mutex的状态值futex。如果futex为0则把当前值修改为1，否则修改失败。---也就是说如果futex状态为1代表当前锁有一个线程持有，但是没有其他线程来竞争锁。\n3. 如果修改失败，证明当前锁已经有线程持有，因为futex值不等于0，所以cas操作失败。这个时候调用sys::Mutex.lock_contended函数。这个函数内首先进行了一个自旋的等待，自旋的次数为100次，在这100次的自旋转过程中，每一次都会判断锁的状态，如果锁已经被释放，则马上停止自旋。或者锁的futex状态变成2，证明已经有2个以上的线程抢锁了，所以没必要再自旋等待了，毕竟循环也会消耗cpu资源。但是自选的目的也是考虑到，当只有一个线程抢锁的时候，自旋以下，某则系统调用加锁会有一个用户态和内核态的切换消耗，这个消耗更大。\n4. 从自旋出来以后会再次通过cas的方式判断futex时候为0，如果是则修改为1并返回，否则继续。\n5. 然后进入一个无限循环，首选会通过原子的方式修改futex状态为2。\n6. 然后在这个循环内调用一个futex_wait的函数进行加锁。在这个函数内会通过一个syscall来调用系统底层的逻辑来等待。这里用的就是linux系统底层的futex互斥锁。\n```rust\n\t\t\t\t\tlibc::syscall(\n                        libc::SYS_futex,\n                        futex as *const AtomicU32,\n                        libc::FUTEX_WAIT_BITSET | libc::FUTEX_PRIVATE_FLAG,\n                        expected,\n                        timespec.as_ref().map_or(null(), |t| t as *const libc::timespec),\n                        null::\u003cu32\u003e(), // This argument is unused for FUTEX_WAIT_BITSET.\n                        !0u32,         // A full bitmask, to make it behave like a regular FUTEX_WAIT.\n                    )\n```\n#### 解锁\n我们再来看解锁流程。既然是Mutex锁，Mutex锁在离开作用于的是会会drop，那么在drop的时候就会解锁。解锁是在MutexGuard内部。\n7. sys::Mutex的unlock函数内首先会修改当前锁状态futex为0。\n8. 然后调用wake函数，唤醒等待线程。\n9. 这里调用的是futex_wake函数，函数内同样是一个syscall。\n```rust\npub fn futex_wake(futex: \u0026AtomicU32) -\u003e bool {\n    let ptr = futex as *const AtomicU32;\n    let op = libc::FUTEX_WAKE | libc::FUTEX_PRIVATE_FLAG;\n    unsafe { libc::syscall(libc::SYS_futex, ptr, op, 1) \u003e 0 }\n}\n```\n如果是唤醒所有则是\n```rust\npub fn futex_wake_all(futex: \u0026AtomicU32) {\n    let ptr = futex as *const AtomicU32;\n    let op = libc::FUTEX_WAKE | libc::FUTEX_PRIVATE_FLAG;\n    unsafe {\n        libc::syscall(libc::SYS_futex, ptr, op, i32::MAX);\n    }\n}\n```\n10. 被唤醒的线程会重新继续走函数sys::Mutex.lock_contended，在这个函数中的无限循环中，还是优先通过自旋，然后直接修改锁为\n但是这里是唤醒一个线程。至于锁是如何排队的需要看linux内核源码了，小编在这里只是讨论rust，还不是讨论futex锁的时候，所以只说到这里。\n\n#### 等待接收recv\nmpsc底层使用了一个状态机(Selected)代表的mpsc通道通信的状态，使用的是thread的park与unpark来作的线程交互。\n![请添加图片描述](../images/eadbef8201d191cb72dd1be7c008826b.png)\n这里底层使用的还是thread的park函数。再往下追就还是一个syscall的futex，进行等待，阻塞当前线程。\n\n#### 发送消息send\n![请添加图片描述](../images/7c958c74c4df79d7a04ef6187bb5d37a.png)\n这里会调用Vec的position函数。这个函数的闭包只要不返回false会一直循环到Vec集合内部的所有元素。这个Vec集合也是刚刚recv一端注册到这里的这个集合。那么在这里有三级判断，\n\n1. 判断当前线程不能等于注册到集合内的线程(说白了就是发送者的线程不能等于接收者的线程)。\n2. 判断集合当前元素的线程的Selected状态是不是Waiting状态，如果是则修改为Operation状态。\n3. 直接调用集合当前元素的线程的unpark函数唤醒当前线程。\n这个unpark函数底层，调用的还是syscall的futex的唤醒。\n### Condvar交互方式底层执行过程分析\n#### wait\n对于这种多线程交互方式，加锁与解锁就不用分析了，因为刚才已经分析过了。我们接下来直接分析一下Condvar的。\n它的wait比较复杂，我们详细的来看一下。\n![请添加图片描述](../images/7353015423dfb4486d9fbee3d206efe5.png)\n\n1. 优先拿到了当前锁的Mutex对象，然后调用的我们现在看到的这个wait函数。\n2. 在这个函数里边，先解锁当前线程，然后开始等待阻塞当前线程。\u003cfont color=\"red\"\u003e(注意：这里也是为了释放当前锁的持有状态，这里更不用说了还是一个syscall，前面的mpsc的recv阻塞的时候可没有释放锁。)\u003c/font\u003e\n3. 当然不用说了锁的状态还是一个syscall的futex，进行等待，阻塞当前线程。\n4. 当然，当然更不用说解锁以后是一个Mutex的lock加锁，这个加锁过程我们刚才已经说过了。\u003cfont color=\"red\"\u003e(在说白一点，这里等待过后与加锁之前也很有可能被其他线程加锁成功，当前线程同样也会在这个lock的时候阻塞住)\u003c/font\u003e\n\n#### notify\n![请添加图片描述](../images/821a49f4430bed73f3088c1389d8e0c9.png)\n第一：先说这个futex.fetch_add。让自己本身的这个futex自增1。保证下次唤醒的不再是当前的这个线程。\n第二：还是一个syscall的futex唤醒。\n\n### 系统分析比较\n- mpsc: 由于mpsc的recv阻塞不会释放Mutex锁，所以其他所有线程都会阻塞到其他线程的lock处，唤醒以后其他线程可以通过获得锁，继续recv阻塞持续执行。说白了整个消费循环体总体算上是三次syscall。\n- Condvar: 这里mpsc的交互方式复杂在于Condvar的wait。它多了一个解锁和再加锁的过程。相比较之下整个消费循环体是五次syscall。\n\n## 系统分析\n第一：除系统调用以外的代码逻辑几乎可以忽略不计，毕竟没有过多的递归调用，也没有过多的循环执行。\n第二：通过刚才的*系统分析比较*再加上刚才的测试数据不难分析出，当执行线程数量等于当前CPU数量的时候消耗较小这个时候Condvar的交互方式比mpsc的交互方式多出来的就是syscall的系统调用开销，毕竟用户态和内核态的交互消耗很大，这个地球人都知道。\n第三：由于执行线程个数的增加，执行的线程数量逐渐会比当前系统CPU数量多，增加了CPU彼此之间的上下文切换的消耗，线程比当前系统的CPU核心数月多上下文切换的耗时越大。"])</script><script>self.__next_f.push([1,"4b:T6f6b,"])</script><script>self.__next_f.push([1,"var Component=(()=\u003e{var u=Object.create;var t=Object.defineProperty;var p=Object.getOwnPropertyDescriptor;var f=Object.getOwnPropertyNames;var m=Object.getPrototypeOf,x=Object.prototype.hasOwnProperty;var b=(l,n)=\u003e()=\u003e(n||l((n={exports:{}}).exports,n),n.exports),_=(  Abc {\n    name: Cell\u003c*const u32\u003e,\n}\n\n// unsafe impl Sync for Abc {} //未实现Sync trait的，如果尝试在多个线程中共享这个变量，则会报错。\nstatic CURRENT_ABC: Abc = Abc { name: Cell::new(std::ptr::null()), };\npub fn test() {\n    CURRENT_ABC.name.replace(Box::into_raw(Box::new(24)));\n    struct Ref\u003cT: 'static\u003e {\n        _ref: \u0026'static T,\n    }\n    for _ in 0..3 {\n        let _ref = Ref { _ref: \u0026CURRENT_ABC, };\n        std::thread::spawn(move || {\n            println!(\"{:?}\", _ref._ref);\n        });\n    }\n}\n```\n## 例子五-Arc包裹的变量\n由于这里使用Arc包裹了变量，并且出现了move语义与变量同时出现在多个线程的情况。所以Send与Sync都要实现。否则会报错。\n```rust\n#[derive(Debug)]\nstruct Data {\n    name: *const u8,\n}\n\nunsafe impl Send for Data {}\nunsafe impl Sync for Data {}\n\npub fn test() {\n    let data = Data { name: Box::into_raw(Box::new(11)) };\n    let data_arc = Arc::new(data);\n    \n    for _ in 0..3 {\n        let data_clone = data_arc.clone();\n        let join = std::thread::spawn(move || {\n            println!(\"\u003e{:#?}\", data_clone);\n        });\n        let _ = join.join();\n    }\n}\n```"])</script><script>self.__next_f.push([1,"4d:T2018,"])</script><script>self.__next_f.push([1,"var Component=(()=\u003e{var u=Object.create;var a=Object.defineProperty;var m=Object.getOwnPropertyDescriptor;var p=Object.getOwnPropertyNames;var f=Object.getPrototypeOf,b=Object.prototype.hasOwnProperty;var _=(t,n)=\u003e()=\u003e(n||t((n={exports:{}}).exports,n),n.exports),S=(t,n)=\u003e{for(var r in n)a(t,r,{get:n[r],enumerable:!0})},l=(t,n,r,d)=\u003e{if(n\u0026\u0026typeof n==\"object\"||typeof n==\"function\")for(let c of p(n))!b.call(t,c)\u0026\u0026c!==r\u0026\u0026a(t,c,{get:()=\u003en[c],enumerable:!(d=m(n,c))||d.enumerable});return t};var g=(t,n,r)=\u003e(r=t!=null?u(f(t)):{},l(n||!t||!t.__esModule?a(r,\"default\",{value:t,enumerable:!0}):r,t)),A=t=\u003el(a({},\"__esModule\",{value:!0}),t);var o=_((v,i)=\u003e{i.exports=_jsx_runtime});var w={};S(w,{default:()=\u003eh});var e=g(o());functio 性，不可变所有权的借用是**只读**属性，当借用后，修改可变变量的值，之前不可变所有权的借用将失效，如果``***``行的存在，这``a=11``这一方将会报错。否则不会报任何错误。如果想在a值被修改后，继续使用不可遍所有权，必须续租，也就是重新借用。\n\n```rust\n  \tlet mut a = 5;\n      let b = \u0026a;\n      println!(\"{}\", a); \n      println!(\"{}\", b); \n      a = 11;                //会报错cannot borrow `a` as immutable because it is also borrowed as mutable\n      println!(\"{}\", a); \n  \t//let b = \u0026a;\t\t   //续租\n      println!(\"{}\", b);     //\u003c\u003c***\n```\n\n- 对于可变变量的可变所有权借用，所有权会被完全借走。如下代码会报错，因为所有权已经被完全借走，如果继续使用a则会报错。当b销毁的时候才可以归还所有权，这里可以显示的使用drop函数，但是一旦b销毁，后面也不可以继续使用b这个变量了。\n  这个错误的发生也是有一个先决条件的，也就是当b销毁前，在决定使用a之后还在继续使用b，这个时候，编译器会认为b的一个都在借用a的全部所有权，这个时候a不可以继续使用。所以会报错。\n\n```rust\n  \tlet mut rr = 0;\n      let mut a = 5;\n      let b = \u0026mut a;\n      //drop(b);\n      rr = rr + a; //会报错cannot borrow `a` as immutable because it is also borrowed as mutable\n      rr = rr + *b;\n```\n\n- 对于可变变量的可变所有权借用，问题二。单可变所有权的变量的所有权被完全借走以后，不能以任何方式使用这个变量。\n\n```rust\n  \tlet mut a = 5;\n      let b = \u0026mut a;\n      println!(\"{}\", b);\n      a = 10;                 //cannot assign to `a` because it is borrowed\n      println!(\"{}\", b);\n      println!(\"{}\", a);\n```\n\n- 对于可变变量的可变所有权借用。问题三。毕竟已经是可变所有权的借用了，所以肯定允许修改变量的值所以说，是允许通过变量b来修改。但是不允许改变可变所有权变量的指向。除非可变所有权变量，也就是b，是mut的。这个时候是允许修改的。\n\n```rust\n  \tlet mut s1 = \"hello\".to_string();\n      let mut s2 = \"world\".to_string();\n      //let b = \u0026mut s1; //\u003c\u003c 变量b是否为mut的\n  \tlet mut b = \u0026mut s1; //\u003c\u003c 变量b是否为mut的\n      *b = \"woleigequ\".to_string();\n      b = \u0026mut s2;\t//cannot assign twice to immutable variable `b`\n```\n\n  \n\n- 最后一个对于函数的传递，不管是可变所有权的借用，还是非可变所有权的借用，在函数结束的时候都会销毁，所以不用考虑细节问题。\n\n\u003cfont color=\"red\"\u003e举了这么多借用的例子，可以看得出借用这块还有几条规则： 1. 所有权分读所有权，和写所有权。2. 如果精通java多线程的小伙伴会感受到所有权有点类似读写锁，也就是ReentrantReadWriteLock，同一时间只允许一个写，但是同一时间可以拥有不限额数的读。\u003c/font\u003e"])</script><script>self.__next_f.push([1,"4f:T3375,"])</script><script>self.__next_f.push([1,"var Component=(()=\u0 026r), Rc::strong_count(\u0026r1), Rc::strong_count(\u0026r2));\n    println!(\"{},{},{}\", Rc::weak_count(\u0026r), Rc::weak_count(\u0026r1), Rc::weak_count(\u0026r2));\n\n    println!(\"r1:{} r2:{} r3:{:?} r4:{:?}\", r1, r2, r3.upgrade().unwrap(), r4.upgrade().unwrap());\n\n    println!(\"打印计数器\");\n    println!(\"{},{},{}\", Rc::strong_count(\u0026r), Rc::strong_count(\u0026r1), Rc::strong_count(\u0026r2));\n    println!(\"{},{},{}\", Rc::weak_count(\u0026r), Rc::weak_count(\u0026r1), Rc::weak_count(\u0026r2));\n```\n## Cell\n- 最简单的可变智能指针，它通过set和get两个函数可以对外部已经确定的不可变的变量，修改其内部的值。\n```rust\n#[derive(Debug)]\nstruct SomeStruct {\n    r: i32,\n    s: Cell\u003ci32\u003e\n}\nfn main(){\n\tlet ms = SomeStruct {\n        r: 11,\n        s: Cell::new(5),\n    };\n\n    // ms.r = 12;//无法编译通过\n    println!(\"{:?}\", ms);\n    ms.s.set(100);\n    println!(\"{:?}\", ms);\n}\n```\n## Rc-Weak\n- 类似Rc，但不持有所有权，仅仅保存指向数据的弱引用。\n- 需要使用upgrade函数升级到Rc才能获得引用指向的数据。\n- 不保证引用关系的存在，不阻止Drop，如果不存在upgrade函数则返回一个none。\n```rust\n\tlet r = Rc::new(5);\n    let w_r = Rc::downgrade(\u0026r);\n\n    if let Some(r1) = w_r.upgrade() {\n        println!(\"值还存在\");\n    }\n\n    drop(r);\n\n    if let None = w_r.upgrade() {\n        println!(\"值不存在了\");\n    }\n```\n## RefCell\n- 在运行时确定借用数量，如果不符合借用规则，则报错。\n- 可在外部已经确定变量不可变的情况下修改变量内部的值。\n- 与Cell不同的是它多了内部记录借用数量，并且保证运行期借用规则。\n```rust\nstruct A {\n    v: Vec\u003cString\u003e\n}\nfn main(){\n\tlet a = A{v:vec![]};\n    a.v.push(\"s\".to_string());\n}\n```\n这种情况下会报编译错误。它让你增加mut去声明变量a。\n```bash\nerror[E0596]: cannot borrow `a.v` as mutable, as `a` is not declared as mutable\n   --\u003e src/test_senior/test_smart_pointer.rs:119:5\n    |\n119 |     a.v.push(\"s\".to_string());\n    |     ^^^^^^^^^^^^^^^^^^^^^^^^^ cannot borrow as mutable\n    |\nhelp: consider changing this to be mutable\n    |\n118 |     let mut a = A{v:vec![]};\n    |         +++\n\nerror: aborting due to previous error\n```\n但是可以通过RefCell改变这种情况。\n```rust\nstruct A {\n    v: RefCell\u003cVec\u003cString\u003e\u003e\n}\nfn main(){\n\tlet a = A{ v: RefCell::new(vec![])};\n    a.v.borrow_mut().push(\"h\".to_string());\n}\n```\n## Rc + RefCell测试\n```rust\n#[derive(Debug)]\nstruct RcRefCell {\n    i: i32,\n    rr: Rc\u003cRefCell\u003ci32\u003e\u003e,\n}\nfn main() {\n\tlet value = Rc::new(RefCell::new(5));\n\n    let rrc1 = RcRefCell{ i: 11, rr: Rc::clone(\u0026value) };\n    let rrc2 = RcRefCell{ i: 22, rr: Rc::clone(\u0026value) };\n\n    //与如下等价\n    // let mut l = (*value).borrow_mut();\n    // *l = 20;\n    // drop(l);\n\n    //单行使用方式\n    *(*value).borrow_mut() = 10;\n\n    println!(\"value:{:?}\", *value);\n    println!(\"rcc1:{:?}\", rrc1);\n    println!(\"rcc2:{:?}\", rrc2);\n}\n```\n## OnceCell\n- 这个智能指针比较简单，只可以设置一次，其余的设置无效。\n- set函数可以调用多次，但是只有第一次生效。\n- get_or_init函数和get_or_try_init函数的意思是获得智能指针内的值，如果有的直接获得，如果没有就设置一个。\n```rust\n\tlet a = OnceCell::new();\n    a.set(33);\n    println!(\"a:{:?}\", a);\n    a.set(44);\n    println!(\"a:{:?}\", a);\n\n    let b = OnceCell::new();\n    let c = OnceCell::new();\n    let b1 = b.get_or_init(|| {\n        66\n    });\n    let a1 = a.get_or_init(|| {\n        77\n    });\n    let c1 = c.get_or_try_init(|| -\u003e Result\u003ci32, ()\u003e {\n        Ok(88)\n    });\n\n    println!(\"a1:{:?}\", a1);\n    println!(\"b1:{:?}\", b1);\n    println!(\"c1:{:?}\", c1);\n```\n## LazyCell\n- 这个智能指针会晚一些初始化，它会在使用之前初始化，但是只会初始化一次。而不是变量创建的时候初始化。\n```rust\n\tlet a = LazyCell::new(|| {\n        println!(\"begin init lazycell\");\n        \"helloworld\".to_string()\n    });\n    println!(\"after define a\");\n    println!(\"a:{:?}\", *a);\n    println!(\"a:{:?}\", *a);\n```\n## Arc\n- 是Rc的多线程版本。\n- 可以跨线程传递，用于跨线程共享一个对象。\n- Arc持有的变量，堆可变性没有要求。\n- 一旦最后一个拥有者小时，资源会被回收。\n```rust\nlet arc = Arc::new(Mutex::new(0));\n    let mut threads = vec![];\n    for idx in 0..10 {\n        let share_obj = arc.clone();\n        let mut name = \"thread\".to_string();\n        name.push_str(idx.to_string().as_str());\n        let t = thread::Builder::new()\n        .name(name).spawn( move || {\n            let s = thread::current().name().unwrap().to_string();\n            println!(\"thread:{}准备获得锁\", s);\n            let mut count = share_obj.lock().unwrap();\n            println!(\"thread:{}已经获得锁\", s);\n            \n            thread::sleep(Duration::from_millis(1000 * 1));\n            *count += 1;\n        }).unwrap();\n        threads.push(t);\n    }\n    for t in threads {\n        t.join();\n    }\n    let a = *arc.lock().unwrap();\n    println!(\"{}\", a);\n```\n## Arc-Weak\n- Rc-Weak的多线程版本。\n- 在std::sync::Weak。\n- 其余与Rc-Weak一致。\n## Mutex\n- 能够保证同一时刻只有一个线程可以访问锁。\n- 访问数据前，需要先获得锁。\n- 处理完Mutex保护的数据后，必须立刻解锁，保证其他线程可以在第一时间获得锁。\n- 不像是java中有unlock来释放锁。在rust中可以通过drop释放Mutex的保护数据，来在作用域中释放Mutex。\n```rust\n\tlet counter = Arc::new(Mutex::new(0));\n    let mut handles = vec![];\n    for idx in 0..10 {\n        let counter = counter.clone();\n        let mut name = \"thread\".to_string();\n        name.push_str(idx.to_string().as_str());\n        let handle = thread::Builder::new()\n        .name(name).spawn(move || {\n            let s = thread::current().name().unwrap().to_string();\n            println!(\"thread:{}--准备获得锁\", s);\n            let mut num = counter.lock().unwrap();\n            println!(\"thread:{}++已经获得锁\", s);\n            thread::sleep(Duration::from_millis(1000 * 1));\n            *num += 1;\n            println!(\"thread:{}++准备释放锁\", s);\n            drop(num);\n            thread::sleep(Duration::from_millis(100));\n            println!(\"thread:{}--已经释放锁\", s);\n        }).unwrap();\n        handles.push(handle);\n    }\n    for handle in handles {\n        handle.join().unwrap();\n    }\n    println!(\"Result: {}\", *counter.lock().unwrap());\n```\n## RwLock\n- 成为read-write锁，以下read简称r，write简称w。\n- 站在Java的角度与ReentrantReadWriteLock类似，读贡献，写互斥。\n- 大家从如下的打印数据也可以看出来，r可以共享数据，但是w互斥。但是r与w彼此之间也是互斥的。\n```rust\nstruct GuardMemory {\n    index: i32,\n}\nfn main() {\n\tlet arc = Arc::new(RwLock::new( // 定义元组（类型标注可省略）\n    let person: (\u0026str, i32, bool) = (\"Alice\", 25, true);\n    \n    // 方式1：点号+索引访问（索引从0开始）\n    println!(\"姓名：{}\", person.0); // 输出 姓名：Alice\n    println!(\"年龄：{}\", person.1); // 输出 年龄：25\n    \n    // 方式2：解构赋值（推荐，更简洁）\n    let (name, age, is_student) = person;\n    println!(\"{}，{}岁，是否学生：{}\", name, age, is_student);\n    \n    // 空元组（单元值）：表示「无返回值」，函数默认返回 ()\n    let unit = ();\n    println!(\"空元组：{:?}\", unit); // 输出 空元组：()\n}\n```\n\n#### （2）数组（Array）\n\n- 核心概念：**固定长度**、相同类型值的集合，存储在栈上（区别于动态集合 `Vec`），长度不可修改\n- 语法：`[类型; 长度]` 或 `[值1, 值2, ...]`，访问用「方括号 + 索引」\n- 示例：\n\n```rust\nfn main() {\n    // 方式1：显式长度+重复值（创建5个0的i32数组）\n    let arr1: [i32; 5] = [0; 5];\n    println!(\"arr1: {:?}\", arr1); // 输出 arr1: [0, 0, 0, 0, 0]\n    \n    // 方式2：直接罗列值（自动推导类型和长度）\n    let arr2 = [10, 20, 30, 40];\n    println!(\"arr2[2] = {}\", arr2[2]); // 输出 arr2[2] = 30\n    \n    // 数组长度：用 std::mem::size_of_val 或 .len()\n    println!(\"arr2长度：{}\", arr2.len()); // 输出 4\n    println!(\"arr2占用字节：{}\", std::mem::size_of_val(\u0026arr2)); // 4*4=16字节（i32占4字节）\n    \n    // 错误：数组长度固定，不能新增元素 → error[E0596]: cannot borrow `arr2` as mutable\n    // arr2.push(50);\n}\n```\n\n### 关键注意事项\n\n- 整数溢出：调试模式（默认）下溢出会 panic，发布模式（`--release`）下会环绕（不推荐依赖），建议用 `checked_add` 等安全方法\n- 字符与字符串：`char` 是单个 Unicode 字符，`\u0026str`/`String` 是字符序列（后续详细讲）\n- 数组 vs 元组：数组是「同类型 + 固定长度」，元组是「异类型 + 固定长度」\n\n## 二、Rust 流程控制\n\nRust 流程控制分为「条件判断」和「循环」，语法简洁且安全（无空指针风险）。\n\n### 1. 条件判断（`if-else`）\n\n- 核心规则：条件表达式必须是 `bool` 类型（**不可隐式转换**，区别于 C/Python）\n- 语法：支持多分支 `if-else if-else`，且 `if` 可作为表达式返回值（类似三元运算符）\n- 示例：\n\n```rust\nfn main() {\n    let score = 85;\n    \n    // 基础多分支\n    if score \u003e= 90 {\n        println!(\"优秀\");\n    } else if score \u003e= 80 {\n        println!(\"良好\");\n    } else if score \u003e= 60 {\n        println!(\"及格\");\n    } else {\n        println!(\"不及格\");\n    }\n    \n    // if 作为表达式（返回值）：适合简单条件赋值\n    let grade = if score \u003e= 80 { \"A\" } else if score \u003e= 60 { \"B\" } else { \"C\" };\n    println!(\"等级：{}\", grade); // 输出 等级：A\n}\n```\n\n### 2. 循环（3 种）\n\n#### （1）`loop`：无限循环（手动终止）\n\n- 核心用途：不确定循环次数时使用，用 `break` 终止（可带返回值）\n- 示例：\n\n```rust\nfn main() {\n    let mut count = 0;\n    \n    // 无限循环，break 返回值\n    let result = loop {\n        count += 1;\n        if count == 5 {\n            break count * 2; // 终止循环并返回 10\n        }\n    };\n    \n    println!(\"result: {}\", result); // 输出 result: 10\n}\n```\n\n#### （2）`while`：条件循环\n\n- 核心用途：确定循环条件时使用，条件为 `true` 时执行\n- 示例：\n\n```rust\nfn main() {\n    let mut num = 3;\n    \n    while num \u003e 0 {\n        println!(\"num: {}\", num); // 输出 3、2、1\n        num -= 1;\n    }\n}\n```\n\n#### （3）`for`：迭代循环（最常用）\n\n- 核心用途：遍历迭代器（数组、切片、`Vec`、`Range` 等），安全且高效（无越界风险）\n- 语法：`for 变量 in 迭代器`，常用 `0..n`（左闭右开区间）生成迭代器\n- 示例：\n\n```rust\nfn main() {\n    // 遍历 Range（0..5 → 0,1,2,3,4）\n    for i in 0..5 {\n        println!(\"i: {}\", i);\n    }\n    \n    // 遍历数组（推荐：无需索引，避免越界）\n    let arr = [10, 20, 30];\n    for val in arr {\n        println!(\"值：{}\", val); // 输出 10、20、30\n    }\n    \n    // 遍历数组并获取索引：用 .iter().enumerate()\n    for (index, val) in arr.iter().enumerate() {\n        println!(\"索引{}：{}\", index, val); // 输出 索引0：10、索引1：20...\n    }\n    \n    // 反向遍历：用 .rev()\n    for i in (0..5).rev() {\n        println!(\"反向i: {}\", i); // 输出 4、3、2、1、0\n    }\n}\n```\n\n### 关键注意事项\n\n- `if` 条件必须是 `bool`：不能写 `if 1 { ... }`（C 语言允许），需显式判断 `if 1 != 0 { ... }`\n- `for` 循环优先于 `while`：遍历集合时，`for` 无需手动管理索引，避免越界（Rust 不允许数组越界访问，编译时检查）\n- `loop` 的返回值：只有 `loop` 支持 `break 带返回值`，`while`/`for` 不支持\n\n## 三、Rust 函数\n\n函数是 Rust 代码组织的核心，语法严谨，支持参数、返回值、递归、嵌套定义。\n\n### 1. 核心概念\n\n- 定义关键字：`fn`\n- 语法结构：`fn 函数名(参数列表) -\u003e 返回值类型 { 函数体 }`\n- 关键规则：\n  - 参数必须显式标注类型（编译器不推导参数类型）\n  - 返回值有两种方式：① 函数体最后一行表达式（无分号）；② `return` 语句（适合提前返回）\n  - 无返回值时，返回类型可省略（默认返回空元组 `()`）\n\n### 2. 代码示例\n\n```rust\n// 1. 无参数、无返回值函数\nfn greet() {\n    println!(\"Hello, Rust!\");\n}\n\n// 2. 有参数、有返回值函数（返回表达式结果）\nfn add(a: i32, b: i32) -\u003e i32 {\n    a + b // 无分号 → 表达式作为返回值（推荐）\n}\n\n// 3. 多返回值函数（用元组包装）\nfn split_num(num: i32) -\u003e (i32, i32) {\n    let even = num % 2 == 0;\n    if even {\n        return (num / 2, 0); // 提前返回（带分号）\n    }\n    (num / 2, 1) // 最后一行表达式返回\n}\n\n// 4. 嵌套函数（内部函数，仅外层可见）\nfn outer() {\n    fn inner() {\n        println!(\"我是嵌套函数\");\n    }\n    inner(); // 只能在 outer 内部调用\n}\n\n// 5. 递归函数（计算阶乘）\nfn factorial(n: u32) -\u003e u32 {\n    if n == 0 {\n        1 // 基线条件\n    } else {\n        n * factorial(n - 1) // 递归调用\n    }\n}\n\nfn main() {\n    greet(); // 输出 Hello, Rust!\n    \n    let sum = add(3, 5);\n    println!(\"3+5={}\", sum); // 输出 8\n    \n    let (quotient, remainder) = split_num(7);\n    println!(\"7拆分：商={}, 余数={}\", quotient, remainder); // 输出 3,1\n    \n    outer(); // 输出 我是嵌套函数\n    \n    let fact = factorial(5);\n    println!(\"5的阶乘：{}\", fact); // 输出 120\n}\n```\n\n### 关键注意事项\n\n- 参数类型必须标注：`fn add(a, b) -\u003e i32 { ... }` 会编译错误，需写 `a: i32, b: i32`\n- 返回值表达式无分号：如果写 `a + b;`，函数会返回 `()`（空元组），而非 `i32`\n- 嵌套函数作用域：内部函数只能在外部函数体内调用，不能在外部访问\n- 递归必须标注返回类型：编译器无法推导递归函数的返回类型，必须显式标注\n\n## 四、Rust 所有权（Ownership）\n\n**所有权是 Rust 最核心的特性**，用于管理内存（无需 GC 和手动释放），核心目标是「避免空指针、悬垂引用、数据竞争」。\n\n### 1. 核心规则（必须牢记）\n\n1. 每个值在 Rust 中都有一个「所有者」（变量）\n2. 同一时间只能有一个所有者（避免数据竞争）\n3. 当所有者离开作用域（`}` 结束），值会被自动销毁（内存释放）\n\n### 2. 核心概念解析\n\n#### （1）作用域与自动销毁\n\n```rust\nfn main() {\n    {\n        let s = String::from(\"hello\"); // s 进入作用域（所有者是 s）\n        println!(\"{}\", s); // 可用\n    }\n    // s 离开作用域 → 自动调用 drop 函数释放内存（无需手动 free）\n    // println!(\"{}\", s); // 错误：s 已被销毁，无法访问\n}\n```\n\n#### （2）移动（Move）：所有权转移\n\n- 核心：当把一个非 Copy 类型（如 `String`、`Vec`）赋值给另一个变量时，**原变量会失去所有权（变为无效）**，避免双重释放\n- 示例：\n\n```rust\nfn main() {\n    let s1 = String::from(\"hello\");\n    let s2 = s1; // 所有权从 s1 转移到 s2（s1 失效）\n    \n    println!(\"{}\", s2); // 正确：s2 是所有者\n    // println!(\"{}\", s1); // 错误：s1 已失去所有权（value borrowed here after move）\n}\n```\n\n#### （3）克隆（Clone）：深拷贝（手动复制数据）\n\n- 核心：如果需要保留原变量的所有权，且复制数据（而非转移所有权），用 `clone()` 方法（深拷贝，堆上数据复制）\n- 示例：\n\n```rust\nfn main() {\n    let s1 = String::from(\"hello\");\n    let s2 = s1.clone(); // 深拷贝：s1 和 s2 各自拥有独立数据\n    \n    println!(\"s1: {}, s2: {}\", s1, s2); // 正确：两者都有效\n}\n```\n\n#### （4）Copy 特性：浅拷贝（无需转移所有权）\n\n- 核心：标量类型（`i32`、`bool`、`char` 等）和元组（仅包含 Copy 类型）默认实现 `Copy` 特性，赋值时会「浅拷贝」，原变量仍有效\n- 示例：\n\n```rust\nfn main() {\n    let x: i32 = 5;\n    let y = x; // i32 是 Copy 类型，浅拷贝（栈上数据复制）\n    \n    println!(\"x: {}, y: {}\", x, y); // 正确：x 和 y 都有效\n    \n    // 元组（包含 Copy 类型）也支持 Copy\n    let t1 = (10, true);\n    let t2 = t1;\n    println!(\"t1: {:?}, t2: {:?}\", t1, t2); // 正确\n}\n```\n\n### 3. 所有权与函数传参 / 返回值\n\n- 函数传参：非 Copy 类型会转移所有权到函数参数，函数执行完后参数离开作用域，值被销毁（除非返回）\n- 示例：\n\n```rust\nfn take_ownership(s: String) {\n    println!(\"函数内：{}\", s);\n} // s 离开作用域 → 数据被销毁\n\nfn return_ownership(s: String) -\u003e String {\n    s // 返回 s，所有权转移给调用者\n}\n\nfn main() {\n    let s1 = String::from(\"hello\");\n    take_ownership(s1); // s1 所有权转移到函数 → s1 失效\n    // println!(\"{}\", s1); // 错误\n    \n    let s2 = String::from(\"world\");\n    let s3 = return_ownership(s2); // s2 所有权转移到函数，再转移到 s3\n    println!(\"s3: {}\", s3); // 正确\n}\n```\n\n### 关键注意事项\n\n- 区分 Move/Copy/Clone：\n  - Move：非 Copy 类型赋值 / 传参，原变量失效（默认行为）\n  - Copy：标量类型，浅拷贝，原变量有效（自动实现）\n  - Clone：手动深拷贝，原变量有效（需显式调用 `clone()`）\n- 堆 vs 栈：Copy 类型通常存储在栈上（快速复制），非 Copy 类型（`String`、`Vec`）存储在堆上（深拷贝成本高，默认 Move）\n- 避免不必要的 Clone：优先用引用（后续讲）代替 Clone，提升性能\n\n## 五、Rust 引用（Reference）\n\n引用是「指向值的指针」，但**不拥有值的所有权**，核心用途是「在不转移所有权的情况下访问值」，避免频繁 Clone。\n\n### 1. 核心概念\n\n- 语法：`\u0026T`（不可变引用）、`\u0026mut T`（可变引用）\n- 关键规则（ Rust 安全核心）：\n  1. 同一时间，一个值**要么**有多个不可变引用（`\u0026T`），**要么**有一个可变引用（`\u0026mut T`）（避免数据竞争）\n  2. 引用必须始终有效（不能指向已销毁的值，避免悬垂引用）\n\n### 2. 不可变引用（`\u0026T`）\n\n- 核心：只读访问值，不允许修改，支持多个引用共存\n- 示例：\n\n```rust\nfn print_string(s: \u0026String) {\n    println!(\"{}\", s); // 只读访问，不获取所有权\n}\n\nfn main() {\n    let s = String::from(\"hello\");\n    let r1 = \u0026s; // 不可变引用1\n    let r2 = \u0026s; // 不可变引用2（允许共存）\n    \n    print_string(r1); // 传引用，s 仍拥有所有权\n    print_string(r2);\n    \n    println!(\"s: {}\", s); // 正确：s 未失去所有权\n}\n```\n\n### 3. 可变引用（`\u0026mut T`）\n\n- 核心：可读写访问值，同一时间只能有一个可变引用（且不能有不可变引用）\n- 示例：\n\n```rust\nfn modify_string(s: \u0026mut String) {\n    s.push_str(\", world\"); // 可变引用允许修改\n}\n\nfn main() {\n    let mut s = String::from(\"hello\"); // 变量必须是 mut（可变）才能创建可变引用\n    let r1 = \u0026mut s; // 可变引用1\n    modify_string(r1);\n    println!(\"r1: {}\", r1); // 输出 hello, world\n    \n    // 错误：同一时间不能有多个可变引用 → error[E0499]: cannot borrow `s` as mutable more than once at a time\n    // let r2 = \u0026mut s;\n    // println!(\"r2: {}\", r2);\n    \n    // 引用作用域结束后，可创建新的可变引用\n    drop(r1); // 手动结束 r1 的作用域（可选，编译器也会自动回收）\n    let r2 = \u0026mut s;\n    println!(\"r2: {}\", r2); // 正确\n}\n```\n\n### 4. 悬垂引用（Dangling Reference）\n\n- 核心：引用指向的 值已被销毁，但引用仍存在 → Rust 编译时禁止这种情况\n- 错误示例（编译不通过）：\n\n```rust\nfn dangling() -\u003e \u0026String {\n    let s = String::from(\"dangling\");\n    \u0026s // 错误：s 离开函数作用域会被销毁，返回的引用会悬垂\n}\n// 编译器错误：error[E0106]: missing lifetime specifier（后续生命周期会讲，核心是禁止悬垂）\n```\n\n### 关键注意事项\n\n- 引用必须与所有者生命周期一致：不能返回作用域内临时变量的引用\n- 可变引用的限制：可变引用存在时，不能有任何引用（包括不可变），反之亦然\n- `mut` 关键字位置：变量本身可变（`let mut s`）是创建可变引用的前提\n- 引用不影响所有权：函数接收引用时，不会获取所有权，值的生命周期由原所有者决定\n\n## 六、Rust 数组与切片\n\n数组（`Array`）是固定长度的栈上集合，切片（`Slice`）是数组 /`Vec` 的「动态视图」（不拥有数据），是 Rust 中处理集合的常用工具。\n\n### 1. 数组（Array）：补充进阶用法\n\n前文已讲基础，这里补充「数组作为函数参数」和「数组与切片的转换」：\n\n```rust\n// 数组作为函数参数（必须标注长度和类型，如 [i32; 3]）\nfn print_array(arr: [i32; 3]) {\n    println!(\"数组：{:?}\", arr);\n}\n\nfn main() {\n    let arr = [10, 20, 30];\n    print_array(arr); // 数组是 Copy 类型，传参时浅拷贝（栈上数据）\n    \n    // 数组转切片（\u0026arr → \u0026[i32]）\n    let slice = \u0026arr[1..3]; // 左闭右开区间，取索引1和2 → [20, 30]\n    println!(\"切片：{:?}\", slice); // 输出 [20, 30]\n}\n```\n\n### 2. 切片（Slice）：核心特性\n\n#### （1）核心概念\n\n- 语法：`\u0026[T]`（不可变切片）、`\u0026mut [T]`（可变切片）\n- 本质：包含「数据指针」和「长度」的结构体（`struct Slice\u003c'a, T\u003e { ptr: *const T, len: usize }`）\n- 特点：\n  - 不拥有数据，数据所有权属于原数组 /`Vec`\n  - 动态长度（编译时无需确定）\n  - 安全访问（编译器检查索引不越界）\n\n#### （2）切片的创建与访问\n\n```rust\nfn main() {\n    let arr = [1, 2, 3, 4, 5];\n    \n    // 方式1：指定范围（\u0026arr[start..end]）\n    let slice1 = \u0026arr[1..4]; // 索引1-3 → [2,3,4]\n    let slice2 = \u0026arr[2..];  // 从索引2到末尾 → [3,4,5]\n    let slice3 = \u0026arr[..3];  // 从开头到索引2 → [1,2,3]\n    let slice4 = \u0026arr[..];   // 整个数组 → [1,2,3,4,5]\n    \n    println!(\"slice1: {:?}\", slice1);\n    println!(\"slice1长度：{}\", slice1.len()); // 输出 3\n    \n    // 方式2：可变切片（原数组必须是 mut）\n    let mut arr_mut = [10, 20, 30];\n    let slice_mut = \u0026mut arr_mut[1..3];\n    slice_mut[0] = 200; // 修改切片 → 原数组也会变\n    println!(\"修改后数组：{:?}\", arr_mut); // 输出 [10, 200, 30]\n    \n    // 安全访问：用 get 方法（返回 Option，避免越界 panic）\n    match slice1.get(2) {\n        Some(val) =\u003e println!(\"slice1[2] = {}\", val), // 输出 4\n        None =\u003e println!(\"索引越界\"),\n    }\n}\n```\n\n#### （3）切片作为函数参数（最常用）\n\n- 核心优势：函数可接收任意长度的数组 /`Vec`（无需标注固定长度）\n- 示例：\n\n```rust\n// 切片作为参数（\u0026[i32] 可接收数组、Vec、其他切片）\nfn sum_slice(slice: \u0026[i32]) -\u003e i32 {\n    let mut total = 0;\n    for \u0026val in slice {\n        total += val;\n    }\n    total\n}\n\nfn main() {\n    let arr = [1, 2, 3];\n    let vec = vec![4, 5, 6]; // Vec（后续集合会讲）\n    let slice = \u0026[7, 8, 9];\n    \n    println!(\"数组求和：{}\", sum_slice(\u0026arr)); // 输出 6\n    println!(\"Vec求和：{}\", sum_slice(\u0026vec)); // 输出 15\n    println!(\"切片求和：{}\", sum_slice(slice)); // 输出 24\n}\n```\n\n### 关键注意事项\n\n- 切片不拥有数据：原数组 /`Vec` 被销毁后，切片也会失效（Rust 编译时检查生命周期）\n- 可变切片修改原数据：切片是视图，修改切片会直接修改原数据\n- 避免切片越界：用 `get(index)` 代替 `slice[index]`（越界时返回 `None` 而非 panic）\n- 数组 vs 切片：数组是固定长度栈上集合，切片是动态长度视图（推荐函数参数用切片）\n\n## 七、Rust 字符串\n\nRust 有两种字符串类型：`\u0026str`（字符串切片）和 `String`（动态字符串），核心区别是「是否拥有数据」和「是否可变」。\n\n### 1. 核心概念对比\n\n| 类型     | 所有权 | 可变性 | 存储位置 | 核心用途               |\n| -------- | ------ | ------ | -------- | ---------------------- |\n| `\u0026str`   | 无     | 不可变 | 栈 / 堆  | 字符串字面量、函数参数 |\n| `String` | 有     | 可变   | 堆       | 动态创建、修改字符串   |\n\n### 2. `\u0026str`：字符串切片\n\n- 语法：用双引号包裹的字面量（如 `\"hello\"`），本质是 `\u0026[u8]`（UTF-8 编码的字节切片）\n- 示例：\n\n```rust\nfn main() {\n    let s: \u0026str = \"hello, 世界\"; // 字符串字面量 → 编译时存入二进制文件，运行时在只读内存\n    \n    println!(\"长度：{}\", s.len()); // 输出 11（字节数：hello, 占7字节，世界占4字节）\n    println!(\"字符数：{}\", s.chars().count()); // 输出 8（实际字符数）\n    \n    // 截取切片（按字节索引，注意UTF-8编码，避免截断字符）\n    let slice1 = \u0026s[0..5]; // \"hello\"（安全，未截断字符）\n    println!(\"slice1: {}\", slice1);\n    \n    // 错误：截断中文字符（\"世\" 占3字节，索引7-9是\"世\"）\n    // let slice2 = \u0026s[7..8]; // 编译通过，但运行时 panic（invalid utf-8 sequence）\n}\n```\n\n### 3. `String`：动态字符串\n\n- 核心：在堆上分配内存，支持动态增删改，通过 `String::from(\"xxx\")` 或 `\"xxx\".to_string()` 创建\n- 常用操作示例：\n\n```rust\nfn main() {\n    // 创建 String\n    let mut s = String::from(\"hello\"); // 可变 String\n    let s2 = \"world\".to_string();\n    \n    // 拼接字符串（3种方式）\n    s.push('!'); // 追加单个字符 → \"hello!\"\n    s.push_str(\", rust\"); // 追加 \u0026str → \"hello!, rust\"\n    let s3 = s + \u0026s2; // 拼接两个 String（s 所有权转移给 s3，s 失效）\n    println!(\"s3: {}\", s3); // 输出 \"hello!, rustworld\"\n    \n    // 格式化拼接（推荐，支持多个变量）\n    let name = \"Alice\";\n    let age = 25;\n    let info = format!(\"姓名：{}, 年龄：{}\", name, age);\n    println!(\"info: {}\", info); // 输出 \"姓名：Alice, 年龄：25\"\n    \n    // 截取子串（安全方式：用 chars() 迭代）\n    let s4 = String::from(\" Rust 编程 \");\n    let trimmed = s4.trim(); // 去除首尾空格 → \"Rust 编程\"\n    let first_char = s4.chars().nth(1).unwrap(); // 获取第2个字符（R）\n    println!(\"trimmed: {}, first_char: {}\", trimmed, first_char);\n    \n    // 替换字符\n    let replaced = s4.replace(\"Rust\", \"RUST\");\n    println!(\"replaced: {}\", replaced); // 输出 \" RUST 编程 \"\n}\n```\n\n### 4. `\u0026str` 与 `String` 的转换\n\n```rust\nfn main() {\n    // String → \u0026str（自动解引用，无需手动转换）\n    let s: String = \"hello\".to_string();\n    let s_slice: \u0026str = \u0026s; // 直接取引用\n    \n    // \u0026str → String（3种方式）\n    let slice = \"world\";\n    let s1 = slice.to_string();\n    let s2 = String::from(slice);\n    let s3 = format!(\"{}\", slice);\n    \n    println!(\"s_slice: {}, s1: {}\", s_slice, s1);\n}\n```\n\n### 关键注意事项\n\n- UTF-8 编码：Rust 字符串默认是 UTF-8，不支持直接按索引访问字符（如 `s[0]` 是字节，不是字符），需用 `chars()` 迭代\n- 字符串拼接的所有权：`s + \u0026s2` 中，`s` 所有权会转移，`s2` 需传引用（避免所有权转移）\n- 空字符串：`String::new()`（空 String）、`\"\"`（空 \u0026str）\n- 避免字符串截断：截取切片时，必须确保索引落在 UTF-8 字符边界上（否则 panic），推荐用 `chars().nth(index)`\n\n## 八、Rust 结构体（Struct）\n\n结构体是 Rust 中自定义复合类型的核心，用于封装多个相关字段，支持方法定义、关联函数等面向对象特性。\n\n### 1. 结构体的 3 种类型\n\n#### （1）普通结构体（最常用）\n\n- 核心：包含命名字段，字段可是任意类型\n- 示例：\n\n```rust\n// 定义普通结构体（首字母大写，符合 Rust 规范）\nstruct Person {\n    name: String,    // 字符串（拥有所有权）\n    age: u32,        // 无符号整数\n    is_student: bool,// 布尔值\n}\n\nfn main() {\n    // 创建结构体实例（字段顺序可任意，需指定字段名）\n    let alice = Person {\n        name: \"Alice\".to_string(),\n        age: 25,\n        is_student: false,\n    };\n    \n    // 访问字段（.字段名）\n    println!(\"姓名：{}\", alice.name);\n    println!(\"年龄：{}\", alice.age);\n    \n    // 修改字段（结构体实例必须是 mut）\n    let mut bob = Person {\n        name: \"Bob\".to_string(),\n        age: 22,\n        is_student: true,\n    };\n    bob.age = 23; // 修改年龄\n    println!(\"Bob修改后年龄：{}\", bob.age);\n    \n    // 结构体更新语法（复用已有实例的字段）\n    let charlie = Person {\n        name: \"Charlie\".to_string(),\n        ..bob // 复用 bob 的 age 和 is_student 字段\n    };\n    println!(\"Charlie年龄：{}\", charlie.age); // 输出 23\n}\n```\n\n#### （2）元组结构体（Tuple Struct）\n\n- 核心：无字段名，仅字段类型，适合简单复合类型（如坐标、颜色）\n- 示例：\n\n```rust\n// 定义元组结构体\nstruct Point(i32, i32); // 坐标（x, y）\nstruct Color(u8, u8, u8); // RGB颜色（r, g, b）\n\nfn main() {\n    let p = Point(10, 20);\n    let red = Color(255, 0, 0);\n    \n    // 访问字段（点号+索引）\n    println!(\"x: {}, y: {}\", p.0, p.1);\n    println!(\"红色：({}, {}, {})\", red.0, red.1, red.2);\n    \n    // 解构赋值\n    let Point(x, y) = p;\n    println!(\"解构后 x: {}, y: {}\", x, y);\n}\n```\n\n#### （3）单元结构体（Unit Struct）\n\n- 核心：无字段，类似空元组 `()`，用于标记类型（如实现特质时）\n- 示例：\n\n```rust\n// 定义单元结构体\nstruct EmptyStruct;\n\nfn main() {\n    let es = EmptyStruct;\n    println!(\"单元结构体：{:?}\", es); // 输出 EmptyStruct（需手动实现 Debug 特质）\n}\n\n// 为单元结构体实现 Debug 特质（才能用 {:?} 打印）\n#[derive(Debug)]\nstruct EmptyStructDebug;\n\nfn main() {\n    let esd = EmptyStructDebug;\n    println!(\"单元结构体（Debug）：{:?}\", esd); // 输出 EmptyStructDebug\n}\n```\n\n### 2. 结构体方法（Method）\n\n- 核心：在 `impl` 块中定义，第一个参数必须是 `\u0026self`（不可变引用）、`\u0026mut self`（可变引用）或 `self`（所有权转移）\n- 示例：\n\n```rust\n#[derive(Debug)]\nstruct Rectangle {\n    width: u32,\n    height: u32,\n}\n\n// 为 Rectangle 实现方法（impl 块）\nimpl Rectangle {\n    // 不可变方法（只读访问 self）\n    fn area(\u0026self) -\u003e u32 {\n        self.width * self.height\n    }\n    \n    // 可变方法（修改 self，需 \u0026mut self）\n    fn scale(\u0026mut self, factor: f32) {\n        self.width = (self.width as f32 * factor) as u32;\n        self.height = (self.height as f32 * factor) as u32;\n    }\n    \n    // 关联函数（无 self，类似静态方法，用 :: 调用）\n    fn square(size: u32) -\u003e Self { // Self 是 Rectangle 的别名\n        Self {\n            width: size,\n            height: size,\n        }\n    }\n}\n\nfn main() {\n    let rect = Rectangle { width: 10, height: 20 };\n    println!(\"面积：{}\", rect.area()); // 调用方法：rect.area()\n    \n    let mut rect2 = Rectangle { width: 5, height: 5 };\n    rect2.scale(2.0);\n    println!(\"缩放后：{:?}\", rect2); // 输出 Rectangle { width: 10, height: 10 }\n    \n    // 调用关联函数（创建正方形）\n    let square = Rectangle::square(8);\n    println!(\"正方形：{:?}\", square); // 输出 Rectangle { width: 8, height: 8 }\n}\n```\n\n### 关键注意事项\n\n- 结构体字段所有权：字段可拥有所有权（如 `String`）或引用（如 `\u0026str`，需生命周期标注）\n- `impl` 块：一个结构体可有多个 `impl` 块，拆分代码更清晰\n- 方法参数 `self`：\n  - `\u0026self`：只读，不转移所有权（最常用）\n  - `\u0026mut self`：可修改，不转移所有权\n  - `self`：转移所有权（仅当方法需要消费结构体时使用）\n- 派生特质：用 `#[derive(Debug, Clone, Copy)]` 可自动实现常见特质（如 `Debug` 用于打印，`Clone` 用于复制）\n\n## 九、Rust 模式匹配（Pattern Matching）\n\n模式匹配是 Rust 中强大的控制流工具，通过 `match`、`if let`、`while let` 等语法，可简洁、安全地处理多种情况（如枚举、结构体、Option 等）。\n\n### 1. 核心概念\n\n- 模式：描述数据的结构（如 `Some(x)`、`Person { name, .. }`）\n- 匹配：将数据与模式对比，匹配成功则执行对应分支\n- 关键特性：**穷尽性检查**（编译器确保覆盖所有可能情况）、**解构赋值**（提取数据）\n\n### 2. `match` 表达式（最强大）\n\n#### （1）匹配枚举（后续枚举会讲，这里用 `Option` 示例）\n\n`Option\u003cT\u003e` 是 Rust 用于表示「可能有值或无值」的枚举，定义为：\n\n```rust\nenum Option\u003cT\u003e {\n    Some(T), // 有值\n    None,    // 无值\n}\n```\n\n- 示例：\n\n```rust\nfn get_value(num: Option\u003ci32\u003e) -\u003e i32 {\n    // match 穷尽匹配 Option 的所有情况（Some 和 None）\n    match num {\n        Some(x) =\u003e x * 2, // 匹配 Some，提取 x\n        None =\u003e 0,        // 匹配 None，返回默认值\n    }\n}\n\nfn main() {\n    let a = Some(5);\n    let b: Option\u003ci32\u003e = None;\n    \n    println!(\"a 的两倍：{}\", get_value(a)); // 输出 10\n    println!(\"b 的默认值：{}\", get_value(b)); // 输出 0\n}\n```\n\n#### （2）匹配结构体（解构字段）\n\n```rust\n#[derive(Debug)]\nstruct Point {\n    x: i32,\n    y: i32,\n}\n\nfn match_point(p: Point) {\n    match p {\n        // 匹配 x=0，忽略 y（用 _ 通配符）\n        Point { x: 0, y: _ } =\u003e println!(\"在 y 轴上\"),\n        // 匹配 y=0，提取 x（用 @ 绑定变量）\n        Point { x, y: 0 } =\u003e println!(\"在 x 轴上，x={}\", x),\n        // 匹配 x=y，绑定为 val\n        Point { x: val, y: val } =\u003e println!(\"x=y={}\", val),\n        // 匹配所有其他情况（用 .. 忽略剩余字段）\n        Point { .. } =\u003e println!(\"其他坐标：{:?}\", p),\n    }\n}\n\nfn main() {\n    match_point(Point { x: 0, y: 5 }); // 输出 在 y 轴上\n    match_point(Point { x: 3, y: 0 }); // 输出 在 x 轴上，x=3\n    match_point(Point { x: 4, y: 4 }); // 输出 x=y=4\n    match_point(Point { x: 2, y: 3 }); // 输出 其他坐标：Point { x: 2, y: 3 }\n}\n```\n\n#### （3）匹配数值与通配符\n\n```rust\nfn match_num(num: i32) {\n    match num {\n        1 =\u003e println!(\"一\"),\n        2 | 3 =\u003e println!(\"二或三\"), // 多模式匹配（用 | 分隔）\n        4..=9 =\u003e println!(\"四到九\"), // 范围匹配（..= 包含终点）\n        _ =\u003e println!(\"其他数字\"),   // 通配符（匹配所有未覆盖的情况，避免穷尽性错误）\n    }\n}\n\nfn main() {\n    match_num(1); // 一\n    match_num(3); // 二或三\n    match_num(7); // 四到九\n    match_num(10); // 其他数字\n}\n```\n\n### 3. `if let`：简化单分支匹配\n\n- 核心用途：当只关心一种匹配情况，其他情况忽略时，替代 `match`（更简洁）\n- 示例：\n\n```rust\nfn main() {\n    let opt = Some(3);\n    \n    // 等价于 match opt { Some(x) =\u003e println!(\"x={}\", x), _ =\u003e {} }\n    if let Some(x) = opt {\n        println!(\"x={}\", x); // 输出 x=3\n    }\n    \n    let point = Point { x: 0, y: 5 };\n    // 匹配结构体的单个情况\n    if let Point { x: 0, .. } = point {\n        println!(\"在 y 轴上\"); // 输出 在 y 轴上\n    }\n}\n```\n\n### 4. `while let`：循环匹配\n\n- 核心用途：当循环中只关心一种匹配情况时，持续执行直到不匹配\n- 示例：\n\n```rust\nfn main() {\n    let mut stack = vec![1, 2, 3];\n    \n    // 持续弹出栈顶元素，直到栈为空（None）\n    while let Some(val) = stack.pop() {\n        println!(\"弹出：{}\", val); // 输出 3、2、1\n    }\n}\n```\n\n### 关键注意事项\n\n- 穷尽性检查：`match` 必须覆盖所有可能情况，否则编译错误（如 `Option` 必须匹配 `Some` 和 `None`）\n- 通配符 `_`：用于忽略不需要的字段或值，避免穷尽性错误\n- 绑定变量：用 `@` 可将匹配的部分绑定为变量（如 `x @ 1..=10`）\n- 多模式匹配：用 `|` 分隔多个模式（如 `2 | 3` 匹配 2 或 3）\n\n## 十、Rust 常见集合\n\nRust 标准库提供了多种常用集合（存储在堆上，动态长度），核心包括 `Vec\u003cT\u003e`（动态数组）、`HashMap\u003cK, V\u003e`（键值对）、`HashSet\u003cT\u003e`（无序集合）等。\n\n### 1. `Vec\u003cT\u003e`：动态数组（最常用）\n\n- 核心特性：动态长度、随机访问、尾部增删高效\n- 语法：`Vec::new()` 创建空 Vec，`vec![]` 宏快速创建\n- 常用操作示例：\n\n```rust\nfn main() {\n    // 创建 Vec（3种方式）\n    let mut v1: Vec\u003ci32\u003e = Vec::new();\n    let mut v2 = vec![1, 2, 3]; // 宏创建，自动推导类型\n    let v3 = vec![0; 5]; // 创建 5 个 0 的 Vec → [0,0,0,0,0]\n    \n    // 尾部添加元素\n    v1.push(4);\n    v1.push(5);\n    println!(\"v1: {:?}\", v1); // 输出 [4,5]\n    \n    // 访问元素（2种方式）\n    println!(\"v2[0]: {}\", v2[0]); // 索引访问（越界 panic）\n    match v2.get(1) { // get 方法（越界返回 None，安全）\n        Some(val) =\u003e println!(\"v2[1]: {}\", val), // 输出 2\n        None =\u003e println!(\"索引越界\"),\n    }\n    \n    // 遍历 Vec\n    for val in \u0026v2 {\n        println!(\"{}\", val); // 输出 1、2、3\n    }\n    \n    // 可变遍历（修改元素）\n    for val in \u0026mut v2 {\n        *val *= 2; // 每个元素乘 2\n    }\n    println!(\"v2 乘 2 后：{:?}\", v2); // 输出 [2,4,6]\n    \n    // 插入、删除元素\n    v2.insert(1, 3); // 在索引1插入 3 → [2,3,4,6]\n    v2.remove(3); // 删除索引3的元素 → [2,3,4]\n    println!(\"v2 插入删除后：{:?}\", v2);\n    \n    // 转换为切片\n    let slice = \u0026v2[1..3];\n    println!(\"切片：{:?}\", slice); // 输出 [3,4]\n}\n```\n\n### 2. `HashMap\u003cK, V\u003e`：键值对集合\n\n- 核心特性：无序、键唯一、基于哈希表实现，需从 `std::collections` 导入\n- 常用操作示例：\n\n```rust\n// 必须导入 HashMap\nuse std::collections::HashMap;\n\nfn main() {\n    // 创建 HashMap（2种方式）\n    let mut map1: HashMap\u003c\u0026str, i32\u003e = HashMap::new();\n    let mut map2 = HashMap::from([(\"a\", 1), (\"b\", 2)]); // Rust 1.56+ 支持\n    \n    // 插入键值对（若键已存在，会覆盖值）\n    map1.insert(\"Alice\", 25);\n    map1.insert(\"Bob\", 22);\n    map1.insert(\"Alice\", 26); // 覆盖 Alice 的年龄为 26\n    \n    // 访问值（2种方式）\n    println!(\"Alice 的年龄：{}\", map1[\"Alice\"]); // 索引访问（键不存在 panic）\n    match map1.get(\"Bob\") { // get 方法（键不存在返回 None）\n        Some(age) =\u003e println!(\"Bob 的年龄：{}\", age), // 输出 22\n        None =\u003e println!(\"Bob 不存在\"),\n    }\n    \n    // 遍历 HashMap（无序）\n    for (key, value) in \u0026map1 {\n        println!(\"{}: {}\", key, value); // 输出 Alice:26、Bob:22（顺序不确定）\n    }\n    \n    // 插入时检查键是否存在（避免覆盖）\n    map1.entry(\"Charlie\").or_insert(23); // 若 Charlie 不存在，插入 23\n    map1.entry(\"Alice\").or_insert(30); // 若 Alice 存在，不修改\n    println!(\"map1 插入后：{:?}\", map1);\n    \n    // 更新值（基于旧值）\n    let age = map1.entry(\"Bob\").or_insert(0);\n    *age += 1; // Bob 的年龄加 1 → 23\n    println!(\"Bob 更新后年龄：{}\", map1[\"Bob\"]);\n}\n```\n\n### 3. `HashSet\u003cT\u003e`：无序集合（无重复元素）\n\n- 核心特性：无序、元素唯一、基于哈希表，需从 `std::collections` 导入\n- 示例：\n\n```rust\nuse std::collections::HashSet;\n\nfn main() {\n    let mut set = HashSet::from([1, 2, 3, 3]); // 自动去重 → {1,2,3}\n    \n    // 插入元素（重复元素会被忽略）\n    set.insert(4);\n    set.insert(2); // 重复，无效果\n    \n    // 检查元素是否存在\n    println!(\"是否包含 3：{}\", set.contains(\u00263)); // 输出 true\n    \n    // 遍历集合（无序）\n    for val in \u0026set {\n        println!(\"{}\", val); // 输出 1、2、3、4（顺序不确定）\n    }\n    \n    // 集合操作（交集、并集、差集）\n    let set2 = HashSet::from([3, 4, 5]);\n    let intersection: HashSet\u003c_\u003e = set.intersection(\u0026set2).collect(); // 交集 {3,4}\n    let union: HashSet\u003c_\u003e = set.union(\u0026set2).collect(); // 并集 {1,2,3,4,5}\n    let difference: HashSet\u003c_\u003e = set.difference(\u0026set2).collect(); // 差集 {1,2}\n    \n    println!(\"交集：{:?}\", intersection);\n    println!(\"并集：{:?}\", union);\n    println!(\"差集：{:?}\", difference);\n}\n```\n\n### 关键注意事项\n\n- 集合的可变性：所有集合的修改操作（`push`、`insert`、`remove`）都需要 `mut` 关键字\n- `HashMap` 的键要求：键必须实现 `Eq` 和 `Hash` 特质（标量类型、`String` 等默认实现）\n- 遍历顺序：`HashMap` 和 `HashSet` 是无序的，若需要有序，用 `BTreeMap`/`BTreeSet`\n- 内存管理：集合存储在堆上，元素被自动销毁（所有权由集合拥有）\n\n## 十一、Rust 返回值与错误处理\n\nRust 的错误处理哲学是「显式错误」，避免隐式异常（如 Java 的 `Exception`），核心通过 `Result\u003cT, E\u003e` 处理可恢复错误，`panic!` 处理不可恢复错误。\n\n### 1. 不可恢复错误：`panic!`\n\n- 核心用途：处理逻辑错误（如数组越界、断言失败），触发后程序终止并打印调用栈\n- 示例：\n\n```rust\nfn main() {\n    // 手动触发 panic\n    // panic!(\"程序异常终止\");\n    \n    let arr = [1, 2, 3];\n    // 数组越界 → 自动 panic（调试模式下打印详细调用栈）\n    // println!(\"{}\", arr[5]);\n}\n```\n\n- 注意：发布模式（`cargo build --release`）下，`panic!` 会优化调用栈打印，仅输出错误信息\n\n### 2. 可恢复错误：`Result\u003cT, E\u003e`\n\n`Result\u003cT, E\u003e` 是 Rust 用于表示「成功返回 T 类型」或「失败返回 E 类型」的枚举，定义为：\n\n```rust\nenum Result\u003cT, E\u003e {\n    Ok(T),  // 成功\n    Err(E), // 失败\n}\n```\n\n#### （1）返回 `Result` 并匹配处理\n\n```rust\nuse std::fs::File;\n\n// 读取文件：成功返回 File，失败返回 io::Error\nfn read_file(path: \u0026str) -\u003e Result\u003cFile, std::io::Error\u003e {\n    File::open(path) // File::open 本身返回 Result\u003cFile, io::Error\u003e\n}\n\nfn main() {\n    match read_file(\"test.txt\") {\n        Ok(file) =\u003e println!(\"文件打开成功：{:?}\", file),\n        Err(e) =\u003e println!(\"文件打开失败：{}\", e), // 输出错误信息（如 \"No such file or directory\"）\n    }\n}\n```\n\n#### （2）`?` 操作符：简化错误传播\n\n- 核心用途：当函数返回 `Result` 时，用 `?` 自动处理 `Err`（直接返回错误），仅保留 `Ok` 的值\n- 示例：\n\n```rust\nuse std::fs::File;\nuse std::io::{self, Read};\n\n// 读取文件内容：错误自动传播（无需手动 match）\nfn read_file_content(path: \u0026str) -\u003e Result\u003cString, io::Error\u003e {\n    let mut file = File::open(path)?; // ? 自动处理 Err：返回错误\n    let mut content = String::new();\n    file.read_to_string(\u0026mut content)?; // ? 再次传播错误\n    Ok(content) // 成功返回 Ok(content)\n}\n\nfn main() {\n    match read_file_content(\"test.txt\") {\n        Ok(content) =\u003e println!(\"文件内容：{}\", content),\n        Err(e) =\u003e println!(\"读取失败：{}\", e),\n    }\n}\n```\n\n#### （3）自定义错误类型\n\n- 核心：通过枚举定义自定义错误类型，实现 `std::error::Error` 特质（用于统一错误处理）\n- 示例：\n\n```rust\nuse std::error::Error;\nuse std::fmt;\n\n// 自定义错误类型\n#[derive(Debug)]\nenum MyError {\n    FileError(std::io::Error),    // 包装 IO 错误\n    ParseError(String),           // 解析错误\n}\n\n// 实现 fmt::Display（错误信息格式化）\nimpl fmt::Display for MyError {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter) -\u003e fmt::Result {\n        match self {\n            MyError::FileError(e) =\u003e write!(f, \"文件错误：{}\", e),\n            MyError::ParseError(s) =\u003e write!(f, \"解析错误：{}\", s),\n        }\n    }\n}\n\n// 实现 Error 特质（标记为错误类型）\nimpl Error for MyError {}\n\n// 包装 IO 错误（从 io::Error 转换为 MyError）\nimpl From\u003cstd::io::Error\u003e for MyError {\n    fn from(e: std::io::Error) -\u003e Self {\n        MyError::FileError(e)\n    }\n}\n\n// 读取并解析文件（返回自定义错误）\nfn parse_file(path: \u0026str) -\u003e Result\u003ci32, MyError\u003e {\n    let content = read_file_content(path)?; // ? 自动将 io::Error 转换为 MyError（因 From 实现）\n    content.parse().map_err(|_| MyError::ParseError(\"无法转换为整数\".to_string()))\n}\n\nfn main() {\n    match parse_file(\"number.txt\") {\n        Ok(num) =\u003e println!(\"解析结果：{}\", num),\n        Err(e) =\u003e println!(\"错误：{}\", e),\n    }\n}\n```\n\n### 关键注意事项\n\n- `?` 的使用限制：只能在返回 `Result` 或 `Option` 的函数中使用\n- 错误转换：用 `From` 特质可自动将一种错误转换为另一种（如 `io::Error` → 自定义错误）\n- 错误链：用 `source()` 方法可获取原始错误（需实现 `Error` 特质）\n- 优先用 `Result` 而非 `panic!`：除逻辑错误外，尽量返回 `Result` 让调用者处理错误（更灵活）\n\n## 十二、Rust 模块化\n\nRust 的模块化系统用于组织代码（拆分文件、控制访问权限），核心是 `mod`（定义模块）、`pub`（暴露公共接口）、`use`（导入模块 / 成员）。\n\n### 1. 核心概念\n\n- 模块（Module）：代码的逻辑分组（如 `user` 模块、`utils` 模块）\n- 包（Crate）：Rust 的编译单元（可执行程序或库）\n- 路径（Path）：访问模块成员的方式（如 `crate::user::User`、`std::fs::File`）\n- 访问控制：默认私有（模块内可见），用 `pub` 标记为公共（外部可访问）\n\n### 2. 单文件模块\n\n#### （1）定义模块与访问控制\n\n```rust\n// 定义模块（默认私有）\nmod utils {\n    // 私有函数（仅 utils 模块内可见）\n    fn private_func() {\n        println!(\"utils::private_func\");\n    }\n    \n    // 公共函数（外部可访问）\n    pub fn public_func() {\n        println!(\"utils::public_func\");\n        private_func(); // 模块内可访问私有函数\n    }\n    \n    // 嵌套模块\n    pub mod math {\n        pub fn add(a: i32, b: i32) -\u003e i32 {\n            a + b\n        }\n    }\n}\n\n// 定义公共模块（直接暴露给外部）\npub mod user {\n    // 公共结构体\n    pub struct User {\n        pub name: String, // 公共字段\n        age: u32,         // 私有字段（仅 user 模块内可见）\n    }\n    \n    impl User {\n        // 公共构造函数\n        pub fn new(name: \u0026str, age: u32) -\u003e Self {\n            Self {\n                name: name.to_string(),\n                age,\n            }\n        }\n        \n        // 公共方法（访问私有字段）\n        pub fn get_age(\u0026self) -\u003e u32 {\n            self.age\n        }\n    }\n}\n\nfn main() {\n    // 访问模块成员：路径方式\n    utils::public_func(); // 输出 utils::public_func → utils::private_func\n    let sum = utils::math::add(3, 5);\n    println!(\"sum: {}\", sum); // 输出 8\n    \n    // 访问公共结构体\n    let u = user::User::new(\"Alice\", 25);\n    println!(\"姓名：{}\", u.name); // 访问公共字段\n    println!(\"年龄：{}\", u.get_age()); // 通过方法访问私有字段\n    \n    // 错误：无法访问私有成员\n    // utils::private_func();\n    // println!(\"{}\", u.age);\n}\n```\n\n#### （2）`use` 关键字：简化路径\n\n```rust\n// 导入模块成员，简化访问\nuse utils::math::add;\nuse user::User;\n\nfn main() {\n    // 无需写完整路径\n    let sum = add(3, 5);\n    println!(\"sum: {}\", sum);\n    \n    let u = User::new(\"Bob\", 22);\n    println!(\"姓名：{}\", u.name);\n    \n    // 导入整个模块\n    use utils::math;\n    println!(\"math::add(2,3) = {}\", math::add(2,3));\n    \n    // 别名导入（避免冲突）\n    use utils::public_func as pub_func;\n    pub_func();\n}\n```\n\n### 3. 多文件模块（实际项目常用）\n\n当模块代码较多时，可拆分为独立文件，目录结构如下：\n\n```plaintext\nsrc/\n├── main.rs          # 入口文件\n├── utils/           # utils 模块目录\n│   ├── mod.rs       # utils 模块入口（必须）\n│   └── math.rs      # utils::math 模块\n└── user.rs          # user 模块\n```\n\n#### （1）`src/user.rs`（user 模块）\n\n```rust\n// 公共结构体\npub struct User {\n    pub name: String,\n    age: u32,\n}\n\nimpl User {\n    pub fn new(name: \u0026str, age: u32) -\u003e Self {\n        Self {\n            name: name.to_string(),\n            age,\n        }\n    }\n    \n    pub fn get_age(\u0026self) -\u003e u32 {\n        self.age\n    }\n}\n```\n\n#### （2）`src/utils/math.rs`（utils::math 模块）\n\n```rust\npub fn add(a: i32, b: i32) -\u003e i32 {\n    a + b\n}\n\npub fn multiply(a: i32, b: i32) -\u003e i32 {\n    a * b\n}\n```\n\n#### （3）`src/utils/mod.rs`（utils 模块入口）\n\n```rust\n// 私有函数\nfn private_func() {\n    println!(\"utils::private_func\");\n}\n\n// 公共函数\npub fn public_func() {\n    println!(\"utils::public_func\");\n    private_func();\n}\n\n// 导入 math 模块（公共暴露）\npub mod math; // 对应 math.rs 文件\n```\n\n#### （4）`src/main.rs`（入口文件）\n\n```rust\n// 导入多文件模块\nmod utils; // 对应 utils/mod.rs\nmod user;  // 对应 user.rs\n\n// 简化访问\nuse utils::math::{add, multiply};\nuse user::User;\n\nfn main() {\n    utils::public_func();\n    \n    println!(\"add(3,5) = {}\", add(3,5));\n    println!(\"multiply(2,4) = {}\", multiply(2,4));\n    \n    let u = User::new(\"Charlie\", 30);\n    println!(\"{}: {}\", u.name, u.get_age());\n}\n```\n\n### 关键注意事项\n\n- 模块命名规范：模块名用小写蛇形命名（如 `utils_math`）\n- `pub` 的作用范围：`pub` 仅暴露给父模块，子模块的公共成员需显式标记\n- `mod.rs` 的作用：目录模块必须有 `mod.rs`（Rust 2018+ 也支持直接用目录名.rs，但 `mod.rs` 更通用）\n- 绝对路径 vs 相对路径：\n  - 绝对路径：从 crate 根开始（如 `crate::utils::math::add`）\n  - 相对路径：从当前模块开始（如 `super::parent_func`，`super` 表示父模块）"])</script><script>self.__next_f.push([1,"53:T161a6,"])</script><script>self.__next_f.push([1,"var Component=(()=\u003e{var u=Object.create;var c=Object.defineProperty;var p=Object.getOwnPropertyDescriptor;var m=Object.getOwnPropertyNames;var g=Object.getPrototypeOf,f=Object.prototype.hasOwnProperty;var _=(l,n)=\u003e()=\u003e(n||l((n={exports:{}}).exports,n),n.exports),b=(l,n)=\u003e{for(var r in n)c(l,r,{get:n[r],enumerable:!0})},t=(l,n,r,d)=\u003e{if(n\u0026\u0026typeof n==\"object\"||typeof n==\"function\")for(let i of m(n))!f.call(l,i)\u0026\u0026i!==r\u0026\u0026c(l,i,{get:()=\u003en[i],enumerable:!(d=p(n,i))||d.enumerable});return l};var y=(l,n,r)=\u003e(r=l!=null?u(g(l)):{},t(n||!l||!l.__esModule?c(r,\"default\",{value:l,enumerable:!0}):r,l)),v=l=\u003et(c({},\"__esModule\",{value:!0}),l);var s=_((x,h)=\u003e{h.exports=_jsx_runtime});var S={};b(S,{default:()=\u003ea});var e=y(s());function o(l){let n={code:\"code\",h2:\"h2\",h3:\"h3\",h4:\"h4\",li:\"li\",ol:\"ol\",p:\"p\",pre:\"pre\",strong:\"strong\",table:\"table\",tbody:\"tbody\",td:\"td\",th:\"th\",thead:\"thead\",tr:\"tr\",ul:\"ul\",...l.components};return(0,e.jsxs)(e.Fragment,{children:[(0,e.jsx)(n.h2,{children:\"\\u4E00\\u3001Rust \\u57FA\\u7840\\u7C7B\\u578B\"}),`\n`,(0,e.jsxs)(n.p,{children:[\"Rust \\u662F \",(0,e.jsx)(n.strong,{children:\"\\u9759\\u6001\\u7C7B\\u578B\\u8BED\\u8A00\"}),\"\\uFF08\\u7F16\\u8BD1\\u65F6\\u786E\\u5B9A\\u7C7B\\u578B\\uFF09\\uFF0C\\u57FA\\u7840\\u7C7B\\u578B\\u5206\\u4E3A\\u300C\\u6807\\u91CF\\u7C7B\\u578B\\u300D\\uFF08\\u5355\\u4E2A\\u503C\\uFF09\\u548C\\u300C\\u590D\\u5408\\u7C7B\\u578B\\u300D\\uFF08\\u591A\\u4E2A\\u503C\\u7EC4\\u5408\\uFF09\\uFF0C\\u7C7B\\u578B\\u6807\\u6CE8\\u53EF\\u7701\\u7565\\uFF08\\u7F16\\u8BD1\\u5668\\u81EA\\u52A8\\u63A8\\u5BFC\\uFF09\\uFF0C\\u4F46\\u590D\\u6742\\u573A\\u666F\\u5FC5\\u987B\\u663E\\u5F0F\\u6807\\u6CE8\\u3002\"]}),`\n`,(0,e.jsx)(n.h3,{children:\"1. \\u6807\\u91CF\\u7C7B\\u578B\\uFF084 \ edAt\":\"2024-12-12\",\"updatedAt\":\"2024-12-12\",\"author\":\"John Doe\",\"summary\":\"Learn how to design APIs that developers love to use and are easy to maintain.\",\"image\":\"https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=800\u0026h=192\u0026fit=crop\",\"content\":\"$27\",\"_meta\":{\"filePath\":\"api-design-principles.mdx\",\"fileName\":\"api-design-principles.mdx\",\"directory\":\".\",\"extension\":\"mdx\",\"path\":\"api-design-principles\"},\"mdx\":\"$28\"},{\"title\":\"Git Workflow Guide: From Chaos to Clarity\",\"publishedAt\":\"2024-12-10\",\"updatedAt\":\"2024-12-10\",\"author\":\"John Doe\",\"summary\":\"Master Git workflows that keep your team productive and your codebase healthy.\",\"image\":\"https://images.unsplash.com/photo-1556075798-4825dfaaf498?w=800\u0026h=192\u0026fit=crop\",\"content\":\"# Git Workflow Guide: From Chaos to Clarity\\n\\nGit is powerful, but teams usually struggle because they don’t agree on a few basics. A simple workflow keeps history readable, reviews focused, and releases less stressful.\\n\\nThis is a lightweight guide you can adopt in a day and iterate on later.\\n\\n## A simple team workflow\\n\\n- Branch from `main` for every change.\\n- Keep branches small and short-lived.\\n- Open a pull request early and ask for review.\\n- Merge back to `main` once tests pass.\\n\\n## Commit message tips\\n\\n- Start with a clear verb (“add”, “fix”, “remove”, “refactor”).\\n- Keep the first line short and specific.\\n- Prefer multiple small commits over one giant “WIP”.\\n\\n## PR checklist\\n\\n1. Explain what changed and why.\\n2. Link the issue or describe the user impact.\\n3. Add tests (or explain why not).\\n4. Keep the diff small enough to review quickly.\\n\\n## Wrap-up\\n\\nThe goal isn’t “perfect Git” — it’s fewer surprises and faster collaboration. Start simple, write down the rules, and improve them as your team grows.\",\"_meta\":{\"filePath\":\"git-workflow-guide.mdx\",\"fileName\":\"git-workflow-guide.m avaScript bundle. Keep client components small and focused:\\n\\n## 6. Bundle Analysis\\n\\n```bash title=\\\"terminal\\\"\\n# Install analyzer\\nnpm install @next/bundle-analyzer\\n\\n# Run analysis\\nANALYZE=true npm run build\\n```\",\"_meta\":{\"filePath\":\"nextjs-performance-tips.mdx\",\"fileName\":\"nextjs-performance-tips.mdx\",\"directory\":\".\",\"extension\":\"mdx\",\"path\":\"nextjs-performance-tips\"},\"mdx\":\"$2c\"},{\"title\":\"Building Scalable Design Systems with React and Tailwind\",\"publishedAt\":\"2024-12-01\",\"updatedAt\":\"2024-12-01\",\"author\":\"John Doe\",\"summary\":\"A comprehensive guide to creating maintainable design systems that scale with your team and product.\",\"image\":\"https://images.unsplash.com/photo-1558655146-9f40138edfeb?w=800\u0026h=192\u0026fit=crop\",\"content\":\"$2d\",\"_meta\":{\"filePath\":\"building-design-systems.mdx\",\"fileName\":\"building-design-systems.mdx\",\"directory\":\".\",\"extension\":\"mdx\",\"path\":\"building-design-systems\"},\"mdx\":\"$2e\"},{\"title\":\"Mastering Remote Work: Productivity Tips from a Digital Nomad\",\"publishedAt\":\"2024-11-25\",\"updatedAt\":\"2024-11-25\",\"author\":\"John Doe\",\"summary\":\"Practical strategies for staying productive, focused, and balanced while working remotely, based on years of experience.\",\"image\":\"https://images.unsplash.com/photo-1521791136064-7986c2920216?w=800\u0026h=192\u0026fit=crop\",\"content\":\"$2f\",\"_meta\":{\"filePath\":\"remote-work-productivity.mdx\",\"fileName\":\"remote-work-productivity.mdx\",\"directory\":\".\",\"extension\":\"mdx\",\"path\":\"remote-work-productivity\"},\"mdx\":\"$30\"},{\"title\":\"High-Performance Gateway\",\"publishedAt\":\"2024-06-02\",\"updatedAt\":\"2024-06-02\",\"author\":\"RockJiang\",\"summary\":\"无意中在github上发现了一款rust语言编写的网关，通过简单的性能测试发现rwp的性能比nginx的要好很多。于是就有了接下来的大规模性能测试对比。\",\"content\":\"$31\",\"_meta\":{\"filePath\":\"rock_waypoint.mdx\",\"fileName\":\"rock_waypoint.mdx\",\"directory\":\".\",\"exten \"rust-memory-alloc-dealloc-leak\"},\"mdx\":\"$44\"},{\"title\":\"rust pin\u0026unpin\",\"publishedAt\":\"2023-06-29\",\"updatedAt\":\"2023-06-29\",\"author\":\"RockJiang\",\"summary\":\"想要理解pin与unpin主要要理解数据再移动的时候的不安全。就知道了pin的重要性。 struct SelfRef { value: String, ptr: *mut String, }\",\"content\":\"$45\",\"_meta\":{\"filePath\":\"rust-pin-and-unpin.mdx\",\"fileName\":\"rust-pin-and-unpin.mdx\",\"directory\":\".\",\"extension\":\"mdx\",\"path\":\"rust-pin-and-unpin\"},\"mdx\":\"$46\"},{\"title\":\"rust reborrow\",\"publishedAt\":\"2023-06-20\",\"updatedAt\":\"2023-06-20\",\"author\":\"RockJiang\",\"summary\":\"三个知识点：\",\"content\":\"$47\",\"_meta\":{\"filePath\":\"rust-reborrow.mdx\",\"fileName\":\"rust-reborrow.mdx\",\"directory\":\".\",\"extension\":\"mdx\",\"path\":\"rust-reborrow\"},\"mdx\":\"$48\"},{\"title\":\"rust string literals - String preixes\",\"publishedAt\":\"2023-05-18\",\"updatedAt\":\"2023-05-19\",\"author\":\"RockJiang\",\"summary\":\"let str = 'rockjiang'; println!('{}', str); let str = r'rockjiang'; println!('{}', str);\",\"content\":\"# 原始自负标识符 - raw字符串\\n\\n### 如下两种是同一个意思，只是说加了r的字符串属于《原始字符串》里边可以包含一些特殊的字符。\\n\\n```rust\\n    let str = \\\"rockjiang\\\";\\n    println!(\\\"{}\\\", str);\\n    let str = r\\\"rockjiang\\\";\\n    println!(\\\"{}\\\", str);\\n```\\n\\n### 增加了《原始字符串》标识符的字符串内部的转义全部都会被取消。\\n\\n```rust\\n\\tlet str = \\\"rockjiang\\\\nrockjiang\\\";\\n    println!(\\\"{}\\\", str);\\n    let str = r\\\"rockjiang\\\\nrockjiang\\\";\\n    println!(\\\"{}\\\", str);\\n```\\n\\n### 如果字符串内包含双引号，rust增加了r#的方式\\n\\n```rust\\n    let str = r#\\\"rock\\\"\\\"\\\"jiang\\\"#;\\n    println!(\\\"{}\\\", str);\\n```\\n\\n### 来限定字符串的开始和结束\\n\\n```rust\\n    let str = r##\\\"rock\\\"#\\\"jiang\\\"##;\\n    println!(\\\"{}\\\", str);\\n```\\n\\n### 如果字符串中同样包含#，那么可以增加限定开始结束字符串的#数量即可。只要开始和结束的#比字符串内的#多，即可。\\n\\n```rust\\n    let str = r#####\\\"rock\\\"#\\\"#\\\"#\\\"jiang\\\"#####;\\n    println!(\\\"{}\\\", str);\\n```\\n\\n### 字节字符串 - ASCII字节字面值\\n\\nbyte数组\\n```rust\\n    let str = b\\\"rockjiang\\\";\\n    println!(\\\"{:?}\\\", str);\\n```\\n\\n### 两者组合使用\\n\\n```rust\\n    let str = br#####\\\"rock\\\"####\\\"jiang\\\"#####;\\n    println!(\\\"{:?}\\\", str);\\n```\",\"_meta\":{\"filePath\":\"rust-string-literals-string-prefixes.mdx\",\"fileName\":\"rust-string-literals-string-prefixes.mdx\",\"directory\":\".\",\"extension\":\"mdx\",\"path\":\"rust-string-literals-string-prefixes\"},\"mdx\":\"$49\"},{\"title\":\"rust multi-threaded interaction, thread pool, performance comparison, underlying principle analysis, CPU-bound\",\"publishedAt\":\"2023-05-16\",\"updatedAt\":\"2023-05-16\",\"author\":\"RockJiang\",\"summary\":\"| 名字 | 版本号       | | ---- | ------------ | | rust | 1.69.0       | | OS   | ubuntu 22.04 |\",\"content\":\"$4a\",\"_meta\":{\"filePath\":\"rust-multi-threaded-interaction.mdx\",\"fileName\":\"rust-multi-threaded-interaction.mdx\",\"directory\":\".\",\"extension\":\"mdx\",\"path\":\"rust-multi-threaded-interaction\"},\"mdx\":\"$4b\"},{\"title\":\"rust send\u0026sync\",\"publishedAt\":\"2023-04-20\",\"updatedAt\":\"2023-04-20\",\"author\":\"RockJiang\",\"summary\":\"简单讲一下，看不懂的网上其他文章都有的，有更详细的，easy的很。我只说通俗易懂的。 * Send： 变量可以在线程之间移动。说白了就是move语义，说的是变量可以通过move语义可以在线程之间传递。 * Sync： 变量可以同一时间...\",\"content\":\"$4c\",\"_meta\":{\"filePath\":\"rust-send-sync.mdx\",\"fileName\":\"rust-send-sync.mdx\",\"directory\":\".\",\"extension\":\"mdx\",\"path\":\"rust-send-sync\"},\"mdx\":\"$4d\"},{\"title\":\"rust ownership\",\"publishedAt\":\"2023-03-29\",\"updatedAt\":\"2023-03-29\",\"author\":\"RockJiang\",\"summary\":\"在rust中，每一个value都有一个var也就是变量(所有者)，这时这个var对于这个value具有所有权。 所有权可以：move。 所有权可以：borrow。\",\"content\":\"$4e\",\"_meta\":{\"filePath\":\"rust-ownership.mdx\",\"fileName\":\"rust-ownership.mdx\",\"directory\":\".\",\"extension\":\"mdx\",\"path\":\"rust-ownership\"},\"mdx\":\"$4f\"},{\"title\":\"rust smart pointers\",\"publishedAt\":\"2023-03-20\",\"updatedAt\":\"2023-03-20\",\"author\":\"RockJiang\",\"summary\
